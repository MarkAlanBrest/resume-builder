/* ===========================
   STORAGE
=========================== */
function getData() {
  return JSON.parse(localStorage.getItem("resumeData")) || {};
}

function setData(data) {
  localStorage.setItem("resumeData", JSON.stringify(data));
}

/* ===========================
   LIMITS
=========================== */
const MAX_ITEMS = 10;
const MIN_SUGGESTED = 3;

function suggestMinimumCounts(skillCount, certCount) {
  const parts = [];
  if (skillCount < MIN_SUGGESTED) parts.push(`skills (you have ${skillCount})`);
  if (certCount < MIN_SUGGESTED) parts.push(`certifications (you have ${certCount})`);
  if (!parts.length) return;
  alert(`Suggestion: Resumes usually look stronger with at least ${MIN_SUGGESTED} ${parts.join(' and ')}. Add more if you can, or continue with what you have.`);
}

function buildItemRows(container, values, placeholder) {
  container.innerHTML = "";
  values.forEach(value => {
    const row = document.createElement("div");
    row.className = "row";
    const input = document.createElement("input");
    input.type = "text";
    input.value = value;
    input.placeholder = placeholder;
    row.appendChild(input);
    container.appendChild(row);
  });
}

function buildSkillCertRows(programItems, placeholder) {
  const rows = [...programItems].slice(0, MAX_ITEMS);
  while (rows.length < MAX_ITEMS) rows.push("");
  return rows;
}

/* ===========================
   PAGE LOAD
=========================== */
window.onload = function () {
  const data = getData();
  const program = data.programCampus || "";

  document.getElementById("programDisplay").textContent =
    `Program Selected: ${program}`;

  buildItemRows(
    document.getElementById("certItems"),
    buildSkillCertRows(PROGRAM_CERTS[program] || [], "Certification"),
    "Certification"
  );

  buildItemRows(
    document.getElementById("skillItems"),
    buildSkillCertRows(PROGRAM_SKILLS[program] || [], "Skill"),
    "Skill"
  );
};

/* ===========================
   NAVIGATION
=========================== */
function goBack() {
  window.location.href = "work.html";
}

function goNext() {
  const data = getData();

  const certs = Array.from(document.querySelectorAll("#certItems input"))
    .map(i => i.value.trim())
    .filter(Boolean)
    .slice(0, MAX_ITEMS);

  const skills = Array.from(document.querySelectorAll("#skillItems input"))
    .map(i => i.value.trim())
    .filter(Boolean)
    .slice(0, MAX_ITEMS);

  suggestMinimumCounts(skills.length, certs.length);

  data.allCerts = certs.join("\n");
  data.allSkills = skills.join("\n");

  setData(data);
  window.location.href = "education-military-v2.html";
}
