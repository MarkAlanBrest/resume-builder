<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Cover Letter Builder</title>
<script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue-900:#1e3a8a;--blue-700:#1d4ed8;--blue-100:#dbeafe;--blue-50:#eff6ff;
  --slate-900:#0f172a;--slate-700:#334155;--slate-600:#475569;--slate-500:#64748b;
  --slate-400:#94a3b8;--slate-300:#cbd5e1;--slate-200:#e2e8f0;--slate-100:#f1f5f9;--slate-50:#f8fafc;
  --green-600:#16a34a;--red-600:#dc2626;--white:#ffffff;
  --nav-w:180px;--chat-w:300px;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#64748b}
.app{display:flex;flex-direction:column;height:100vh;max-width:1100px;margin:0 auto;box-shadow:0 0 60px rgba(0,0,0,.3)}
.app-body{flex:1;display:flex;overflow:hidden}
.app-header{flex-shrink:0;height:60px;background:var(--slate-900);display:flex;align-items:center;padding:0 18px;gap:12px}
.header-brand{display:flex;align-items:center;gap:9px}
.header-brand span{font-size:20px}
.header-title{font-size:16px;font-weight:700;color:var(--white)}
.header-badge{font-size:10px;font-weight:700;color:var(--slate-400);background:rgba(255,255,255,.08);padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}

/* ── Left Nav ── */
.left-nav{width:var(--nav-w);flex-shrink:0;background:var(--white);border-right:1px solid var(--slate-200);overflow-y:auto;display:flex;flex-direction:column;padding:16px 0}
.nav-heading{font-size:10px;font-weight:700;color:var(--slate-400);text-transform:uppercase;letter-spacing:.8px;padding:0 14px 10px}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;transition:background .15s;position:relative}
.nav-item:hover{background:var(--slate-50)}
.nav-item.active{background:var(--blue-50)}
.nav-item.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--blue-700);border-radius:0 3px 3px 0}
.nav-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.nav-item.pending .nav-icon{background:var(--slate-100);filter:grayscale(1) opacity(.5)}
.nav-item.active .nav-icon{background:var(--blue-100)}
.nav-item.done .nav-icon{background:#dcfce7}
.nav-label{font-size:12px;font-weight:600}
.nav-item.pending .nav-label{color:var(--slate-400)}
.nav-item.active .nav-label{color:var(--blue-700)}
.nav-item.done .nav-label{color:var(--slate-600)}
.nav-check{margin-left:auto;font-size:11px;color:var(--green-600);font-weight:700;display:none}
.nav-item.done .nav-check{display:block}

/* ── Center ── */
.center-panel{flex:1;overflow-y:auto;background:var(--slate-100)}
.center-panel::-webkit-scrollbar{width:6px}
.center-panel::-webkit-scrollbar-track{background:var(--slate-200)}
.center-panel::-webkit-scrollbar-thumb{background:var(--slate-400);border-radius:3px}
.center-inner{max-width:660px;margin:0 auto;padding:28px 24px}
.section-hdr{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.section-hdr-icon{width:44px;height:44px;border-radius:10px;background:var(--blue-50);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.section-hdr-title{font-size:20px;font-weight:700;color:var(--slate-900)}
.section-hdr-sub{font-size:13px;color:var(--slate-500);margin-top:2px}

/* ── Right Panel ── */
.right-panel{width:var(--chat-w);flex-shrink:0;background:var(--white);border-left:1px solid var(--slate-200);display:flex;flex-direction:column;overflow:hidden}
.chat-hdr{padding:12px 14px;font-size:12px;font-weight:700;color:var(--slate-500);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--slate-100);flex-shrink:0}
.chat-messages{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:10px}
.chat-messages::-webkit-scrollbar{width:4px}
.chat-messages::-webkit-scrollbar-thumb{background:var(--slate-300);border-radius:2px}
.chat-msg.ai .msg-lbl{font-size:10px;font-weight:700;color:var(--slate-400);text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
.chat-msg.ai .msg-bubble{background:var(--slate-50);border:1px solid var(--slate-200);border-radius:0 10px 10px 10px;padding:10px 12px;font-size:13px;color:var(--slate-700);line-height:1.55}

/* ── Cards ── */
.form-card{background:var(--white);border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.08);overflow:hidden;margin-bottom:16px}
.form-card-hdr{background:var(--blue-900);color:var(--white);padding:12px 18px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.form-card-body{padding:18px 18px 6px}
.form-card-footer{padding:12px 18px 14px;display:flex;justify-content:flex-end;gap:8px;background:var(--slate-50);border-top:1px solid var(--slate-100)}
.prefill-banner{background:var(--blue-50);border:1.5px solid var(--blue-100);border-radius:7px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--blue-700);font-weight:500}

/* ── Approval card ── */
.approval-card{background:var(--white);border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.08);overflow:hidden;margin-bottom:16px}
.approval-hdr{background:var(--green-600);color:var(--white);padding:12px 18px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.approval-body{padding:8px 18px 4px}
.a-row{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--slate-100)}
.a-row:last-child{border-bottom:none}
.a-label{font-size:11px;font-weight:700;color:var(--slate-400);text-transform:uppercase;letter-spacing:.5px;min-width:90px;flex-shrink:0}
.a-value{font-size:14px;color:var(--slate-800);line-height:1.55}
.approval-footer{padding:12px 18px 14px;display:flex;justify-content:flex-end;gap:8px;background:var(--slate-50);border-top:1px solid var(--slate-100)}

/* ── Forms ── */
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.f-row.single{grid-template-columns:1fr}
.f-row.triple{grid-template-columns:2fr 1fr 1fr}
.f-group{display:flex;flex-direction:column;gap:4px}
.f-group label{font-size:11px;font-weight:700;color:var(--slate-500);text-transform:uppercase;letter-spacing:.6px}
.f-group input,.f-group textarea{border:1.5px solid var(--slate-200);border-radius:7px;padding:9px 11px;font-size:14px;color:var(--slate-900);background:var(--slate-50);outline:none;width:100%;font-family:inherit;transition:border-color .18s,box-shadow .18s}
.f-group input:focus,.f-group textarea:focus{border-color:var(--blue-700);box-shadow:0 0 0 3px rgba(29,78,216,.12);background:var(--white)}
.f-group textarea{resize:vertical;min-height:80px}
.f-err{font-size:11px;color:var(--red-600);display:none;margin-top:1px}
.f-group.has-error input,.f-group.has-error textarea{border-color:var(--red-600)}
.f-group.has-error .f-err{display:block}
.lookup-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:12px}
.lookup-row .f-group{flex:1;margin-bottom:0}
.lookup-btn{flex-shrink:0;padding:9px 14px;font-size:13px;white-space:nowrap;align-self:flex-end}

/* ── Buttons ── */
.btn{border:none;border-radius:7px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s,opacity .15s}
.btn-primary{background:var(--blue-700);color:var(--white)}
.btn-primary:hover{background:var(--blue-900)}
.btn-ghost{background:var(--slate-100);color:var(--slate-700);border:1px solid var(--slate-200)}
.btn-ghost:hover{background:var(--slate-200)}
.btn-confirm{background:var(--green-600);color:var(--white)}
.btn-confirm:hover{background:#15803d}
.btn-lg{padding:11px 24px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ── Upload ── */
.upload-drop{border:2px dashed var(--slate-300);border-radius:8px;padding:24px 20px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;margin-bottom:12px}
.upload-drop:hover,.upload-drop.drag-over{border-color:var(--blue-700);background:var(--blue-50)}
.upload-drop .drop-icon{font-size:28px;display:block;margin-bottom:6px}
.upload-drop .drop-lbl{font-size:14px;color:var(--slate-600);font-weight:600}
.upload-drop .drop-sub{font-size:12px;color:var(--slate-400);margin-top:3px}
.upload-selected{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--blue-50);border:1.5px solid var(--blue-100);border-radius:7px;margin-bottom:12px;font-size:13px;color:var(--blue-700);font-weight:600}

/* ── Chat suggestions ── */
.sugg-card{padding:10px 12px}
.sugg-label{font-size:11px;font-weight:700;color:var(--slate-500);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.sugg-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;border:1.5px solid var(--slate-200);background:var(--slate-50);margin-bottom:6px;cursor:pointer;transition:border-color .15s}
.sugg-item:hover{border-color:var(--blue-700);background:var(--blue-50)}
.sugg-item:last-child{margin-bottom:0}
.sugg-hint{font-size:10px;font-weight:700;color:var(--slate-400);text-transform:uppercase;letter-spacing:.4px;margin-bottom:1px}
.sugg-text{font-size:13px;color:var(--slate-700);flex:1}
.sugg-use{flex-shrink:0;border:1.5px solid var(--slate-300);border-radius:5px;background:var(--white);padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--slate-600);font-family:inherit}
.sugg-use:hover{border-color:var(--blue-700);color:var(--blue-700)}
.bullet-list{list-style:none;padding:0;margin:4px 0}
.bullet-list li{padding:3px 0;font-size:14px;color:var(--slate-700)}
@media(max-width:700px){.right-panel{display:none}.left-nav{width:44px}.nav-label,.nav-check,.nav-heading{display:none}.nav-item{justify-content:center;padding:8px 0}}
</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <div class="header-brand"><span>✉️</span><span class="header-title">AI Cover Letter Builder</span><span class="header-badge">Beta</span></div>
  </div>
  <div class="app-body">
    <nav class="left-nav" id="leftNav"></nav>
    <div class="center-panel"><div id="centerInner" class="center-inner"></div></div>
    <div class="right-panel">
      <div class="chat-hdr">💬 AI Assistant</div>
      <div class="chat-messages" id="chatMessages"></div>
    </div>
  </div>
</div>

<script>
// ── Sections ─────────────────────────────────────────
const SECTIONS=[
  {key:'personal', label:'Personal Info',       icon:'👤'},
  {key:'company',  label:'Company Info',         icon:'🏢'},
  {key:'letter',   label:'Build Cover Letter',   icon:'✉️'},
];
const sectionStatus={personal:'pending',company:'pending',letter:'pending'};
let currentSection='personal';

// ── State ─────────────────────────────────────────────
let personalData={};
let employerData={};
let pendingLetter={};
let selectedResumeFile=null;
let _lastSuggestedCompany='';

// ── Init ──────────────────────────────────────────────
window.addEventListener('DOMContentLoaded',()=>{
  renderLeftNav();
  showSection('personal');
  addAIMsg('Welcome to the AI Cover Letter Builder! Fill in your personal info to get started — I\'ll check if you have saved resume data.');
  setTimeout(()=>loadSavedSuggestions(),400);
});

// ── Nav ───────────────────────────────────────────────
function renderLeftNav(){
  const nav=document.getElementById('leftNav');
  nav.innerHTML=`<div class="nav-heading">Cover Letter</div>`+
    SECTIONS.map(s=>`<div class="nav-item ${sectionStatus[s.key]==='done'?'done':s.key===currentSection?'active':'pending'}" onclick="showSection('${s.key}')">
      <div class="nav-icon">${s.icon}</div>
      <span class="nav-label">${s.label}</span>
      <span class="nav-check">✓</span>
    </div>`).join('');
}

function setStatus(key,status){
  sectionStatus[key]=status;
  renderLeftNav();
}

function showSection(key){
  currentSection=key;
  renderLeftNav();
  const ci=document.getElementById('centerInner');
  if(key==='personal') ci.innerHTML=renderPersonalForm();
  else if(key==='company') ci.innerHTML=renderCompanyForm();
  else if(key==='letter') ci.innerHTML=renderLetterForm();
}

// ── Personal Info ─────────────────────────────────────
function renderPersonalForm(){
  const p=personalData;
  const hasSome=p.firstName||p.email;
  const banner=hasSome?`<div class="prefill-banner">✓ Pre-filled from saved data — confirm or update any field.</div>`:'';
  return `<div class="section-hdr"><div class="section-hdr-icon">👤</div><div><div class="section-hdr-title">Personal Info</div><div class="section-hdr-sub">Your contact details for the letter header</div></div></div>
  ${banner}
  <div class="form-card">
    <div class="form-card-hdr">👤 Contact Information</div>
    <div class="form-card-body">
      <div class="f-row">
        <div class="f-group" id="fg-fn"><label>First Name *</label><input id="pFn" value="${escHtml(p.firstName||'')}" placeholder="First name"><span class="f-err">Required</span></div>
        <div class="f-group" id="fg-ln"><label>Last Name *</label><input id="pLn" value="${escHtml(p.lastName||'')}" placeholder="Last name"><span class="f-err">Required</span></div>
      </div>
      <div class="f-row">
        <div class="f-group" id="fg-em"><label>Email *</label><input id="pEm" type="email" value="${escHtml(p.email||'')}" placeholder="you@example.com"><span class="f-err">Required</span></div>
        <div class="f-group" id="fg-ph"><label>Phone *</label><input id="pPh" value="${escHtml(p.phone||'')}" placeholder="(555) 555-5555"><span class="f-err">Required</span></div>
      </div>
      <div class="f-row single">
        <div class="f-group"><label>Street Address</label><input id="pAddr" value="${escHtml(p.address||'')}" placeholder="123 Main Street"></div>
      </div>
      <div class="f-row triple">
        <div class="f-group"><label>City</label><input id="pCity" value="${escHtml(p.city||'')}" placeholder="City"></div>
        <div class="f-group"><label>State</label><input id="pState" value="${escHtml(p.state||'')}" placeholder="PA" maxlength="2" oninput="this.value=this.value.toUpperCase()"></div>
        <div class="f-group"><label>ZIP</label><input id="pZip" value="${escHtml(p.zip||'')}" placeholder="00000" maxlength="5" inputmode="numeric"></div>
      </div>
    </div>
    <div class="form-card-footer" style="justify-content:space-between">
      <button class="btn btn-ghost" onclick="showUploadOption()">Upload Resume Instead</button>
      <button class="btn btn-primary" onclick="submitPersonal()">Continue to Company Info →</button>
    </div>
  </div>`;
}

function submitPersonal(){
  const fn=document.getElementById('pFn').value.trim();
  const ln=document.getElementById('pLn').value.trim();
  const em=document.getElementById('pEm').value.trim();
  const ph=document.getElementById('pPh').value.trim();
  let valid=true;
  if(!fn){document.getElementById('fg-fn').classList.add('has-error');valid=false;}else document.getElementById('fg-fn').classList.remove('has-error');
  if(!ln){document.getElementById('fg-ln').classList.add('has-error');valid=false;}else document.getElementById('fg-ln').classList.remove('has-error');
  if(!em||!em.includes('@')){document.getElementById('fg-em').classList.add('has-error');valid=false;}else document.getElementById('fg-em').classList.remove('has-error');
  if(!ph){document.getElementById('fg-ph').classList.add('has-error');valid=false;}else document.getElementById('fg-ph').classList.remove('has-error');
  if(!valid)return;
  personalData={
    firstName:fn, lastName:ln, email:em, phone:ph,
    address:document.getElementById('pAddr').value.trim(),
    city:document.getElementById('pCity').value.trim(),
    state:document.getElementById('pState').value.trim().toUpperCase(),
    zip:document.getElementById('pZip').value.trim(),
  };
  setStatus('personal','done');
  addAIMsg(`Personal info saved for **${fn} ${ln}**. Now add the employer details.`);
  showSection('company');
  setTimeout(()=>addAIMsg('Paste a job posting URL to auto-fill everything, or enter the employer details manually. Type the company name and I\'ll suggest the address.'),500);
}

// ── Saved data suggestions ─────────────────────────────
function loadSavedSuggestions(){
  try{
    const saved=JSON.parse(localStorage.getItem('rb_progress')||'null');
    const p=saved?.personal;
    if(!p?.firstName)return;
    const fields=[
      {hint:'First Name',text:p.firstName,field:'pFn'},
      {hint:'Last Name',text:p.lastName,field:'pLn'},
      {hint:'Email',text:p.email,field:'pEm'},
      {hint:'Phone',text:p.phone,field:'pPh'},
      {hint:'Address',text:p.address,field:'pAddr'},
      {hint:'City',text:p.city,field:'pCity'},
      {hint:'State',text:p.state,field:'pState'},
      {hint:'ZIP',text:p.zip,field:'pZip'},
    ].filter(f=>f.text);
    if(!fields.length)return;
    // Pre-populate personalData quietly
    personalData={firstName:p.firstName,lastName:p.lastName,email:p.email||'',phone:p.phone||'',address:p.address||'',city:p.city||'',state:p.state||'',zip:p.zip||''};
    // Re-render to show the pre-fill banner and values
    if(currentSection==='personal') document.getElementById('centerInner').innerHTML=renderPersonalForm();
    // Show suggestion card in chat
    const msgs=document.getElementById('chatMessages');
    const div=document.createElement('div');div.className='chat-msg ai';
    const rows=fields.map(f=>`<div class="sugg-item" onclick="applyField('${f.field}','${(f.text||'').replace(/'/g,"\\'")}')">
      <div style="flex:1"><div class="sugg-hint">${escHtml(f.hint)}</div><div class="sugg-text">${escHtml(f.text)}</div></div>
      <button class="sugg-use" onclick="event.stopPropagation();applyField('${f.field}','${(f.text||'').replace(/'/g,"\\'")}')">+ Add</button>
    </div>`).join('');
    div.innerHTML=`<div class="msg-lbl">Saved Resume Data</div>
      <div class="msg-bubble sugg-card">
        <div class="sugg-label">Found data for ${escHtml(p.firstName)} ${escHtml(p.lastName||'')} — click to apply</div>
        ${rows}
        <button class="btn btn-primary" style="width:100%;margin-top:10px;padding:8px" onclick="fillAllPersonal()">Fill All Fields</button>
      </div>`;
    msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;
    addAIMsg(`Found saved resume data for **${p.firstName} ${p.lastName||''}**. I've pre-filled the fields — review and continue when ready.`);
  }catch(e){}
}

function fillAllPersonal(){
  const fields=['pFn','pLn','pEm','pPh','pAddr','pCity','pState','pZip'];
  const keys=['firstName','lastName','email','phone','address','city','state','zip'];
  fields.forEach((id,i)=>{const el=document.getElementById(id);if(el&&personalData[keys[i]])el.value=personalData[keys[i]];});
  addAIMsg('All fields filled. Review and click Continue when ready.');
}

function applyField(fieldId,value){
  const el=document.getElementById(fieldId);if(!el)return;
  el.value=value;
  el.style.transition='border-color .3s';el.style.borderColor='var(--blue-700)';
  setTimeout(()=>{el.style.borderColor='';},1200);
}

// ── Upload option ─────────────────────────────────────
function showUploadOption(){
  const ci=document.getElementById('centerInner');
  ci.innerHTML=`<div class="section-hdr"><div class="section-hdr-icon">📄</div><div><div class="section-hdr-title">Upload Resume</div><div class="section-hdr-sub">Extract your info from a file</div></div></div>
  <div class="form-card">
    <div class="form-card-body" style="padding-bottom:18px">
      <div class="upload-drop" id="uploadDrop" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="handleDrop(event)" onclick="document.getElementById('clFileInput').click()">
        <span class="drop-icon">⬆️</span>
        <div class="drop-lbl">Click to browse or drag and drop</div>
        <div class="drop-sub">PDF, Word (.docx), or .txt</div>
      </div>
      <div id="uploadSelected" style="display:none"></div>
      <input type="file" id="clFileInput" accept=".pdf,.docx,.txt" style="display:none" onchange="handleFileSelect(this)">
    </div>
    <div class="form-card-footer" style="justify-content:space-between">
      <button class="btn btn-ghost" onclick="showSection('personal')">← Back</button>
      <button class="btn btn-primary" id="extractBtn" onclick="extractResume()" disabled style="opacity:.45">Extract &amp; Fill →</button>
    </div>
  </div>`;
}

function handleDrop(e){e.preventDefault();document.getElementById('uploadDrop').classList.remove('drag-over');if(e.dataTransfer.files[0])setUploadFile(e.dataTransfer.files[0]);}
function handleFileSelect(inp){if(inp.files[0])setUploadFile(inp.files[0]);}
function setUploadFile(file){
  selectedResumeFile=file;
  const sel=document.getElementById('uploadSelected');
  sel.style.display='flex';sel.className='upload-selected';
  sel.innerHTML=`<span>📎</span><span>${escHtml(file.name)}</span><span style="margin-left:auto;font-weight:400;color:var(--slate-500)">${(file.size/1024).toFixed(0)} KB</span>`;
  const btn=document.getElementById('extractBtn');btn.disabled=false;btn.style.opacity='1';
}

async function extractResume(){
  if(!selectedResumeFile)return;
  const btn=document.getElementById('extractBtn');btn.disabled=true;btn.textContent='Extracting…';
  addAIMsg('Extracting your info from the resume — one moment…');
  try{
    const ext=selectedResumeFile.name.split('.').pop().toLowerCase();
    let text='',useDoc=false,b64='';
    if(ext==='txt') text=await readAsText(selectedResumeFile);
    else if(ext==='pdf'){b64=await readAsBase64(selectedResumeFile);useDoc=true;}
    else if(ext==='docx') text=await readDocx(selectedResumeFile);
    const instruction=`Extract contact info. Return ONLY valid JSON:
{"firstName":"","lastName":"","email":"","phone":"","address":"","city":"","state":"","zip":""}`;
    let messages;
    if(useDoc) messages=[{role:'user',content:[{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}},{type:'text',text:instruction}]}];
    else messages=[{role:'user',content:`${instruction}\n\nResume:\n${text}`}];
    const raw=await callClaude('',messages,{maxTokens:400});
    const parsed=JSON.parse(raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,''));
    Object.assign(personalData,parsed);
    showSection('personal');
    addAIMsg(`Extracted info for **${parsed.firstName||''} ${parsed.lastName||''}**. Review the fields and continue.`);
  }catch(err){
    addAIMsg('Had trouble reading that file. Try a different format or fill in manually.');
    btn.disabled=false;btn.textContent='Extract & Fill →';btn.style.opacity='1';
  }
}

function readAsText(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsText(f);});}
function readAsBase64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>{const b64=btoa(new Uint8Array(e.target.result).reduce((d,b)=>d+String.fromCharCode(b),''));res(b64);};r.onerror=rej;r.readAsArrayBuffer(f);});}
function readDocx(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=async e=>{try{const result=await mammoth.extractRawText({arrayBuffer:e.target.result});res(result.value);}catch(err){rej(err);}};r.onerror=rej;r.readAsArrayBuffer(f);});}

// ── URL Extraction ────────────────────────────────────
async function extractFromUrl(){
  const url=document.getElementById('fJobUrl').value.trim();
  if(!url){addAIMsg('Paste a job posting URL first.');return;}
  const btn=document.getElementById('urlExtractBtn');
  btn.disabled=true;btn.textContent='Fetching…';
  addAIMsg('Fetching the job posting — one moment…');
  try{
    const fetchRes=await fetch('/api/fetch-url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
    if(!fetchRes.ok){const e=await fetchRes.json().catch(()=>({}));throw new Error(e.error||'fetch failed');}
    const{text}=await fetchRes.json();
    const sys=`Extract job posting details. Return ONLY valid JSON:
{"company":"","jobTitle":"","street":"","city":"","state":"","zip":"","phone":"","description":""}
- description: key requirements, max 250 words`;
    const raw=await callClaude(sys,[{role:'user',content:text}],{maxTokens:600});
    const data=JSON.parse(raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,''));
    const map=[['fCompany',data.company],['fJobTitle',data.jobTitle],['fCompanyStreet',data.street],['fCompanyCity',data.city],['fCompanyState',data.state],['fCompanyZip',data.zip],['fCompanyPhone',data.phone],['fJobDesc',data.description]];
    const filled=[];
    map.forEach(([id,val])=>{if(val){const el=document.getElementById(id);if(el){el.value=val;if(id==='fCompany'||id==='fJobTitle') filled.push(val);}}});
    addAIMsg(`Extracted from the posting${filled.length?' — found '+filled.join(' at '):''}.  Review the fields and continue.`);
  }catch(e){
    addAIMsg(`Could not fetch that URL — the site may block access. Paste the job description manually. (${e.message})`);
  }
  btn.disabled=false;btn.textContent='Extract →';
}

// ── Employer Chat Suggestions ─────────────────────────
async function refreshEmployerSuggestions(company){
  company=company.trim();
  if(!company||company.length<4||company===_lastSuggestedCompany)return;
  _lastSuggestedCompany=company;
  const p=personalData;
  const locationHint=p.city&&p.state?`near ${p.city}, ${p.state}`:'';
  const sys=`Return employer contact info for a cover letter. ONLY valid JSON:
{"street":"","city":"","state":"","zip":"","phone":"","hiringManagerTitle":"","confident":true}
Company: ${company}${locationHint?'\nLocation: '+locationHint:''}`;
  try{
    const raw=await callClaude(sys,[{role:'user',content:'Suggest contact info.'}]);
    const data=JSON.parse(raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,''));
    const items=[];
    if(data.street) items.push({hint:'Street Address',text:data.street,field:'fCompanyStreet'});
    if(data.city) items.push({hint:'City',text:data.city,field:'fCompanyCity'});
    if(data.state) items.push({hint:'State',text:data.state,field:'fCompanyState'});
    if(data.zip) items.push({hint:'ZIP',text:data.zip,field:'fCompanyZip'});
    if(data.phone) items.push({hint:'Phone',text:data.phone,field:'fCompanyPhone'});
    if(data.hiringManagerTitle) items.push({hint:'Likely Hiring Contact',text:data.hiringManagerTitle,field:null});
    if(!items.length)return;
    const msgs=document.getElementById('chatMessages');if(!msgs)return;
    const div=document.createElement('div');div.className='chat-msg ai';
    const rows=items.map(f=>{
      const onclick=f.field?`applyField('${f.field}','${f.text.replace(/'/g,"\\'")}')`:'';
      const btn=f.field?`<button class="sugg-use" onclick="event.stopPropagation();${onclick}">+ Add</button>`:'';
      return `<div class="sugg-item"${f.field?` onclick="${onclick}"`:''}><div style="flex:1"><div class="sugg-hint">${escHtml(f.hint)}</div><div class="sugg-text">${escHtml(f.text)}</div></div>${btn}</div>`;
    }).join('');
    div.innerHTML=`<div class="msg-lbl">Suggestions for ${escHtml(company)}</div>
      <div class="msg-bubble sugg-card"><div class="sugg-label">Click + Add to apply</div>${rows}
      ${!data.confident?'<div style="font-size:11px;color:var(--slate-400);margin-top:8px">⚠ Verify before sending</div>':''}</div>`;
    msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;
  }catch(e){}
}

// ── Letter Generation ─────────────────────────────────
async function generateLetter(){
  const ci=document.getElementById('centerInner');
  ci.innerHTML=`<div style="text-align:center;padding:80px 20px;color:var(--slate-500)"><div style="font-size:40px;margin-bottom:14px">✍️</div><div style="font-size:16px;font-weight:600">Writing your cover letter…</div></div>`;
  const p=personalData;
  const e=employerData;
  const saved=JSON.parse(localStorage.getItem('rb_progress')||'{}');
  const skills=(saved?.skills||[]).slice(0,10).join(', ')||'hands-on technical skills';
  const certs=(saved?.certifications||[]).map(x=>x.name).join(', ')||'';
  const workSummary=(saved?.workExperience||[]).slice(0,3).map(j=>`${j.jobTitle} at ${j.employer}`).join('; ')||'no prior experience listed';
  const objective=saved?.careerContext?.objective||'';
  const program=saved?.personal?.program||'trade';
  const salutation=e.hiringManager?`Dear ${e.hiringManager},`:'Dear Hiring Manager,';
  const sys=`You write professional cover letters for trade school students. Return ONLY valid JSON:
{"salutation":"${salutation}","paragraphs":["","",""]}
- paragraphs: exactly 3 full paragraphs.
  - Paragraph 1: 2-3 sentences. Reference the specific job title and company. Show genuine interest. Do NOT start with "I am writing to".
  - Paragraph 2: 3-4 sentences. Connect the student's actual skills, certifications, and experience to the job. Be specific — use real details.
  - Paragraph 3: 2-3 sentences. Express enthusiasm, request an interview, thank them.
- Tone: professional trade school. No "I am passionate about", no fluff.

Student: ${p.firstName||'Student'} ${p.lastName||''}, ${program} student
Applying for: ${e.jobTitle} at ${e.company}
Job requirements: ${e.jobDesc||'Not provided'}
Career objective: ${objective||'Seeking entry-level position in trade field'}
Skills: ${skills}
Certifications: ${certs||'None listed'}
Experience: ${workSummary}`;
  try{
    const raw=await callClaude(sys,[{role:'user',content:'Write the cover letter.'}],{maxTokens:1000});
    const letter=JSON.parse(raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,''));
    if(!Array.isArray(letter.paragraphs)||letter.paragraphs.length<2)throw new Error('bad response');
    pendingLetter={employer:e,letter};
    setStatus('letter','done');
    showLetterPreview();
    addAIMsg('Your cover letter is ready! Review each paragraph — edit the downloaded file if anything needs adjusting before you send it.');
  }catch(e){
    addAIMsg('Had trouble generating the letter — please try again.');
    showSection('letter');
  }
}

// ── Word Doc ──────────────────────────────────────────
function twip(inches){return Math.round(inches*1440);}

async function downloadLetter(){
  const p=personalData;
  const e=pendingLetter.employer||{};
  const letter=pendingLetter.letter||{};
  const M=twip(1.1);
  const BODY=24,SMALL=22,NAME=30;
  const LS={line:276,lineRule:'auto'};
  const para=(t,opts={})=>new docx.Paragraph({
    spacing:{before:0,after:opts.after!==undefined?opts.after:0,...(opts.before?{before:opts.before}:{}),...LS},
    children:[new docx.TextRun({text:t,size:opts.size||BODY,color:opts.color||'1a1a1a',bold:!!opts.bold,italics:!!opts.italic})]
  });
  const blank=(pts=240)=>new docx.Paragraph({spacing:{before:0,after:pts}});
  const ch=[];
  const name=[p.firstName,p.lastName].filter(Boolean).join(' ')||'';
  // Student header
  ch.push(para(name,{size:NAME,bold:true,color:'111111',after:80}));
  if(p.address) ch.push(para(p.address,{size:SMALL,color:'444444',after:40}));
  const cityStateZip=[[p.city,p.state].filter(Boolean).join(', '),p.zip].filter(Boolean).join(' ');
  if(cityStateZip) ch.push(para(cityStateZip,{size:SMALL,color:'444444',after:40}));
  const contactLine=[p.email,p.phone].filter(Boolean).join('   |   ');
  if(contactLine) ch.push(para(contactLine,{size:SMALL,color:'444444',after:120}));
  // Rule
  ch.push(new docx.Paragraph({border:{bottom:{style:docx.BorderStyle.SINGLE,size:4,color:'333333'}},spacing:{before:0,after:300}}));
  // Date
  const today=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  ch.push(para(today,{after:260}));
  // Employer block
  if(e.hiringManager) ch.push(para(e.hiringManager,{after:40}));
  if(e.company) ch.push(para(e.company,{after:40}));
  if(e.companyStreet) ch.push(para(e.companyStreet,{after:40}));
  const empCityLine=[[e.companyCity,e.companyState].filter(Boolean).join(', '),e.companyZip].filter(Boolean).join(' ');
  if(empCityLine) ch.push(para(empCityLine,{after:40}));
  if(e.companyPhone) ch.push(para(e.companyPhone,{after:40}));
  if(e.company) ch.push(blank(280));
  // Salutation
  ch.push(para(letter.salutation||'Dear Hiring Manager,',{after:260}));
  // Paragraphs
  (letter.paragraphs||[]).forEach(p=>ch.push(para(p,{after:240})));
  // Sign-off
  ch.push(para('Sincerely,',{after:360}));
  ch.push(para(name,{bold:true,after:60}));
  const prog=JSON.parse(localStorage.getItem('rb_progress')||'{}')?.personal?.program||'';
  if(prog) ch.push(para(prog,{size:SMALL,color:'555555',after:0}));
  const doc=new docx.Document({sections:[{properties:{page:{margin:{top:M,bottom:M,left:M,right:M}}},children:ch}]});
  const blob=await docx.Packer.toBlob(doc);
  const fname=[p.firstName,p.lastName].filter(Boolean).join('-')||'Cover-Letter';
  saveAs(blob,`${fname}-Cover-Letter.docx`);
  addAIMsg('Downloaded! Open in Word to make any final edits before sending. Good luck! 🎉');
}

// ── Claude API ────────────────────────────────────────
async function callClaude(system,messages,opts){
  const body={model:'claude-sonnet-4-6',max_tokens:(opts&&opts.maxTokens)||2048,messages};
  if(system)body.system=system;
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),40000);
  try{
    const res=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal});
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error||`Server error ${res.status}`);}
    const data=await res.json();
    return data.content[0].text;
  }finally{clearTimeout(timer);}
}

// ── Helpers ───────────────────────────────────────────
function escHtml(str){if(!str)return '';const d=document.createElement('div');d.appendChild(document.createTextNode(String(str)));return d.innerHTML;}
function addAIMsg(text){
  const msgs=document.getElementById('chatMessages');if(!msgs)return;
  const div=document.createElement('div');div.className='chat-msg ai';
  div.innerHTML=`<div class="msg-lbl">AI</div><div class="msg-bubble">${escHtml(text).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}</div>`;
  msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;
}
