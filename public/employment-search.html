<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employment Search Assignment</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue-900:#1e3a8a;--blue-700:#1d4ed8;--blue-400:#60a5fa;--blue-100:#dbeafe;--blue-50:#eff6ff;
  --slate-900:#0f172a;--slate-700:#334155;--slate-600:#475569;--slate-500:#64748b;
  --slate-400:#94a3b8;--slate-300:#cbd5e1;--slate-200:#e2e8f0;--slate-100:#f1f5f9;--slate-50:#f8fafc;
  --green-700:#15803d;--green-600:#16a34a;--green-50:#f0fdf4;--green-100:#dcfce7;--green-200:#bbf7d0;
  --amber-800:#92400e;--amber-600:#d97706;--amber-bg:#fffbeb;--amber-bd:#fde68a;
  --red-600:#dc2626;--red-bg:#fef2f2;--red-bd:#fecaca;
  --white:#ffffff;
  --nav-w:195px;--chat-w:900px;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#64748b}
.app{display:flex;flex-direction:column;height:100vh;max-width:3000px;margin:0 auto;box-shadow:0 0 60px rgba(0,0,0,.3)}
.app-body{flex:1;display:flex;overflow:hidden}
.app-header{flex-shrink:0;height:60px;background:var(--slate-900);display:flex;align-items:center;padding:0 18px;gap:10px}
.header-title{font-size:16px;font-weight:700;color:var(--white)}
.header-badge{font-size:10px;font-weight:700;color:var(--slate-400);background:rgba(255,255,255,.08);padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}

/* ── Left Nav ── */
.left-nav{width:var(--nav-w);flex-shrink:0;background:var(--white);border-right:1px solid var(--slate-200);display:flex;flex-direction:column;padding:16px 0}
.nav-heading{font-size:10px;font-weight:700;color:var(--slate-400);text-transform:uppercase;letter-spacing:.8px;padding:0 14px 10px}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;transition:background .15s;position:relative}
.nav-item:hover{background:var(--slate-50)}
.nav-item.active{background:var(--blue-50)}
.nav-item.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--blue-700);border-radius:0 3px 3px 0}
.nav-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:var(--slate-100)}
.nav-item.active .nav-icon{background:var(--blue-100)}
.nav-item.done .nav-icon{background:var(--green-100)}
.nav-item.pending .nav-icon{filter:grayscale(1) opacity(.45)}
.nav-label{font-size:12px;font-weight:600;color:var(--slate-500)}
.nav-item.active .nav-label{color:var(--blue-700)}
.nav-item.done .nav-label{color:var(--slate-600)}
.nav-item.pending .nav-label{color:var(--slate-400)}
.nav-check{margin-left:auto;font-size:11px;color:var(--green-600);font-weight:700;display:none}
.nav-item.done .nav-check{display:block}

/* ── Center ── */
.center-panel{flex:1;overflow-y:auto;background:var(--slate-100)}
.center-panel::-webkit-scrollbar{width:6px}
.center-panel::-webkit-scrollbar-thumb{background:var(--slate-400);border-radius:3px}
.center-inner{max-width:800px;margin:0 auto;padding:28px 24px 60px}

/* ── Right Panel ── */
.right-panel{width:var(--chat-w);flex-shrink:0;display:flex;flex-direction:column;background:var(--white);border-left:1px solid var(--slate-200);overflow:hidden}
.chat-hdr{padding:12px 14px;font-size:12px;font-weight:700;color:var(--slate-500);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--slate-100);flex-shrink:0}

/* ── Right panel site dropdown ── */
.rp-site-row{flex-shrink:0;padding:8px 10px;border-bottom:1px solid var(--slate-200);background:var(--slate-50)}
.rp-site-row select{width:100%;padding:7px 9px;font-size:12px;font-family:inherit;border:1.5px solid var(--slate-200);border-radius:7px;background:var(--white);color:var(--slate-700);cursor:pointer;outline:none}
.rp-site-row select:focus{border-color:var(--blue-400)}
.link-group-lbl{font-size:10px;font-weight:700;color:var(--slate-400);text-transform:uppercase;letter-spacing:.5px;margin:8px 0 5px}
.link-chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;text-decoration:none;transition:all .15s;white-space:nowrap;border:1.5px solid transparent}
.chip.nat{background:var(--blue-50);border-color:var(--blue-100);color:var(--blue-700)}.chip.nat:hover{background:var(--blue-100);border-color:var(--blue-400)}
.chip.loc{background:var(--green-50);border-color:var(--green-100);color:var(--green-700)}.chip.loc:hover{background:var(--green-100);border-color:var(--green-200)}
.chip.trd{background:var(--amber-bg);border-color:var(--amber-bd);color:var(--amber-800)}.chip.trd:hover{background:#fef3c7}

/* ── Chat ── */
.chat-messages{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:10px}
.chat-messages::-webkit-scrollbar{width:4px}
.chat-messages::-webkit-scrollbar-thumb{background:var(--slate-300);border-radius:2px}
.msg-ai .msg-lbl{font-size:10px;font-weight:700;color:var(--slate-400);text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
.msg-ai .msg-bubble{background:var(--slate-50);border:1px solid var(--slate-200);border-radius:0 10px 10px 10px;padding:10px 12px;font-size:13px;color:var(--slate-700);line-height:1.55}
.msg-user{align-self:flex-end}
.msg-user .msg-bubble{background:var(--blue-700);color:var(--white);border-radius:10px 0 10px 10px;padding:10px 12px;font-size:13px;line-height:1.55;max-width:240px;word-break:break-word}
.chat-input-area{flex-shrink:0;border-top:1px solid var(--slate-200);padding:10px}
.chat-row{display:flex;gap:6px;align-items:flex-end}
.chat-ta{flex:1;border:1.5px solid var(--slate-200);border-radius:7px;padding:8px 10px;font-size:13px;font-family:inherit;resize:none;min-height:36px;max-height:90px;outline:none;color:var(--slate-900);background:var(--slate-50)}
.chat-ta:focus{border-color:var(--blue-700);background:var(--white)}
.chat-send-btn{flex-shrink:0;padding:8px 12px;background:var(--blue-700);color:var(--white);border:none;border-radius:7px;font-size:14px;cursor:pointer}
.chat-send-btn:hover{background:var(--blue-900)}

/* ── Welcome ── */
.welcome-card{background:var(--white);border-radius:14px;box-shadow:0 2px 16px rgba(0,0,0,.1);padding:36px 32px;text-align:center;margin-bottom:20px}
.welcome-icon{font-size:48px;margin-bottom:12px;display:block}
.welcome-title{font-size:22px;font-weight:800;color:var(--slate-900);margin-bottom:8px}
.welcome-sub{font-size:14px;color:var(--slate-500);line-height:1.6;margin-bottom:20px}
.task-steps{text-align:left;background:var(--blue-50);border-radius:10px;padding:14px 18px;margin-bottom:20px}
.task-steps li{font-size:13px;color:var(--slate-700);margin-bottom:7px;list-style:none;display:flex;gap:8px;line-height:1.5}
.name-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:460px;margin:0 auto 20px;text-align:left}

/* ── Section header ── */
.sec-hdr{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.sec-hdr-icon{width:44px;height:44px;border-radius:10px;background:var(--blue-50);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.sec-hdr-title{font-size:20px;font-weight:700;color:var(--slate-900)}
.sec-hdr-sub{font-size:13px;color:var(--slate-500);margin-top:2px}

/* ── Job Tabs ── */
.job-tabs{display:flex;gap:0;margin-bottom:0;flex-wrap:nowrap;overflow-x:auto}
.job-tab{display:flex;align-items:center;gap:6px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--slate-200);border-bottom:none;border-radius:8px 8px 0 0;background:var(--slate-100);color:var(--slate-500);transition:all .15s;white-space:nowrap;user-select:none;margin-right:4px}
.job-tab:hover{background:var(--slate-200)}
.job-tab.active{background:var(--white);color:var(--blue-700);border-color:var(--slate-200);z-index:1;position:relative}
.job-tab.complete{color:var(--green-700)}
.job-tab.complete .tab-check{display:inline}
.tab-check{display:none;font-size:11px;color:var(--green-600)}
.tab-dot{width:7px;height:7px;border-radius:50%;background:var(--amber-600);flex-shrink:0;display:none}
.job-tab.in-progress .tab-dot{display:block}
.job-tab.submit-tab{margin-left:auto;background:var(--blue-700);color:#fff;border-color:var(--blue-700)}
.job-tab.submit-tab:hover{background:var(--blue-900);border-color:var(--blue-900)}
.job-tab.submit-tab.disabled{background:var(--slate-200);color:var(--slate-400);border-color:var(--slate-200);cursor:not-allowed}
.submit-banner{background:var(--blue-700);border-radius:10px;padding:18px 20px;margin-bottom:20px;display:flex;align-items:center;gap:16px;justify-content:space-between}
.submit-banner-icon{font-size:32px;flex-shrink:0}
.submit-banner-text{flex:1}
.submit-banner-title{font-size:16px;font-weight:800;color:#fff;margin-bottom:3px}
.submit-banner-sub{font-size:13px;color:rgba(255,255,255,.8)}
.submit-banner-btn{background:#fff;color:var(--blue-700);border:none;border-radius:8px;padding:12px 20px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
.submit-banner-btn:hover{background:var(--blue-50);transform:scale(1.02)}
.submit-steps{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.submit-step{flex:1;min-width:140px;background:var(--slate-50);border:1.5px solid var(--slate-200);border-radius:9px;padding:14px 14px;text-align:center}
.submit-step-num{width:28px;height:28px;border-radius:50%;background:var(--blue-700);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.submit-step-text{font-size:12px;font-weight:600;color:var(--slate-700);line-height:1.4}
.job-tab-panel{background:var(--white);border:1.5px solid var(--slate-200);border-radius:0 8px 8px 8px;padding:20px 20px 0}

/* ── Form fields ── */
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
.f1{margin-bottom:12px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:11px;font-weight:700;color:var(--slate-500);text-transform:uppercase;letter-spacing:.6px}
.fg input,.fg textarea,.fg select{border:1.5px solid var(--slate-200);border-radius:7px;padding:9px 11px;font-size:14px;color:var(--slate-900);background:var(--slate-50);outline:none;width:100%;font-family:inherit;transition:border-color .18s}
.fg input,.fg select{height:40px}
.fg input:focus,.fg textarea:focus,.fg select:focus{border-color:var(--blue-700);background:var(--white);box-shadow:0 0 0 3px rgba(29,78,216,.1)}
.fg textarea{resize:vertical}
.fg.err input,.fg.err textarea,.fg.err select{border-color:var(--red-600)}
.f-err-msg{font-size:11px;color:var(--red-600);display:none;margin-top:2px}
.fg.err .f-err-msg{display:block}
.req{color:var(--red-600)}

/* ── Word count indicator ── */
.wc-row{display:flex;justify-content:space-between;align-items:center;margin-top:3px}
.wc-hint{font-size:11px;color:var(--slate-400)}
.wc-count{font-size:11px;font-weight:700;color:var(--slate-400)}
.wc-count.ok{color:var(--green-600)}
.wc-count.warn{color:var(--amber-600)}


/* ── Grade card ── */
.grade-card{background:var(--white);border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.08);overflow:hidden;margin-bottom:16px}
.grade-hdr{display:flex;align-items:center;gap:16px;padding:20px 22px;border-bottom:1px solid var(--slate-100)}
.grade-circle{width:82px;height:82px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;background:var(--blue-50);border:3px solid var(--blue-700)}
.grade-circle.hi{background:#dcfce7;border-color:#16a34a}
.grade-circle.lo{background:#fee2e2;border-color:#dc2626}
.grade-score{font-size:24px;font-weight:900;color:var(--blue-700);line-height:1}
.grade-circle.hi .grade-score{color:#15803d}
.grade-circle.lo .grade-score{color:#dc2626}
.grade-denom{font-size:11px;font-weight:700;color:var(--slate-400)}
.grade-hdr-r h3{font-size:17px;font-weight:700;color:var(--slate-900);margin-bottom:4px}
.grade-hdr-r p{font-size:13px;color:var(--slate-500);line-height:1.5}
.rubric-row{display:flex;align-items:center;gap:12px;padding:10px 22px;border-bottom:1px solid var(--slate-100)}
.rubric-row:last-child{border-bottom:none}
.rubric-lbl{font-size:12px;font-weight:700;color:var(--slate-700);min-width:148px}
.rubric-bar-w{flex:1;background:var(--slate-100);border-radius:20px;height:8px;overflow:hidden}
.rubric-bar{height:100%;border-radius:20px;background:var(--blue-700)}
.rubric-sc{font-size:12px;font-weight:700;color:var(--slate-700);min-width:36px;text-align:right}
.rubric-fb{font-size:12px;color:var(--slate-500);padding:0 22px 10px;line-height:1.5}
.fb-block{padding:14px 22px;border-top:1px solid var(--slate-100)}
.fb-block h4{font-size:12px;font-weight:700;color:var(--slate-700);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.fb-block p{font-size:13px;color:var(--slate-600);line-height:1.55}

/* ── Right-panel tabs (Directions / Examples / Rubric) ── */
.rp-tabs{display:flex;border-bottom:1px solid var(--slate-200);flex-shrink:0}
.rp-tab{flex:1;padding:9px 4px;font-size:11px;font-weight:700;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;color:var(--slate-400);font-family:inherit;transition:all .15s}
.rp-tab:hover{color:var(--slate-600);background:var(--slate-50)}
.rp-tab.active{color:var(--blue-700);border-bottom-color:var(--blue-700)}
.rp-tab-panel{flex-shrink:0;max-height:280px;overflow-y:auto;border-bottom:1px solid var(--slate-200);background:var(--white);padding:14px 13px;display:none}
.rp-tab-panel.open{display:block}
.rp-tab-panel::-webkit-scrollbar{width:4px}
.rp-tab-panel::-webkit-scrollbar-thumb{background:var(--slate-300);border-radius:2px}
.rtp-rule{margin-bottom:12px;font-size:12px;color:var(--slate-600);line-height:1.5}
.rtp-rule-title{font-size:12px;font-weight:700;color:var(--slate-800);margin-bottom:4px}
.rtp-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.rtp-tag{background:var(--blue-50);color:var(--blue-700);border:1px solid var(--blue-100);border-radius:4px;padding:2px 7px;font-size:11px;font-weight:600}
.rtp-eg{margin-bottom:14px}
.rtp-eg-lbl{font-size:11px;font-weight:700;color:var(--slate-500);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.rtp-eg p,.rtp-eg ul{font-size:12px;color:var(--slate-700);line-height:1.6}
.rtp-eg ul{padding-left:14px}
.rtp-eg ul li{margin-bottom:3px}
.rtp-eg .good{color:var(--green-700);background:var(--green-50);border-radius:5px;padding:5px 8px;margin-bottom:4px;font-size:12px}
.rtp-eg .weak{color:#7c3aed;background:#f5f3ff;border-radius:5px;padding:5px 8px;margin-bottom:4px;font-size:12px}
.rtp-rub{background:var(--slate-50);border-radius:7px;padding:10px 11px;margin-bottom:9px}
.rtp-rub-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.rtp-rub-name{font-size:12px;font-weight:700;color:var(--slate-800)}
.rtp-rub-wt{font-size:11px;font-weight:700;color:var(--slate-400)}
.rtp-rub-sc{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.rtp-sc{font-size:11px;padding:2px 7px;border-radius:4px;font-weight:600}
.rtp-sc-a{background:#dcfce7;color:#15803d}
.rtp-sc-b{background:#dbeafe;color:#1d4ed8}
.rtp-sc-d{background:#fee2e2;color:#dc2626}

/* ── Buttons ── */
.btn{border:none;border-radius:7px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s,opacity .15s}
.btn-primary{background:var(--blue-700);color:var(--white)}.btn-primary:hover{background:var(--blue-900)}
.btn-confirm{background:var(--green-600);color:var(--white)}.btn-confirm:hover{background:var(--green-700)}
.btn-ghost{background:var(--slate-100);color:var(--slate-700);border:1px solid var(--slate-200)}.btn-ghost:hover{background:var(--slate-200)}
.btn-lg{padding:11px 24px;font-size:15px}
.btn:disabled{opacity:.38;cursor:not-allowed}
.dl-bar{display:flex;align-items:center;justify-content:space-between;background:var(--slate-900);border-radius:8px;padding:12px 16px;margin-bottom:16px;gap:12px}
.dl-bar-text{font-size:13px;color:var(--slate-300)}
.dl-btn{flex-shrink:0;background:var(--green-600);color:var(--white);border:none;border-radius:7px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.dl-btn:hover{background:var(--green-700)}
.loading-ctr{text-align:center;padding:60px 20px;color:var(--slate-600)}
.spinner{display:inline-block;width:36px;height:36px;border:4px solid var(--slate-200);border-top-color:var(--blue-700);border-radius:50%;animation:spin .8s linear infinite;margin-top:16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── form save bar ── */
.form-save-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 0 16px;border-top:1px solid var(--slate-100);margin-top:12px}

@media(max-width:2400px){:root{--nav-w:190px;--chat-w:660px}}
@media(max-width:1800px){:root{--nav-w:185px;--chat-w:500px}}
@media(max-width:1300px){:root{--nav-w:180px;--chat-w:380px}}
@media(max-width:1000px){:root{--nav-w:175px;--chat-w:280px}}
@media(max-width:900px){:root{--chat-w:260px}}
@media(max-width:700px){.right-panel{width:0!important}.left-nav{width:44px}.nav-label,.nav-check,.nav-heading{display:none}.nav-item{justify-content:center;padding:8px 0}}
@media(max-width:480px){:root{--nav-w:44px}}
</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <span style="font-size:20px">🔍</span>
    <span class="header-title">Employment Search Assignment</span>
    <span class="header-badge">Graded</span>
  </div>
  <div class="app-body">
    <nav class="left-nav" id="leftNav"></nav>
    <div class="center-panel"><div class="center-inner" id="centerInner"></div></div>

    <!-- Right panel: links + AI chat -->
    <div class="right-panel">
      <div class="chat-hdr">💬 AI Grading Assistant</div>
      <div class="rp-site-row">
        <select id="siteSelect" onchange="openJobSite(this)">
          <option value="">🔗 Open a Job Search Site…</option>
        </select>
      </div>
      <div class="rp-tabs">
        <button class="rp-tab" onclick="showRpTab('directions')">📋 Directions</button>
        <button class="rp-tab" onclick="showRpTab('examples')">✏️ Examples</button>
        <button class="rp-tab" onclick="showRpTab('rubric')">📊 Rubric</button>
      </div>
      <div class="rp-tab-panel" id="rpTabPanel"></div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-area">
        <div class="chat-row">
          <textarea class="chat-ta" id="chatInput" rows="1" placeholder="Ask about the assignment…" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
          <button class="chat-send-btn" onclick="sendChat()">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ── Sections ──────────────────────────────────────────
const SECTIONS = [
  {key:'info',  label:'Student Info',   icon:'👤'},
  {key:'jobs',  label:'Document Jobs',  icon:'💼'},
  {key:'grade', label:'Grade & Submit', icon:'📊'},
];
const stepStatus = {info:'active', jobs:'pending', grade:'pending'};
let currentSection = 'info';

// ── State ─────────────────────────────────────────────
let studentName    = '';
let studentProgram = '';
let activeTab      = 0;          // currently visible tab index
const MIN_SLOTS    = 3;
// jobSlots: array of job objects (one per tab), auto-saved on input
let jobSlots = Array.from({length:MIN_SLOTS}, ()=>emptyJob());
// jobComplete[i] = true when user has clicked "Save Job" and it passed validation
let jobComplete = Array(MIN_SLOTS).fill(false);
let gradeResult  = null;
let submissionId = '';
let isThinking   = false;

// ── Right-panel tabs ──────────────────────────────────
let activeRpTab = null;
function showRpTab(tab) {
  const panel = document.getElementById('rpTabPanel');
  const tabs  = document.querySelectorAll('.rp-tab');
  if (activeRpTab === tab) {
    activeRpTab = null;
    panel.classList.remove('open');
    tabs.forEach(t => t.classList.remove('active'));
    return;
  }
  activeRpTab = tab;
  panel.classList.add('open');
  panel.innerHTML = getRpContent(tab);
  tabs.forEach(t => t.classList.toggle('active', t.textContent.toLowerCase().includes(tab.slice(0,3))));
}

function getRpContent(tab) {
  if (tab === 'directions') return rpDirections();
  if (tab === 'examples')   return rpExamples();
  if (tab === 'rubric')     return rpRubric();
  return '';
}

    {name:'Indeed',         group:'National Job Boards', url: q ? `https://www.indeed.com/jobs?q=${q}` : 'https://www.indeed.com'},
    {name:'LinkedIn',       group:'National Job Boards', url: q ? `https://www.linkedin.com/jobs/search/?keywords=${q}` : 'https://www.linkedin.com/jobs/'},

    {name:'Glassdoor',      group:'National Job Boards', url: q ? `https://www.glassdoor.com/Job/jobs.htm?sc.keyword=${q}` : 'https://www.glassdoor.com/Job/index.htm'},
    {name:'Monster',        group:'National Job Boards', url: q ? `https://www.monster.com/jobs/search?q=${q}` : 'https://www.monster.com'},
    {name:'CareerBuilder',  group:'National Job Boards', url: q ? `https://www.careerbuilder.com/jobs?keywords=${q}` : 'https://www.careerbuilder.com'},
    {name:'SimplyHired',    group:'National Job Boards', url: q ? `https://www.simplyhired.com/search?q=${q}` : 'https://www.simplyhired.com'},
    {name:'USAJobs',        group:'National Job Boards', url: q ? `https://www.usajobs.gov/search/results/?k=${q}` : 'https://www.usajobs.gov'},
    {name:'PA CareerLink',  group:'Trade & State',       url:'https://www.pacareerlink.pa.gov/jponline/'},
    {name:'Handshake',      group:'Trade & State',       url: q ? `https://joinhandshake.com/jobs?query=${q}` : 'https://joinhandshake.com'},
    {name:'Tradesmen Intl', group:'Trade & State',       url:'https://www.tradesmenintl.com/find-work/'},
    {name:'Vindicator',     group:'Local Help Wanted',   url:'https://www.vindy.com'},

function submitInfo() {
  const name=document.getElementById('nameInput').value.trim();
  let ok=true;
  if(!name){document.getElementById('nameInput').closest('.fg').classList.add('err');document.getElementById('nameErr').style.display='block';ok=false;}
  else{document.getElementById('nameInput').closest('.fg').classList.remove('err');document.getElementById('nameErr').style.display='none';}
  if(!studentProgram){const pi=document.getElementById('progInput');if(!pi?.value.trim()){pi.closest('.fg').classList.add('err');document.getElementById('progErr').style.display='block';ok=false;}else{pi.closest('.fg').classList.remove('err');studentProgram=pi.value.trim();}}
  if(!ok)return;
  studentName=name;
  renderLinks();
  setStatus('info','done');setStatus('jobs','active');
  addAIMsg(`Got it, **${studentName.split(' ')[0]}**! Open the **🔗 Job Search Sites** panel and start browsing. Find a job you like, then fill in the **Job 1** tab with what you found.\n\nRemember: each job must come from a **different site**.`);
  show('jobs');
}

// ── Jobs: Tab helpers ─────────────────────────────────
function uniqueSources() {
  return [...new Set(
    jobSlots.filter((_,i)=>jobComplete[i]).map(j=>j.source).filter(Boolean)
  )];
}

function tabState(i) {
  if (jobComplete[i]) return 'complete';
  const j=jobSlots[i];
  const hasAny=[j.title,j.company,j.requirements,j.whyInterested].some(v=>v&&v.trim());
  return hasAny?'in-progress':'empty';
}

// ── Jobs: Render tabs + panel ─────────────────────────
function renderJobsInto(container) {
  const uSrc     = uniqueSources();
  const srcCount = uSrc.length;
  const doneCount= jobComplete.filter(Boolean).length;
  const canSubmit= doneCount>=3 && srcCount>=3;

  const srcNeeded = Math.max(0, 3 - srcCount);
  const submitBtn = canSubmit
    ? `<button class="btn btn-confirm btn-lg" onclick="goToGrade()">Submit for Grade →</button>`
    : `<button class="btn btn-confirm btn-lg" disabled>${doneCount<3?`${doneCount}/3 jobs saved`:srcNeeded+' more site'+(srcNeeded>1?'s':'')+' needed'}</button>`;

  // Tab buttons
  const tabs = jobSlots.map((_,i)=>{
    const st  = tabState(i);
    const cls = [i===activeTab?'active':'', st==='complete'?'complete':'', st==='in-progress'?'in-progress':''].filter(Boolean).join(' ');
    return `<div class="job-tab ${cls}" onclick="switchTab(${i})">
      <span class="tab-dot"></span>
      Job ${i+1}
      <span class="tab-check">✓</span>
    </div>`;
  }).join('');
  const submitTabCls = canSubmit ? 'submit-tab' : 'submit-tab disabled';
  const submitTab = `<div class="job-tab ${submitTabCls}" onclick="${canSubmit?'goToGrade()':''}">📊 Submit for Grade</div>`;

  container.innerHTML = `
    <div style="background:var(--blue-900);border-radius:12px;padding:18px 22px;margin-bottom:18px">
      <div style="font-size:11px;font-weight:700;color:var(--blue-400);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px">Research Project</div>
      <div style="font-size:20px;font-weight:800;color:var(--white)">Research Job Opportunities</div>
    </div>
    <div class="job-tabs">${tabs}${submitTab}</div>
    <div class="job-tab-panel" id="jobTabPanel"></div>`;

  renderTabForm();
}

function syncField(field, value) {
  jobSlots[activeTab][field] = value;
  // Mark no longer complete if key field changed
  if (['title','company','location','source','requirements','whyInterested','skillsMatch'].includes(field)) {
    jobComplete[activeTab] = false;
  }
}

function switchTab(i) {
  activeTab = i;
  const ci  = document.getElementById('centerInner');
  if (ci) renderJobsInto(ci);
}


// ── Save current tab ─────────────────────────────────
function saveCurrentJob() {

  jobComplete[activeTab] = true;
  const j = jobSlots[activeTab];
  const uSrc = uniqueSources();
  const doneCount = jobComplete.filter(Boolean).length;
  if (doneCount>=3 && uSrc.length>=3) setStatus('jobs','done');
  else setStatus('jobs','active');

  const srcLeft = Math.max(0,3-uSrc.length);
  addAIMsg(`Saved **Job ${activeTab+1}: ${j.title}** at ${j.company} (${j.location}) — found on ${j.source}.\n\n${doneCount<3?`${3-doneCount} more job${3-doneCount===1?'':'s'} needed.`:''}${srcLeft>0?` Still need ${srcLeft} more different site${srcLeft>1?'s':''}.`:doneCount>=3?' All 3 jobs saved — click **📊 Submit for Grade** when ready!':''}`);

  // Auto-advance to next tab, or enable submit tab if all done
  if (activeTab < 2) {
    activeTab++;
  }
  const ci=document.getElementById('centerInner');
  if(ci) renderJobsInto(ci);
}

function goToGrade() {
  setStatus('jobs','done'); setStatus('grade','active');
  show('grade');
  submitForGrade();
}

// ── Word count ────────────────────────────────────────
function wcCount(text) { return (text||'').trim().split(/\s+/).filter(w=>w.length>0).length; }
function wcStr(text, min) { const c=wcCount(text); return c+' / '+min+' words min'; }
function wcCls(text, min) { const c=wcCount(text); if(!text||!text.trim()) return ''; return c>=min?'ok':'warn'; }
function liveWC(el, countId, min) {
  const c=wcCount(el.value);
  const node=document.getElementById(countId);
  if(!node) return;
  node.textContent=c+' / '+min+' words min';
  node.className='wc-count'+(c>=min?' ok':c>0?' warn':'');
}

function gradeLabel(s){return s>=90?'Excellent Work!':s>=80?'Great Job!':s>=70?'Good Effort!':s>=60?'Passing — Room to Grow':'Needs More Work';}

// ── AI Grading ────────────────────────────────────────
async function submitForGrade() {
  gradeResult=null;
  const doneJobs=jobSlots.filter((_,i)=>jobComplete[i]);
  try {
    const jobSummaries=doneJobs.map((j,i)=>
      `Job ${i+1}: ${j.title} at ${j.company}, ${j.location}. Found on: ${j.source||'unspecified'}.${j.url?' URL: '+j.url:''}
Requirements (${wcCount(j.requirements)} words): ${j.requirements}
Why Interested (${wcCount(j.whyInterested)} words): ${j.whyInterested}
Skills I Have (${wcCount(j.skillsMatch)} words): ${j.skillsMatch}
Company Research (${wcCount(j.skillsNeeded)} words): ${j.skillsNeeded||'Not provided'}
Would Apply: ${j.wouldApply||'Not answered'}`
    ).join('\n\n');

    const uSrc=uniqueSources();
    const sys=`You are grading a trade school student's employment search assignment. Program: "${studentProgram||'trade'}". They submitted ${doneJobs.length} job(s) from ${uSrc.length} different source(s): ${uSrc.join(', ')}.

JOBS:
${jobSummaries}

Grade on 4 criteria (0-100, 25% each):
- completeness: All required fields filled with real content? Locations included? URL provided when possible? Word counts meaningful (40-50+ word minimums)?
- programRelevance: Jobs relate to the student's trade program? Credit for related fields.
- effort: Written responses thorough and show genuine thought? Reward effort and specificity over writing quality.
- reflection: Did the student research the company? Did they describe what the company does, its size, location, or anything notable from their website? Reward genuine independent research.

Scoring guidelines — be generous, this is a trade school assignment:
- A student who filled every field with real content and meets word minimums should score 85–92.
- Only go below 75 if fields are clearly incomplete, fake, or way under the word minimums.
- Reward effort and specificity over polished writing quality.
- Using 3 different job sites is the whole point — note it positively in feedback.

Return ONLY valid JSON (no letter grade, just points):
{"overall":85,"scores":{"completeness":88,"programRelevance":85,"effort":85,"reflection":82},"feedback":{"completeness":"","programRelevance":"","effort":"","reflection":""},"strengths":"","improvements":"","encouragement":""}`;

    const raw=await callAPI(sys,'Grade this assignment.');
    const match=raw.match(/\{[\s\S]*\}/);
    if(!match) throw new Error('no json');
    gradeResult=JSON.parse(match[0]);
  } catch(e) {
    gradeResult=gradeJS();
  }
  submissionId=genId();
  gradeResult._submissionId=submissionId;
  const doneJobsFinal=jobSlots.filter((_,i)=>jobComplete[i]);
  localStorage.setItem('empSearch_submission',JSON.stringify({studentName,studentProgram,jobs:doneJobsFinal,gradeResult,submittedAt:new Date().toISOString()}));
  setStatus('grade','done');
  show('grade');
  addAIMsg(`Score: **${gradeResult.overall}/100** — ${gradeResult.encouragement||'Good work.'}\n\nDownload the PDF and submit in Canvas.`);
}

// ── Fallback grader ───────────────────────────────────
function gradeJS() {
  const doneJobs=jobSlots.filter((_,i)=>jobComplete[i]);
  let comp=0, rel=80, eff=0, refl=0;
  const prog=(studentProgram||'').toLowerCase();
  const relTerms=prog.split(/\s+/).filter(w=>w.length>3);
  doneJobs.forEach(j=>{
    // Completeness: all key fields present
    const filled=[j.title,j.company,j.location,j.source,j.requirements,j.whyInterested,j.skillsMatch].filter(f=>f&&f.trim().length>2).length;
    const hasUrl = j.url && j.url.trim().length > 5;
    comp += Math.min(100, (filled/7)*95 + (hasUrl?5:0));
    // Program relevance
    if(relTerms.some(t=>[j.title,j.requirements].join(' ').toLowerCase().includes(t))) rel=Math.min(100,rel+6);
    // Effort: word counts on requirements + reflections
    const rw=wcCount(j.requirements), ww=wcCount(j.whyInterested), mw=wcCount(j.skillsMatch);
    const totalWords=rw+ww+mw;
    eff+=totalWords>=160?92:totalWords>=100?85:totalWords>=60?75:62;
    // Company research
    const cw=wcCount(j.skillsNeeded);
    refl+=cw>=50?92:cw>=30?85:cw>=15?75:cw>3?65:50;
  });
  const n=doneJobs.length||1;
  comp=Math.round(comp/n); eff=Math.round(eff/n); refl=Math.round(refl/n); rel=Math.min(97,rel);
  const uSrc=uniqueSources();
  // Bonus for using multiple sources — core goal of the assignment
  if(uSrc.length>=3) { comp=Math.min(100,comp+5); rel=Math.min(100,rel+3); }
  const overall=Math.max(60, Math.round(comp*.25+rel*.25+eff*.25+refl*.25));
  return{overall,
    scores:{completeness:comp,programRelevance:rel,effort:eff,reflection:refl},
    feedback:{
      completeness:comp>=90?'All fields complete with good detail.':comp>=80?'Fields are filled in — adding a job URL would push this higher.':'Some fields need more content.',
      programRelevance:rel>=85?'Great job choosing positions in your trade area.':'Try to pick jobs that connect directly to your program.',
      effort:eff>=88?'Thorough responses — you clearly put in the work.':eff>=78?'Good effort overall. More detail in your written responses would help.':'Expand your written responses — aim for the word count minimums in every field.',
      reflection:refl>=88?'Strong company research — you went beyond just the job listing.':refl>=75?'Good start on company research. Add a few more specific details from their website.':'Visit the company website and describe what they do, how big they are, and what stood out.',
    },
    strengths:`You researched ${doneJobs.length} job${doneJobs.length>1?'s':''} from ${uSrc.length} different source${uSrc.length>1?'s':''} — that\'s the whole point of this assignment.`,
    improvements:overall<82?'Focus on expanding written responses to meet the word count targets in every field.':'Strong work. Make sure each company research section mentions specific details from their website.',
    encouragement:overall>=90?'Excellent work!':overall>=83?'Great job!':overall>=75?'Good effort — a little more detail in your responses would push this higher.':'Keep working at it — more detail in each field will improve your score.',
  };
}

// ── PDF ───────────────────────────────────────────────
function downloadPDF() {
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  const M=18,W=210-M*2;let y=M;
  const chk=(n=10)=>{if(y+n>285){doc.addPage();y=M;}};
  const hl=()=>{doc.setDrawColor(180);doc.setLineWidth(.3);doc.line(M,y,M+W,y);y+=5;};
  const sec=(t,rgb=[30,58,138])=>{chk(14);doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(...rgb);doc.text(t.toUpperCase(),M,y);y+=1;hl();doc.setTextColor(30,30,30);};
  const fld=(l,v,ind=0)=>{if(!v)return;chk(8);doc.setFontSize(9);doc.setFont('helvetica','bold');doc.setTextColor(80,80,80);doc.text(l.toUpperCase(),M+ind,y);y+=4;doc.setFont('helvetica','normal');doc.setTextColor(30,30,30);doc.setFontSize(10);doc.splitTextToSize(v,W-ind).forEach(ln=>{chk(6);doc.text(ln,M+ind,y);y+=5;});y+=2;};

  doc.setFillColor(15,23,42);doc.rect(0,0,210,26,'F');
  doc.setFontSize(16);doc.setFont('helvetica','bold');doc.setTextColor(255,255,255);
  doc.text('Employment Search Assignment',M,12);
  doc.setFontSize(10);doc.setFont('helvetica','normal');doc.setTextColor(148,163,184);
  doc.text(`${studentName}   |   ${studentProgram||'Trade'}   |   ${new Date().toLocaleDateString()}`,M,21);
  y=34;

  if(gradeResult){
    const g=gradeResult;
    sec('Grade Summary');
    doc.setFontSize(22);doc.setFont('helvetica','bold');doc.setTextColor(30,58,138);
    doc.text(`${g.overall} / 100`,M,y);y+=8;
    doc.setFontSize(10);doc.setFont('helvetica','normal');doc.setTextColor(60,60,60);
    if(g.encouragement){doc.splitTextToSize(g.encouragement,W).forEach(l=>{chk(6);doc.text(l,M,y);y+=5;});}
    y+=3;
    [{key:'completeness',label:'Completeness'},{key:'programRelevance',label:'Program Relevance'},{key:'effort',label:'Effort & Detail'},{key:'reflection',label:'Company Research'}].forEach(r=>{
      const sc=g.scores?.[r.key]??75,fb=g.feedback?.[r.key]??'';
      chk(10);doc.setFontSize(9);doc.setFont('helvetica','bold');doc.setTextColor(80,80,80);
      doc.text(`${r.label}: ${sc}/100`,M,y);
      doc.setDrawColor(220);doc.setLineWidth(.5);doc.rect(M+65,y-4,70,5,'S');
      doc.setFillColor(30,78,216);doc.rect(M+65,y-4,70*(sc/100),5,'F');y+=5;
      if(fb){doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(100,100,100);doc.splitTextToSize(fb,W-8).forEach(l=>{chk(5);doc.text(l,M+4,y);y+=4;});}
    });
    if(g.strengths) fld('What You Did Well',g.strengths);
    if(g.improvements) fld('How to Improve',g.improvements);
    fld('Job Sites Used',uniqueSources().join(', '));
    y+=4;
  }

  const doneJobs=jobSlots.filter((_,i)=>jobComplete[i]);
  doneJobs.forEach((j,i)=>{
    sec(`Job ${i+1}: ${j.title}`);
    fld('Company & Location',j.company+(j.location?' — '+j.location:''));
    fld('Found On',j.source+(j.url?' · '+j.url:''));
    fld('Key Requirements',j.requirements);
    fld('Why Interested',j.whyInterested);
    fld('Skills I Have',j.skillsMatch);
    if(j.skillsNeeded) fld('Company Research',j.skillsNeeded);
    if(j.wouldApply) fld('Would Apply?',j.wouldApply);
    y+=4;
  });

  doc.setFontSize(8);doc.setTextColor(150,150,150);
  doc.text(`ID: ${submissionId||'draft'}  |  AI Resume Builder`,M,290);
  doc.save(`${(studentName||'Student').replace(/\s+/g,'-')}-Employment-Search.pdf`);
}

// ── Chat ──────────────────────────────────────────────
async function sendChat() {
  const inp=document.getElementById('chatInput');
  const text=inp.value.trim();
  if(!text||isThinking) return;
  inp.value=''; inp.style.height='';
  addUserMsg(text);
  isThinking=true;
  const td=document.createElement('div');td.className='msg-ai';
  td.innerHTML='<div class="msg-lbl">AI</div><div class="msg-bubble" style="color:var(--slate-400)">Thinking…</div>';
  document.getElementById('chatMessages').appendChild(td);
  document.getElementById('chatMessages').scrollTop=99999;
  try {
    const doneJobs=jobSlots.filter((_,i)=>jobComplete[i]);
    const uSrc=uniqueSources();
    const sys=`You are an AI grading assistant for a trade school employment search assignment. Student: ${studentName||'Student'}. Program: ${studentProgram||'trade'}. They have ${doneJobs.length} saved job(s) from ${uSrc.length} unique site(s).

IMPORTANT RULES:
- You do NOT write content for the student. You do not improve, reword, or expand their responses.
- You answer questions about the assignment: what sites to use, what the rubric looks for, how to find jobs.
- You can point out that a response seems too short, but you will not write it for them.
- For local jobs: Vindicator (vindy.com), New Castle News (ncnewsonline.com), Sharon Herald (sharonherald.com).
- Links are in the panel above the chat — you don't need to repeat URLs unless asked.
- Keep responses short and practical.`;
    const reply=await callAPI(sys,text);
    td.remove(); addAIMsg(reply);
  } catch(e) { td.remove(); addAIMsg('Connection error — try again.'); }
  isThinking=false;
}

function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,90)+'px';}

function addAIMsg(text){
  const m=document.getElementById('chatMessages');if(!m)return;
  const d=document.createElement('div');d.className='msg-ai';
  d.innerHTML=`<div class="msg-lbl">AI</div><div class="msg-bubble">${escHtml(text).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}</div>`;
  m.appendChild(d);m.scrollTop=m.scrollHeight;
}
function addUserMsg(text){
  const m=document.getElementById('chatMessages');if(!m)return;
  const d=document.createElement('div');d.className='msg-user';
  d.innerHTML=`<div class="msg-bubble">${escHtml(text)}</div>`;
  m.appendChild(d);m.scrollTop=m.scrollHeight;
}

// ── API ───────────────────────────────────────────────
async function callAPI(system,userMsg,maxTokens=1400){
  const body={model:'claude-sonnet-4-6',max_tokens:maxTokens,messages:[{role:'user',content:userMsg}]};
  if(system) body.system=system;
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),45000);
  try{
    const res=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctrl.signal});
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error||'API error');}
    return (await res.json()).content[0].text;
  } finally{clearTimeout(timer);}
}

function escHtml(str){
  if(!str)return'';const d=document.createElement('div');
  d.appendChild(document.createTextNode(String(str)));return d.innerHTML;
}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
