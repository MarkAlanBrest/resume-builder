<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resume Builder</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chat {
      background: white;
      border-radius: 20px;
      padding: 60px 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 400px;
    }
    .logo-icon {
      font-size: 80px;
      display: block;
      margin-bottom: 20px;
    }
    .logo-text {
      font-size: 32px;
      color: #333;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .tagline {
      color: #666;
      font-size: 16px;
      margin-bottom: 40px;
    }
    .start-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 18px 60px;
      font-size: 20px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .start-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }
  </style>
</head>
<body>

<div class="chat">

  <span class="logo-icon">✨</span>
  <div class="logo-text">Resume Builder</div>
  <div class="tagline">Create your professional resume in minutes</div>

  <button class="start-btn" onclick="start()">Get Started</button>

</div>

<script>
function start() {
  window.location.href = "student-info.html";
}
</script>

</body>
</html>
