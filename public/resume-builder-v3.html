<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Resume Builder v3</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue-900:#1e3a8a;--blue-800:#1e40af;--blue-700:#1d4ed8;--blue-100:#dbeafe;--blue-50:#eff6ff;
  --slate-900:#0f172a;--slate-700:#334155;--slate-600:#475569;--slate-500:#64748b;
  --slate-400:#94a3b8;--slate-300:#cbd5e1;--slate-200:#e2e8f0;--slate-100:#f1f5f9;--slate-50:#f8fafc;
  --green-600:#16a34a;--green-700:#15803d;--red-600:#dc2626;--white:#ffffff;
  --nav-w:195px;--chat-w:900px;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#64748b}

/* ── App Shell ── */
.app{display:flex;flex-direction:column;height:100vh;max-width:3000px;margin:0 auto;box-shadow:0 0 60px rgba(0,0,0,.3)}
.app-body{flex:1;display:flex;overflow:hidden}

/* ── Header ── */
.app-header{flex-shrink:0;height:60px;background:var(--slate-900);display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:12px}
.header-brand{display:flex;align-items:center;gap:9px;white-space:nowrap}
.header-brand span{font-size:20px}
.header-title{font-size:16px;font-weight:700;color:var(--white)}
.header-badge{font-size:10px;font-weight:700;color:var(--slate-400);background:rgba(255,255,255,.08);padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
.ai-status-badge{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap;color:#94a3b8}
.ai-status-badge.ok{color:#86efac}
.ai-status-badge.err{color:#fbbf24}
.ai-dot{width:7px;height:7px;border-radius:50%;background:#94a3b8;flex-shrink:0}
.ai-status-badge.ok .ai-dot{background:#4ade80;animation:pulse 2s ease-in-out infinite}
.ai-status-badge.err .ai-dot{background:#fbbf24}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.chat-toggle-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:var(--white);padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.chat-toggle-btn:hover{background:rgba(255,255,255,.18)}

/* ── Left Nav ── */
.left-nav{width:var(--nav-w);flex-shrink:0;background:var(--white);border-right:1px solid var(--slate-200);overflow-y:auto;display:flex;flex-direction:column;padding:16px 0}
.nav-heading{font-size:10px;font-weight:700;color:var(--slate-400);text-transform:uppercase;letter-spacing:.8px;padding:0 14px 10px}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;transition:background .15s;position:relative}
.nav-item:hover{background:var(--slate-50)}
.nav-item.active{background:var(--blue-50)}
.nav-item.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--blue-700);border-radius:0 3px 3px 0}
.nav-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.nav-item.pending .nav-icon{background:var(--slate-100);filter:grayscale(1) opacity(.5)}
.nav-item.active .nav-icon{background:var(--blue-100)}
.nav-item.done .nav-icon{background:#dcfce7}
.nav-label{font-size:12px;font-weight:600}
.nav-item.pending .nav-label{color:var(--slate-400)}
.nav-item.active .nav-label{color:var(--blue-700)}
.nav-item.done .nav-label{color:var(--slate-600)}
.nav-check{margin-left:auto;font-size:11px;color:var(--green-600);font-weight:700;display:none}
.nav-item.done .nav-check{display:block}

/* ── Center Panel ── */
.center-panel{flex:1;overflow-y:auto;background:var(--slate-100)}
.center-panel::-webkit-scrollbar{width:14px}
.center-panel::-webkit-scrollbar-track{background:var(--slate-200)}
.center-panel::-webkit-scrollbar-thumb{background:var(--slate-400);border-radius:7px;border:3px solid var(--slate-200)}
.center-inner{max-width:800px;margin:0 auto;padding:28px 24px}

/* Section header in center */
.section-hdr{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.section-hdr-icon{width:44px;height:44px;border-radius:10px;background:var(--blue-50);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.section-hdr-title{font-size:20px;font-weight:700;color:var(--slate-900)}
.section-hdr-sub{font-size:13px;color:var(--slate-500);margin-top:2px}

/* ── Form Card ── */
.form-card{background:var(--white);border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.08);overflow:hidden;margin-bottom:16px}
.form-card-hdr{background:var(--blue-900);color:var(--white);padding:12px 18px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.form-card-body{padding:18px 18px 6px}
.form-card-footer{padding:12px 18px 14px;display:flex;justify-content:flex-end;gap:8px;background:var(--slate-50);border-top:1px solid var(--slate-100)}

/* ── Form Fields ── */
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.f-row.single{grid-template-columns:1fr}
.f-row.triple{grid-template-columns:2fr 1fr 1fr}
.f-group{display:flex;flex-direction:column;gap:4px}
.f-group label{font-size:11px;font-weight:700;color:var(--slate-500);text-transform:uppercase;letter-spacing:.6px}
.f-group input,.f-group select,.f-group textarea{border:1.5px solid var(--slate-200);border-radius:7px;padding:9px 11px;font-size:14px;color:var(--slate-900);background:var(--slate-50);outline:none;width:100%;font-family:inherit;margin:0;transition:border-color .18s,box-shadow .18s}
.f-group input:focus,.f-group select:focus,.f-group textarea:focus{border-color:var(--blue-700);box-shadow:0 0 0 3px rgba(29,78,216,.12);background:var(--white)}
.f-group textarea{resize:vertical;min-height:70px}
.f-group select:disabled{opacity:.45;cursor:not-allowed}
.f-err{font-size:11px;color:var(--red-600);display:none;margin-top:1px}
.f-group.has-error input,.f-group.has-error select,.f-group.has-error textarea{border-color:var(--red-600)}
.f-group.has-error .f-err{display:block}

/* ── Date Pair ── */
.date-pair{display:grid;grid-template-columns:1.6fr 1fr;gap:8px}
.date-pair input,.date-pair select{border:1.5px solid var(--slate-200);border-radius:7px;padding:9px 11px;font-size:14px;color:var(--slate-900);background:var(--slate-50);outline:none;width:100%;font-family:inherit;margin:0;transition:border-color .18s}
.date-pair input:focus,.date-pair select:focus{border-color:var(--blue-700);background:var(--white)}
.date-pair select:disabled,.date-pair input:disabled{opacity:.45}

/* ── Check Grid ── */
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:4px}
.check-opt{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--slate-700);cursor:pointer;padding:5px 8px;border-radius:6px;border:1.5px solid var(--slate-200);background:var(--slate-50);transition:border-color .15s;user-select:none}
.check-opt:hover{border-color:var(--blue-700);background:var(--blue-50)}
.check-opt input[type="checkbox"]{width:15px;height:15px;margin:0;flex-shrink:0;accent-color:var(--blue-700)}
.check-opt-inline{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;margin-top:6px;cursor:pointer}
.check-opt-inline input{accent-color:var(--blue-700)}
.two-panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.two-panel-grid{grid-template-columns:1fr}}
.sc-item-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sc-item-row input{flex:1;width:auto}
.sc-row-del{flex-shrink:0;padding:4px 8px}
.sc-list-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;font-size:12px;color:var(--slate-500)}
.sc-list-actions .btn{padding:6px 12px;font-size:12px}

/* ── Buttons ── */
.btn{padding:9px 20px;border-radius:7px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .15s;font-family:inherit;line-height:1}
.btn-primary{background:var(--blue-900);color:var(--white)}
.btn-primary:hover{background:var(--blue-800);transform:translateY(-1px);box-shadow:0 4px 14px rgba(30,58,138,.28)}
.btn-primary:disabled{background:var(--slate-300);cursor:not-allowed;transform:none;box-shadow:none}
.btn-ghost{background:var(--blue-900);color:var(--white);border:none}
.btn-ghost:hover{background:var(--blue-800);transform:translateY(-1px);box-shadow:0 4px 14px rgba(30,58,138,.28)}
.btn-confirm{background:var(--blue-900);color:var(--white)}
.btn-confirm:hover{background:var(--blue-800);transform:translateY(-1px);box-shadow:0 4px 14px rgba(30,58,138,.28)}
.btn-lg{padding:12px 28px;font-size:15px}

/* ── Approval Card ── */
.approval-card{background:var(--white);border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.08);overflow:hidden;margin-bottom:16px}
.approval-hdr{background:var(--green-600);color:var(--white);padding:12px 18px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.approval-body{padding:6px 18px 2px}
.a-row{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--slate-100)}
.a-row:last-child{border-bottom:none}
.a-label{font-size:11px;font-weight:700;color:var(--slate-400);text-transform:uppercase;letter-spacing:.5px;min-width:80px;flex-shrink:0}
.a-value{font-size:14px;color:var(--slate-800)}
.approval-footer{padding:12px 18px 14px;display:flex;justify-content:flex-end;gap:8px;background:var(--slate-50);border-top:1px solid var(--slate-100)}

/* ── Bullet list ── */
.bullet-list{list-style:none;padding:0;margin:0}
.bullet-list li{display:flex;gap:8px;padding:5px 0;font-size:14px;color:var(--slate-800);line-height:1.5;border-bottom:1px solid var(--slate-100)}
.bullet-list li:last-child{border-bottom:none}
.bullet-list li::before{content:'•';color:var(--blue-700);font-weight:700;flex-shrink:0}

/* ── Editable bullet/item rows ── */
.ebl-item{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid var(--slate-100)}
.ebl-item:last-child{border-bottom:none}
.ebl-dot{color:var(--blue-700);font-weight:700;flex-shrink:0;padding-top:2px}
.ebl-text{flex:1;font-size:14px;color:var(--slate-800);line-height:1.5}
.ebl-input{flex:1;border:1.5px solid var(--blue-700);border-radius:5px;padding:3px 8px;font-size:13px;font-family:inherit;outline:none}
.ebl-actions{display:flex;gap:3px;flex-shrink:0;padding-top:1px}
.ebl-btn{background:none;border:1px solid var(--slate-200);border-radius:4px;padding:2px 7px;font-size:11px;cursor:pointer;color:var(--slate-500);font-family:inherit;line-height:1.5}
.ebl-btn:hover{background:var(--slate-100)}
.ebl-btn.del:hover{background:#fee2e2;border-color:#fca5a5;color:#dc2626}
.ebl-btn.save{color:#16a34a;border-color:#16a34a}
.ebl-btn.save:hover{background:#dcfce7}

/* ── Done card ── */
.done-card{background:var(--white);border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.08);padding:28px 24px;text-align:center;margin-bottom:16px}
.done-icon{font-size:40px;display:block;margin-bottom:12px}
.done-title{font-size:18px;font-weight:700;color:var(--slate-900);margin-bottom:6px}
.done-sub{font-size:14px;color:var(--slate-500);margin-bottom:20px}
.done-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ── Welcome screen ── */
.welcome-card{background:var(--white);border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.08);padding:36px 28px;text-align:center;margin-bottom:16px}
.welcome-icon{font-size:48px;display:block;margin-bottom:16px}
.welcome-title{font-size:22px;font-weight:700;color:var(--slate-900);margin-bottom:8px}
.welcome-sub{font-size:14px;color:var(--slate-500);line-height:1.6;margin-bottom:24px}
.welcome-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ── Upload ── */
.upload-drop{border:2px dashed var(--slate-300);border-radius:8px;padding:28px 20px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;margin-bottom:12px}
.upload-drop:hover,.upload-drop.drag-over{border-color:var(--blue-700);background:var(--blue-50)}
.upload-drop .drop-icon{font-size:30px;display:block;margin-bottom:8px}
.upload-drop .drop-lbl{font-size:14px;color:var(--slate-600);font-weight:600}
.upload-drop .drop-sub{font-size:12px;color:var(--slate-400);margin-top:4px}
.upload-selected{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--blue-50);border:1.5px solid var(--blue-100);border-radius:7px;margin-bottom:12px;font-size:13px;color:var(--blue-700);font-weight:600}

/* ── Inline actions ── */
.inline-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}

/* ── Prefill banner ── */
.prefill-banner{background:var(--blue-50);border:1.5px solid var(--blue-100);border-radius:7px;padding:9px 12px;margin-bottom:12px;font-size:13px;color:var(--blue-700)}

/* ── Template Configurator ── */
.style-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:4px}
.style-btn{border:2.5px solid var(--slate-200);border-radius:8px;background:var(--white);cursor:pointer;overflow:hidden;text-align:center;transition:border-color .15s,box-shadow .15s;padding:0}
.style-btn:hover{border-color:var(--slate-400)}
.style-btn.sel{border-color:var(--blue-700);box-shadow:0 0 0 2px var(--blue-700)}
.style-preview{width:100%;aspect-ratio:8.5/11;overflow:hidden;background:white}
.style-name{font-size:11px;font-weight:600;color:var(--slate-600);padding:5px 4px;background:var(--slate-50);border-top:1px solid var(--slate-100)}
.style-btn.sel .style-name{color:var(--blue-700);background:var(--blue-50)}
.color-row{display:flex;gap:10px;flex-wrap:wrap}
.color-swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .15s,border-color .15s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.color-swatch:hover{transform:scale(1.12)}
.color-swatch.sel{border-color:var(--slate-900);transform:scale(1.15)}
.bullet-opt{border:1.5px solid var(--slate-200);border-radius:7px;padding:7px 16px;font-size:15px;background:var(--slate-50);cursor:pointer;color:var(--slate-700);transition:border-color .15s,background .15s;font-family:inherit}
.bullet-opt:hover{border-color:var(--slate-400);background:var(--slate-100)}
.bullet-opt.sel{border-color:var(--blue-700);background:var(--blue-50);color:var(--blue-700);font-weight:700}
.opt-label{font-size:11px;font-weight:700;color:var(--slate-500);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.color-picker-wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
input[type="color"].color-input{width:42px;height:42px;border:2px solid var(--slate-200);border-radius:8px;cursor:pointer;padding:2px;background:var(--white);flex-shrink:0}
input[type="color"].color-input::-webkit-color-swatch-wrapper{padding:0;border-radius:5px}
input[type="color"].color-input::-webkit-color-swatch{border:none;border-radius:5px}
.color-presets{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.color-preset{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:transform .15s,border-color .15s;box-shadow:0 1px 3px rgba(0,0,0,.2);flex-shrink:0}
.color-preset:hover{transform:scale(1.18)}
.color-preset.sel{border-color:var(--slate-900);transform:scale(1.12)}
.icon-set-btns{display:flex;gap:8px;flex-wrap:wrap}
.icon-set-btn{padding:7px 14px;border:1.5px solid var(--slate-200);border-radius:7px;background:var(--slate-50);font-size:13px;cursor:pointer;font-family:inherit;color:var(--slate-700);transition:border-color .15s,background .15s}
.icon-set-btn:hover{border-color:var(--slate-400);background:var(--slate-100)}
.icon-set-btn.sel{border-color:var(--blue-700);background:var(--blue-50);color:var(--blue-700);font-weight:700}
.sugg-card{padding:2px 0}
.sugg-label{font-size:11px;font-weight:700;color:var(--slate-400);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.sugg-item{display:flex;align-items:flex-start;gap:8px;padding:6px 4px;border-radius:5px;cursor:pointer;transition:background .12s;margin:0 -4px}
.sugg-item:hover{background:var(--blue-50)}
.sugg-item+.sugg-item{border-top:1px solid var(--slate-100)}
.sugg-text{flex:1;font-size:12px;color:var(--slate-700);line-height:1.45}
.sugg-use{background:var(--blue-700);color:white;border:none;border-radius:4px;padding:3px 8px;font-size:10px;font-weight:600;cursor:pointer;flex-shrink:0;font-family:inherit;margin-top:1px}
.sugg-use:hover{background:var(--blue-800)}

/* ── Right Panel (AI Chat) ── */
.right-panel{width:var(--chat-w);flex-shrink:0;display:flex;flex-direction:column;background:var(--slate-50);border-left:1px solid var(--slate-200);transition:width .25s ease;overflow:hidden}
.right-panel.collapsed{width:46px}
.rp-header{height:48px;flex-shrink:0;background:var(--white);border-bottom:1px solid var(--slate-200);display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px}
.rp-title{font-size:13px;font-weight:700;color:var(--slate-700);white-space:nowrap;overflow:hidden}
.right-panel.collapsed .rp-title{display:none}
.rp-toggle{width:28px;height:28px;border:none;background:var(--slate-100);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;transition:background .15s}
.rp-toggle:hover{background:var(--slate-200)}
.chat-messages{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.chat-messages::-webkit-scrollbar{width:10px}
.chat-messages::-webkit-scrollbar-thumb{background:var(--slate-300);border-radius:5px;border:2px solid var(--slate-50)}
.right-panel.collapsed .chat-messages,.right-panel.collapsed .chat-input-area{display:none}
.chat-msg{display:flex;flex-direction:column;gap:3px;animation:fadeUp .25s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.chat-msg.ai .msg-bubble{background:var(--white);color:var(--slate-900);border-radius:10px 10px 10px 3px;box-shadow:0 1px 4px rgba(0,0,0,.09)}
.chat-msg.user .msg-bubble{background:var(--blue-900);color:var(--white);border-radius:10px 10px 3px 10px;align-self:flex-end}
.msg-bubble{padding:9px 12px;font-size:13px;line-height:1.5;max-width:100%}
.msg-lbl{font-size:10px;font-weight:700;color:var(--slate-400);text-transform:uppercase;letter-spacing:.5px}
.chat-msg.user .msg-lbl{text-align:right}
.t-dots{display:flex;gap:4px;padding:4px 2px}
.t-dot{width:6px;height:6px;background:var(--slate-400);border-radius:50%;animation:bounce 1.1s ease-in-out infinite}
.t-dot:nth-child(2){animation-delay:.18s}
.t-dot:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.chat-input-area{flex-shrink:0;padding:10px 12px;background:var(--white);border-top:1px solid var(--slate-200)}
.chat-input-row{display:flex;gap:8px;align-items:flex-end}
.chat-input{flex:1;border:1.5px solid var(--slate-200);border-radius:18px;padding:8px 14px;font-size:13px;resize:none;min-height:36px;max-height:90px;outline:none;font-family:inherit;transition:border-color .18s;line-height:1.4}
.chat-input:focus{border-color:var(--blue-700)}
.chat-input:disabled{background:var(--slate-50);color:var(--slate-400)}
.chat-send{width:34px;height:34px;border-radius:50%;background:var(--blue-900);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;padding:0}
.chat-send:hover:not(:disabled){background:var(--blue-800);transform:scale(1.06)}
.chat-send:disabled{background:var(--slate-300);cursor:not-allowed}
.chat-send svg{width:15px;height:15px;fill:var(--white);margin-left:1px}

/* ── Responsive ── */
@media(max-width:2400px){:root{--nav-w:190px;--chat-w:660px}}

function sanitizeResumeData(data) {
  if (!data || typeof data !== 'object') return data;
  delete data.courseOfStudy;
  delete data.educationSkills;
  delete data._assignmentImported;
  delete data._courseOfStudyFromAssignment;
  if (data.skills !== undefined) {
    const skills = normalizeSkillsList(data.skills);
    data.skills = skills;
    if (!skills.length) delete data._skillsFromUpload;
  }
  if (data.certifications !== undefined) {
    const certifications = normalizeCertificationsList(data.certifications);
    data.certifications = certifications;
    if (!certifications.length) delete data._certsFromUpload;
  }
  return data;
}

function saveProgress(){
  try{
    const payload = sanitizeResumeData({ ...resumeData });
    localStorage.setItem('rb_progress', JSON.stringify(payload));
  }catch(e){}
}
function loadProgress(){
  try{
    const s = localStorage.getItem('rb_progress');
    return s ? sanitizeResumeData(JSON.parse(s)) : null;
  }catch(e){return null;}
}
function clearProgress(){
  localStorage.removeItem('rb_progress');
}

let programDefaultsCatalog = null;

  skills: ['Safety procedures','Hand and power tools','Customer service','Teamwork','Problem solving','Time management'],
  certifications: ['OSHA 10','First Aid/CPR','Forklift Certification']
};

async function loadCourseOfStudyCatalog() {
  if (courseOfStudyCatalog) return courseOfStudyCatalog;
  const res = await fetch('/api/course-of-study', { cache: 'no-store' });
  if (!res.ok) throw new Error('Could not load Course of Study data');
  courseOfStudyCatalog = await res.json();
  return courseOfStudyCatalog;
}

async function resolveCourseOfStudyForResume() {
  const program = resumeData.personal.program || '';
  const campus = resumeData.personal.campus || '';
  const school = campus || 'Trade School';
  const programKey = campus && program ? makeProgramKey(campus, program) : program;
  try {
    const catalog = await loadCourseOfStudyCatalog();
    const text = catalog?.[programKey]?.text?.trim();
    if (text) return text;
  } catch(e) {
    console.warn('Course of Study lookup failed', e);
  }
  return `Completed hands-on training in ${program || 'trade program'} at ${school}, building practical skills, safety awareness, and job-ready competencies for entry-level work in the field.`;
}

async function loadProgramDefaultsCatalog() {
  if (programDefaultsCatalog) return programDefaultsCatalog;
  const res = await fetch('/api/program-defaults', { cache: 'no-store' });
  if (!res.ok) throw new Error('Could not load program defaults');
  programDefaultsCatalog = await res.json();
  return programDefaultsCatalog;
}

async function resolveProgramDefaults(program, campus) {
  const programKey = campus && program ? makeProgramKey(campus, program) : program;
  try {
    const catalog = await loadProgramDefaultsCatalog();
    const entry = catalog?.[programKey];
    if (entry?.skills?.length || entry?.certifications?.length) {
      return {
        skills: Array.isArray(entry.skills) ? entry.skills : [],
        certifications: Array.isArray(entry.certifications) ? entry.certifications : [],
      };
    }
  } catch(e) {
    console.warn('Program defaults lookup failed', e);
  }
  return { ...FALLBACK_PROGRAM_DEFAULTS, skills: [...FALLBACK_PROGRAM_DEFAULTS.skills], certifications: [...FALLBACK_PROGRAM_DEFAULTS.certifications] };
}

async function showSkillsSection() {

  const campus = resumeData.personal.campus || '';
  currentProgramDefaults = await resolveProgramDefaults(program, campus);
  showCenter('skills');

}

    }).join('');
}

function showCenter(view, data) {
  const el = document.getElementById('centerInner');
  const views = {
    welcome:        renderWelcome,
    upload:         renderUpload,
    personal:       renderPersonalForm,
    career:         renderCareerForm,
    careerApproval: renderCareerApproval,
    objectiveApproval: renderObjectiveApproval,
    work:           renderWorkForm,
    workApproval:   renderWorkApproval,
    workDone:          renderWorkDone,
    military:          renderMilitaryForm,
    militaryApproval:  renderMilitaryApproval,
    militaryDone:      renderMilitaryDone,
    education:         renderEduForm,
    eduApproval:    renderEduApproval,
    eduDone:        renderEduDone,
    volunteer:          renderVolunteerForm,
    volunteerApproval:  renderVolunteerApproval,
    volunteerDone:      renderVolunteerDone,
    skills:         renderSkillsForm,
    skillsApproval: renderSkillsApproval,
    template:       renderTemplateConfig,
  };
  const fn = views[view];
  if (fn) el.innerHTML = fn(data);
  else el.innerHTML = `<div style="padding:40px;color:var(--slate-400)">Coming soon.</div>`;
}

function clearChat() {
  const msgs = document.getElementById('chatMessages');
  if (msgs) msgs.innerHTML = '';
  chatHistory = [];
}

function showSection(key) {
  if (key === 'courseOfStudy') key = 'education';
  const sectionsAfterEducation = new Set(['volunteer', 'skills', 'certifications', 'template']);
  if (sectionsAfterEducation.has(key) && !isEducationRequirementMet()) {
    addAIMsg('Your trade program education is required before continuing. Confirm the pre-filled details, add your graduation month/year, and click **Build →**.');
    key = 'education';
  }
  currentSection = key;
  renderLeftNav();
  clearChat();
  if (key === 'personal') { showCenter('personal'); setTimeout(updatePrograms, 0); sendTip('personal'); }
  else if (key === 'career') { showCenter('career'); sendTip('career'); }
  else if (key === 'work') { showCenter('work'); sendTip('work'); }
  else if (key === 'military') { showCenter('military'); sendTip('military'); }
  else if (key === 'education') {
    editingEduIndex = -1;
    syncPersonalFromForm();
    pruneEmptyEducationEntries();
    showCenter('education');
    sendTip('education');
  }
  else if (key === 'volunteer') { showCenter('volunteer'); sendTip('volunteer'); }
  else if (key === 'certifications') { showSection('skills'); }
  else if (key === 'skills') { showSkillsSection(); }
  else if (key === 'template') { showCenter('template'); sendTip('template'); }
}

    <div class="welcome-sub">I'll guide you through each section. Fill out the forms in this panel, ask me questions in the chat, and I'll generate a polished resume when you're done.</div>
    ${hasSaved ? `<div class="prefill-banner" style="margin:0 0 16px;text-align:left">📋 Saved progress found${savedName}. Continue where you left off or start over.</div>` : ''}
    <div class="welcome-actions">
      ${hasSaved ? `<button class="btn btn-primary btn-lg" onclick="continueProgress()">Continue Where I Left Off</button>` : ''}
      <button class="btn ${hasSaved ? 'btn-ghost' : 'btn-primary'} btn-lg" onclick="startFresh()">${hasSaved ? 'Start Over' : 'Start Fresh'}</button>
      <button class="btn btn-ghost btn-lg" onclick="showCenter('upload')">Upload Existing Resume</button>
    </div>
  </div>`;
}

function startFresh() {
  const hasSaved = !!(loadProgress()?.personal?.firstName || resumeData.personal?.firstName);
  if (hasSaved && !confirm('Start over? This will erase all your current progress.')) return;
  clearProgress();
  resumeData.personal={};
  resumeData.careerContext={};
  resumeData.workExperience=[];
  resumeData.militaryService=[];
  resumeData.education=[];
  resumeData.volunteer=[];
  resumeData.certifications=[];
  resumeData.skills=[];
  resumeData.references='Available upon request';
  delete resumeData._skillsFromUpload;
  delete resumeData._certsFromUpload;
  delete resumeData.courseOfStudy;
  delete resumeData.educationSkills;
  NAV_SECTIONS.forEach(s=>sectionStatus[s.key]='pending');
  delete sectionStatus.courseOfStudy;
  renderLeftNav();
  showSection('personal');
}

function continueProgress() {
  const saved = loadProgress();
  if (!saved) { startFresh(); return; }
  Object.assign(resumeData, saved);
  sanitizeResumeData(resumeData);
  if (saved.personal?.firstName)                            setStatus('personal','done');
  if (saved.careerContext?.objective)                       setStatus('career','done');
  if (saved.workExperience?.length || saved.militaryService?.length || saved.education?.length) setStatus('work','done');
  if (saved.militaryService?.length || saved.education?.length) setStatus('military','done');
  if (saved.education?.length) {
    pruneEmptyEducationEntries();
    if (isEducationRequirementMet()) setStatus('education','done');
  }
  if (saved.volunteer?.length)                              setStatus('volunteer','done');
  if (saved.skills?.length || saved.certifications?.length) {
    setStatus('skills','done');
    setStatus('certifications','done');
  }
  const name = saved.personal?.firstName ? `, ${saved.personal.firstName}` : '';
  addAIMsg(`Welcome back${name}! I've restored your progress. Use the menu on the left to pick up where you left off.`);
  if      (!saved.personal?.firstName)          showSection('personal');
  else if (!saved.careerContext?.objective)      showSection('career');
  else if (!saved.workExperience?.length && !saved.militaryService?.length && !isEducationRequirementMet()) showSection('work');
  else if (!saved.militaryService?.length && !isEducationRequirementMet()) showSection('military');
  else if (!isEducationRequirementMet())        showSection('education');
  else if (!saved.skills?.length && !saved.certifications?.length) showSection('skills');
  else                                           showSection('template');
}

async function extractResume() {
  if (!selectedResumeFile) return;
  const btn = document.getElementById('extractBtn');
  btn.disabled = true; btn.textContent = 'Extracting…';
  addAIMsg('Extracting your resume information — one moment…');
  showChatTyping();
  try {
    const ext = selectedResumeFile.name.split('.').pop().toLowerCase();
    let text = '', useDoc = false, b64 = '';
    if (ext === 'txt') text = await readAsText(selectedResumeFile);
    else if (ext === 'pdf') { b64 = await readAsBase64(selectedResumeFile); useDoc = true; }
    else if (ext === 'docx') text = await readDocx(selectedResumeFile);
    const parsed = await parseResume(text, useDoc, b64);
    hideChatTyping();
    if (parsed.personal) Object.assign(resumeData.personal, parsed.personal);
    const found = [];
    if (parsed.workExperience?.length) {
      resumeData.workExperience = parsed.workExperience;
      setStatus('work','done');
      found.push(`${parsed.workExperience.length} job${parsed.workExperience.length>1?'s':''}`);
    }
    if (parsed.militaryService?.length) {
      resumeData.militaryService = parsed.militaryService;
      setStatus('military','done');
      found.push('military service');
    }
    if (parsed.education?.length) {
      resumeData.education = parsed.education.filter(edu => !isEmptyEducationEntry(edu));
      if (isEducationRequirementMet()) {
        setStatus('education','done');
        found.push(`${resumeData.education.length} education entr${resumeData.education.length===1?'y':'ies'}`);
      }
    }
    const extractedCerts = normalizeCertificationsList(parsed.certifications);
    if (extractedCerts.length) {
      resumeData.certifications = extractedCerts;
      resumeData._certsFromUpload = true;
      setStatus('certifications','done');
      found.push('certifications');
    } else {
      resumeData.certifications = [];
      delete resumeData._certsFromUpload;
    }
    const extractedSkills = normalizeSkillsList(parsed.skills);
    if (extractedSkills.length && !looksLikeBrokenSkillList(parsed.skills)) {
      resumeData.skills = extractedSkills;
      resumeData._skillsFromUpload = true;
      found.push('skills');
    } else {
      resumeData.skills = [];
      delete resumeData._skillsFromUpload;
    }
    saveProgress();
    const p = resumeData.personal;
    const name = [p.firstName,p.lastName].filter(Boolean).join(' ');
    const summary = found.length ? `I found: **${found.join(', ')}**. Each section is pre-filled — review and confirm the details before continuing.` : `I found your contact info. Fill in the remaining sections below.`;
    addAIMsg(`Got it${name?' for '+name:''}! ${summary}`);
    showSection('personal');
  } catch(err) {
    hideChatTyping();
    addAIMsg('I had trouble reading that file. Try a different format, or start fresh.');
    btn.disabled = false; btn.textContent = 'Extract & Continue →'; btn.style.opacity = '1';
  }
}

function readAsText(f) { return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsText(f); }); }
function readAsBase64(f) { return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>{ const b64=btoa(new Uint8Array(e.target.result).reduce((d,b)=>d+String.fromCharCode(b),'')); res(b64); }; r.onerror=rej; r.readAsArrayBuffer(f); }); }
function readDocx(f) { return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=async e=>{ try{ const result=await mammoth.extractRawText({arrayBuffer:e.target.result}); res(result.value); }catch(err){rej(err);} }; r.onerror=rej; r.readAsArrayBuffer(f); }); }

async function parseResume(text, useDoc, b64) {
  const instruction = `Extract all information from this resume. Return ONLY valid JSON using this exact structure (use empty string or empty array if not found):
{"personal":{"firstName":"","lastName":"","email":"","phone":"","address":"","city":"","state":"","zip":""},"workExperience":[{"employer":"","jobTitle":"","city":"","state":"","startMonth":"","startYear":"","endMonth":"","endYear":"","current":false,"bulletLines":[]}],"militaryService":[{"branch":"","rank":"","jobTitle":"","city":"","state":"","startMonth":"","startYear":"","endMonth":"","endYear":"","current":false,"bulletLines":[]}],"education":[{"school":"","degree":"","fieldOfStudy":"","city":"","state":"","gradMonth":"","gradYear":""}],"certifications":[{"name":"","org":"","year":""}],"skills":[]}
Rules:
- startMonth/endMonth must be full month names (January, February…) or empty string
- militaryService: only include entries with actual military service. branch must be one of: United States Army, United States Navy, United States Marine Corps, United States Air Force, United States Space Force, United States Coast Guard, Army National Guard, Air National Guard, Army Reserve, Navy Reserve, Marine Corps Reserve, Air Force Reserve, Coast Guard Reserve
- education gradYear: 4-digit year string or "In Progress"
- skills: flat array of skill strings
- certifications: include any licenses, credentials, or certificates found`;
  let messages;
  if (useDoc) messages=[{role:'user',content:[{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}},{type:'text',text:instruction}]}];
  else messages=[{role:'user',content:`${instruction}\n\nResume:\n${text}`}];
  const raw = await callClaude('', messages, {maxTokens:4096});
  return JSON.parse(raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,''));
}

async function submitPersonal() {
  let personal = collectPersonalData();
  applyPersonalData(personal);
  if (!validatePersonalData(personal)) return;

  const btn = document.querySelector('button[onclick="submitPersonal()"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Checking...'; }
  try {
    const review = await reviewPersonalData(personal);
    if (review?.corrections && Object.keys(review.corrections).length) {
      personal = {...personal, ...review.corrections};
      applyPersonalData(personal);
    }
    if (!validatePersonalData(personal)) return;
    if (review?.issues?.length) {
      review.issues.forEach(issue=>setFieldError(PERSONAL_FIELD_GROUPS[issue.field], issue.message || 'Please correct this field.'));
      addAIMsg('I found a few items that need your review before we continue. Please fix the highlighted fields.');
      return;
    }

    resumeData.personal = personal;
    setStatus('personal','done');
    const p = resumeData.personal;
    addAIMsg(`Thanks ${p.firstName}! Your contact info is saved. Let's build your career profile next.`);
    showSection('career');
  } catch(e) {
    addAIMsg('I could not complete the review — please check your internet connection and try Continue again.');
  } finally {
    if (btn && currentSection === 'personal') { btn.disabled = false; btn.textContent = 'Build →'; }
  }
}

function applyPersonalData(p) {

  pairs.forEach(([id,value])=>{ const el=document.getElementById(id); if(el) el.value=value || ''; });
}

function validatePersonalData(p) {
  const checks = [
    {id:'fn',fg:'fg-fn',value:p.firstName,test:v=>/^[A-Za-z][A-Za-z' -]{1,39}$/.test(v),msg:'Enter a real first name.'},
    {id:'ln',fg:'fg-ln',value:p.lastName,test:v=>/^[A-Za-z][A-Za-z' -]{1,49}$/.test(v),msg:'Enter a real last name.'},
    {id:'em',fg:'fg-em',value:p.email,test:isProfessionalEmail,msg:'Use a valid, professional email.'},
    {id:'ph',fg:'fg-ph',value:p.phone,test:v=>v.replace(/\D/g,'').length===10,msg:'Enter a 10-digit phone number.'},
    {id:'addr',fg:'fg-addr',value:p.address,test:isPlausibleStreetAddress,msg:'Enter a complete street address.'},
    {id:'pcity',fg:'fg-city',value:p.city,test:v=>/^[A-Za-z][A-Za-z' .-]{1,49}$/.test(v),msg:'Enter a valid city.'},
    {id:'pstate',fg:'fg-state',value:p.state,test:v=>US_STATES.has(v),msg:'Use a valid 2-letter state.'},
    {id:'pzip',fg:'fg-zip',value:p.zip,test:v=>/^\d{5}$/.test(v),msg:'Enter a 5-digit ZIP code.'},
    {id:'campusSel',fg:'fg-campus',value:p.campus,test:v=>v!=='' && Boolean(CAMPUSES[v]),msg:'Select a campus.'},
    {id:'progSel',fg:'fg-prog',value:p.program,test:v=>v!=='' && p.campus && CAMPUSES[p.campus]?.includes(v),msg:'Select a program.'},
  ];
  let valid = true;
  checks.forEach(({id,fg,value,test,msg})=>{ const el=document.getElementById(id); if(el)el.value=value; if(!test(value)){setFieldError(fg,msg);valid=false;}else{clearFieldError(fg);} });
  return valid;
}

async function reviewPersonalData(personal) {
  const sys = `You review resume contact information for data quality. Fix clear spelling and capitalization mistakes, but do not invent missing personal data. Return ONLY JSON with this exact shape:
{"corrections":{"email":"","phone":"","address":"","city":"","state":"","zip":""},"issues":[{"field":"address","message":"Short user-facing instruction"}]}
Rules:
- Omit fields from corrections when no change is needed.
- Do NOT include firstName or lastName in corrections — names are handled separately and must not be changed.
- Correct obvious capitalization in city and street address.
- Correct obvious street suffix words such as "stret" to "Street", "avenu" to "Avenue", and unit capitalization such as "apt" to "Apt".
- Do not invent apartment numbers, street numbers, ZIP codes, or phone numbers.
- If an email is unprofessional, suspicious, or not employer-ready, add an issue for "email".
- If an address is incomplete or clearly malformed, add an issue. Do not flag a plausible complete street address just because you cannot verify it.
- If city, state, or ZIP seems misspelled, incomplete, or mismatched, add an issue instead of guessing.
- Field must be one of: email,phone,address,city,state,zip.`;
  const raw = await callClaude(sys,[{role:'user',content:JSON.stringify(personal)}]);
  let review = JSON.parse(raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,''));
  const allowed = new Set(Object.keys(PERSONAL_FIELD_GROUPS));
  const corrections = {};
  Object.entries(review.corrections || {}).forEach(([field,value])=>{
    if (allowed.has(field) && value != null && String(value).trim()) {
      const cleaned = cleanReviewedPersonalValue(field, String(value));
      if (cleaned) corrections[field] = cleaned;
    }
  });
  const reviewedAddress = corrections.address || personal.address;
  const issues = (review.issues || []).filter(issue=>{
    if (!allowed.has(issue.field) || !issue.message) return false;
    if (issue.field === 'address' && isPlausibleStreetAddress(reviewedAddress)) return false;
    return true;
  });
  return {corrections, issues};
}

function cleanReviewedPersonalValue(field, value) {
  if (field === 'firstName' || field === 'lastName') return cleanPersonName(value);
  if (field === 'city') return cleanPlaceName(value);
  if (field === 'address') return cleanAddress(value);
  if (field === 'state') return value.trim().toUpperCase();
  if (field === 'zip') return value.replace(/\D/g,'').slice(0,5);
  if (field === 'email') return value.trim().toLowerCase();
  if (field === 'phone') {
    const d = value.replace(/\D/g,'').slice(0,10);
    if (d.length === 10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
  }
  return value.trim().replace(/\s+/g,' ');
}

function fmtPhone(el) {
  let d = el.value.replace(/\D/g,'').slice(0,10);
  if (d.length>=6) d=`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
  else if (d.length>=3) d=`(${d.slice(0,3)}) ${d.slice(3)}`;
  el.value = d;
}

// ── Career Profile ────────────────────────────────
const PERSONAL_FIELD_GROUPS = {firstName:'fg-fn',lastName:'fg-ln',email:'fg-em',phone:'fg-ph',address:'fg-addr',city:'fg-city',state:'fg-state',zip:'fg-zip',campus:'fg-campus',program:'fg-prog'};
const US_STATES = new Set(['AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY','DC']);
const UNPRO_EMAIL_WORDS = ['420','69','666','adult','babe','beer','blaze','booze','booty','bossbabe','crazy','drunk','gangsta','gamer','hot','killa','killer','lazy','lit','party','playa','pothead','princess','sexy','smoke','stoner','thug','weed','xxx'];
const STREET_WORDS = {st:'Street','st.':'Street',street:'Street',stret:'Street',strret:'Street',ave:'Avenue','ave.':'Avenue',av:'Avenue',avenue:'Avenue',avenu:'Avenue',rd:'Road','rd.':'Road',road:'Road',dr:'Drive','dr.':'Drive',drive:'Drive',drv:'Drive',ln:'Lane','ln.':'Lane',lane:'Lane',blvd:'Boulevard','blvd.':'Boulevard',boulevard:'Boulevard',ct:'Court','ct.':'Court',court:'Court',cir:'Circle','cir.':'Circle',circle:'Circle',pl:'Place','pl.':'Place',place:'Place',pkwy:'Parkway','pkwy.':'Parkway',parkway:'Parkway',hwy:'Highway','hwy.':'Highway',highway:'Highway',terrace:'Terrace',ter:'Terrace','ter.':'Terrace'};
const UNIT_WORDS = {apt:'Apt','apt.':'Apt',apartment:'Apt',unit:'Unit',suite:'Suite',ste:'Suite','ste.':'Suite',floor:'Floor',fl:'Floor','fl.':'Floor'};

function setFieldError(fg, msg) {
  const grp = document.getElementById(fg);
  if (!grp) return;
  const err = grp.querySelector('.f-err');
  if (err) err.textContent = msg;
  grp.classList.add('has-error');
}

function clearFieldError(fg) {
  const grp = document.getElementById(fg);
  if (grp) grp.classList.remove('has-error');
}

function cleanPersonName(value) {
  return value.trim().replace(/\s+/g,' ').split(/([ '-])/).map(part=>{
    if (/^[A-Za-z]/.test(part)) return smartCapWord(part);
    return part;
  }).join('');
}

function cleanPlaceName(value) {
  return value.trim().replace(/\s+/g,' ').split(/([ .'-])/).map(part=>{
    if (/^[A-Za-z]/.test(part)) return smartCapWord(part);
    return part;
  }).join('');
}

function cleanAddress(value) {
  return value.trim().replace(/\s+/g,' ').split(' ').map((part,i,arr)=>{
    const lower = part.toLowerCase();
    const clean = lower.replace(/[.,]$/,'');
    const suffix = part.slice(clean.length);
    if (STREET_WORDS[lower]) return STREET_WORDS[lower];
    if (STREET_WORDS[clean]) return STREET_WORDS[clean] + suffix;
    if (UNIT_WORDS[lower]) return UNIT_WORDS[lower];
    if (UNIT_WORDS[clean]) return UNIT_WORDS[clean] + suffix;
    if (i > 0 && UNIT_WORDS[arr[i-1].toLowerCase().replace(/[.,]$/,'')]) return part.toUpperCase();
    if (/^\d+[a-z]$/i.test(part)) return part.toUpperCase();
    return part.split(/([-'/.])/).map(tok=>/^[A-Za-z]/.test(tok)?smartCapWord(tok):tok).join('');
  }).join(' ');
}

function isPlausibleStreetAddress(value) {
  const trimmed = value.trim();
  if (!trimmed) return false;
  const parts = trimmed.replace(/\s+/g,' ').split(' ');
  if (parts.length < 2) return false;
  if (!/^\d+[A-Za-z]?$/.test(parts[0])) return false;
  const words = parts.slice(1).filter(part=>/[A-Za-z]/.test(part));
  if (words.length < 1) return false;
  return /^[A-Za-z0-9' .#/-]+$/.test(trimmed);
}

function smartCapWord(word) {
  const lower = word.toLowerCase();
  if (/^mc[a-z]{2,}/.test(lower)) return 'Mc' + lower.charAt(2).toUpperCase() + lower.slice(3);
  if (/^mac[a-z]{2,}/.test(lower)) return 'Mac' + lower.charAt(3).toUpperCase() + lower.slice(4);
  return lower.charAt(0).toUpperCase() + lower.slice(1);
}

function isProfessionalEmail(email) {
  if (!/^[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}$/i.test(email)) return false;
  const local = email.split('@')[0].toLowerCase();
  if (local.length < 3 || local.length > 40) return false;
  if (/(.)\1{3,}/.test(local) || /[._%+-]{2,}/.test(local)) return false;
  if (!/[a-z]/.test(local)) return false;
  const words = local.split(/[^a-z0-9]+/).filter(Boolean);
  if (words.some(w=>UNPRO_EMAIL_WORDS.includes(w))) return false;
  return !UNPRO_EMAIL_WORDS.some(w=>local.includes(w) && (w.length > 3 || /^\d+$/.test(w)));
}

function fmtState(el) {
  el.value = el.value.replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase();
}

function fmtZip(el) {
  el.value = el.value.replace(/\D/g,'').slice(0,5);
}

async function submitCareer() {
  let career = collectCareerData();
  applyCareerData(career);
  if (!validateCareerData(career)) return;

  const btn = document.querySelector('button[onclick="submitCareer()"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Checking...'; }
  try {
    const review = await reviewCareerData(career);
    if (review?.corrections && Object.keys(review.corrections).length) {
      career = {...career, ...review.corrections, qualities:career.qualities};
      applyCareerData(career);
    }
    if (!validateCareerData(career)) return;
    if (review?.issues?.length) {
      review.issues.forEach(issue=>setFieldError(CAREER_FIELD_GROUPS[issue.field], issue.message || 'Please revise this field.'));
      addAIMsg('I found a few career profile items that need your review. Please fix the highlighted fields, then continue.');
      return;
    }
    resumeData.careerContext = career;
    generateObjective();
  } catch(e) {
    addAIMsg('I could not complete the career profile spelling and professionalism review. Please check your internet connection and try Continue again.');
  } finally {
    if (btn && currentSection === 'career') { btn.disabled = false; btn.textContent = 'Build →'; }
  }
}

function collectCareerData() {
  return {
    workSearch:cleanCareerText(document.getElementById('workSearch').value),

  };
}

function applyCareerData(c) {
  const ws = document.getElementById('workSearch');

}

function validateCareerData(c) {
  let valid = true;
  if (!isProfessionalCareerText(c.workSearch, 18)) { setFieldError('fg-ws','Describe the job you want in a complete, professional sentence.'); valid=false; } else clearFieldError('fg-ws');
  if (!c.qualities.length) { setFieldError('fg-quals','Select at least one quality.'); valid=false; } else clearFieldError('fg-quals');
  if (c.standout && !isProfessionalCareerText(c.standout, 12)) { setFieldError('fg-standout','Use a complete, professional sentence or leave this blank.'); valid=false; } else clearFieldError('fg-standout');
  return valid;
}

async function reviewCareerData(career) {
  const sys = `You review a trade-school resume career profile. Fix spelling, capitalization, punctuation, grammar, and professional wording when the correction is clear. Return ONLY JSON:
{"corrections":{"workSearch":"","standout":""},"issues":[{"field":"workSearch","message":"Short user-facing instruction"}]}
Rules:
- Omit unchanged correction fields.
- Keep the student's meaning. Do not invent certifications, experience, employers, or skills.
- Make workSearch and standout professional, concise, and resume-ready.
- If workSearch is too vague, slang, unprofessional, not a job goal, or cannot be fixed confidently, add an issue.
- If standout is present but too vague, slang, unprofessional, or cannot be fixed confidently, add an issue.
- field must be "workSearch" or "standout".`;
  const raw = await callClaude(sys,[{role:'user',content:JSON.stringify(career)}]);
  const parsed = JSON.parse(raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,''));
  const corrections = {};
  if (parsed.corrections?.workSearch) corrections.workSearch = cleanCareerText(parsed.corrections.workSearch);
  if (parsed.corrections?.standout) corrections.standout = cleanCareerText(parsed.corrections.standout);
  const issues = (parsed.issues || []).filter(issue=>CAREER_FIELD_GROUPS[issue.field] && issue.message);
  return {corrections, issues};
}

function cleanCareerText(value) {
  const cleaned = value.trim().replace(/\s+/g,' ').replace(/\s+([,.!?;:])/g,'$1').replace(/([.!?])([A-Za-z])/g,'$1 $2').replace(/(^|[.!?]\s+)([a-z])/g,(m,p,c)=>p+c.toUpperCase());
  return cleaned && !/[.!?]$/.test(cleaned) ? `${cleaned}.` : cleaned;
}

function isProfessionalCareerText(value, minLen) {
  if (!value || value.length < minLen) return false;
  if (!/[.!?]$/.test(value)) return false;
  if (/\b(idk|dunno|whatever|stuff|things|kinda|gonna|wanna|lol|money|cash)\b/i.test(value)) return false;
  return /[A-Za-z]{3,}/.test(value);
}

const WORK_FIELD_GROUPS = {employer:'fg-emp',jobTitle:'fg-jt',city:'fg-wcity',state:'fg-wstate',startDate:'fg-sd',endDate:'fg-ed',duties:'fg-duties'};

function cleanEmployerName(value) {
  return value.trim().replace(/\s+/g,' ').split(/([ '&.,/-])/).map(part=>{
    if (/^[A-Za-z]/.test(part)) {
      const upper = part.toUpperCase();
      if (['LLC','INC','LTD','LP','USA','UPS','KFC','CVS'].includes(upper)) return upper;
      return smartCapWord(part);
    }
    return part;
  }).join('').replace(/\bMcdonald'?s\b/i,"McDonald's").replace(/\bWalmart\b/i,'Walmart');
}

function cleanJobTitle(value) {
  return value.trim().replace(/\s+/g,' ').split(/([ /&-])/).map(part=>{
    if (/^[A-Za-z]/.test(part)) {
      const upper = part.toUpperCase();
      if (['HVAC','CNC','CDL','OSHA','EPA','IT','HR','AI','AC','DC','CAD','CAM','EMS','PLC'].includes(upper)) return upper;
      return smartCapWord(part);
    }
    return part;
  }).join('');
}

function isProfessionalOrgName(value) {
  if (!value || value.length < 2 || value.length > 80) return false;
  if (!/[A-Za-z]{2,}/.test(value)) return false;
  return !/\b(fake|none|n\/a|na|idk|unknown|whatever|stuff)\b/i.test(value);
}

function isProfessionalJobTitle(value) {
  if (!value || value.length < 2 || value.length > 70) return false;
  if (!/[A-Za-z]{2,}/.test(value)) return false;
  return !/\b(fake|none|n\/a|na|idk|unknown|whatever|stuff)\b/i.test(value);
}

function isReasonableYear(value) {
  const year = Number(value);
  const nextYear = new Date().getFullYear() + 1;
  return /^\d{4}$/.test(value) && year >= 1950 && year <= nextYear;
}

function compareWorkDates(monthA, yearA, monthB, yearB) {
  return (Number(yearA) * 12 + MONTHS.indexOf(monthA)) - (Number(yearB) * 12 + MONTHS.indexOf(monthB));
}

function isProfessionalDuties(value) {
  const words = value.split(/\s+/).filter(Boolean);
  if (!value || value.length < 3 || !/[A-Za-z]{2,}/.test(value)) return false;
  if (/^(idk|dunno|whatever|none|n\/a|na)$/i.test(value.trim())) return false;
  return words.length >= 1;
}

function monthIndex(month) {
  const idx = MONTHS.indexOf(month);
  return idx >= 0 ? idx : -1;
}

function workSortValue(job) {
  if (job.current) return 999999;
  const year = Number(job.endYear || job.startYear) || 0;
  const month = monthIndex(job.endMonth || job.startMonth);
  return year * 12 + month;
}

function eduSortValue(edu) {
  if (edu.gradYear === 'In Progress') return 999999;
  const year = Number(edu.gradYear) || 0;
  return year * 12 + monthIndex(edu.gradMonth);
}

function sortedWorkExperience() {
  return resumeData.workExperience.map((job,index)=>({job,index})).sort((a,b)=>workSortValue(b.job)-workSortValue(a.job));
}

function sortedEducation() {
  return resumeData.education.map((edu,index)=>({edu,index})).sort((a,b)=>eduSortValue(b.edu)-eduSortValue(a.edu));
}

async function submitWork() {
  let work = collectWorkData();
  applyWorkData(work);
  if (!validateWorkData(work)) return;

  const btn = document.querySelector('button[onclick="submitWork()"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Checking...'; }
  try {
    const review = await reviewWorkData(work);
    if (review?.corrections && Object.keys(review.corrections).length) {
      work = {...work, ...review.corrections, current:work.current};
      applyWorkData(work);
    }
    if (!validateWorkData(work)) return;
    if (review?.issues?.length) {
      review.issues.forEach(issue=>setFieldError(WORK_FIELD_GROUPS[issue.field], issue.message || 'Please revise this field.'));
      addAIMsg('I found a few work experience items that need your review. Please fix the highlighted fields, then generate bullets again.');
      return;
    }
  } catch(e) {
    addAIMsg('I could not complete the work experience spelling and professionalism review. Please check your connection or API key, then try again.');
    return;
  } finally {
    if (btn && currentSection === 'work') { btn.disabled = false; btn.textContent = 'Build →'; }
  }

  pendingWork = work;
  const ci = document.getElementById('centerInner');
  ci.innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--slate-500)"><div style="font-size:32px;margin-bottom:12px">⚙️</div>Generating bullet points…</div>`;
  const prog = resumeData.personal.program || '';
  const tense = work.current ? 'present tense' : 'past tense';
  const sys = `Write resume bullet points for a trade school student studying ${prog}. Job: ${pendingWork.jobTitle} at ${pendingWork.employer}. Duties/notes may be weak or incomplete: "${pendingWork.duties}". Use the job title, employer, and program to infer realistic entry-level responsibilities without inventing specific certifications, metrics, or tools not implied by the role. Write 3–5 bullets, ${tense}, each starting with a strong action verb. Each line starts with •. Return only the bullet points.`;
  try {
    const result = await callClaude(sys,[{role:'user',content:'Write the bullet points.'}]);
    pendingWork.bulletLines = result.trim().split('\n').map(l=>l.trim().replace(/^[•\-\*]\s*/,'')).filter(l=>l.length>0).map(l=>cleanCareerText(l));
    showCenter('workApproval');
  } catch(e) { addAIMsg('Could not connect — please try again.'); showSection('work'); }
}

function collectWorkData() {
  const cur = document.getElementById('curJob').checked;
  return {
    employer:cleanEmployerName(document.getElementById('empName').value),
    jobTitle:cleanJobTitle(document.getElementById('jobTitle').value),
    city:cleanPlaceName(document.getElementById('wCity').value),
    state:document.getElementById('wState').value.trim().toUpperCase(),

    startYear:document.getElementById('startYr').value.trim(),

    endYear:cur?'Present':document.getElementById('endYr').value.trim(),
    current:cur,
    duties:cleanCareerText(document.getElementById('duties').value),
  };
}

function applyWorkData(w) {
  const pairs = [['empName',w.employer],['jobTitle',w.jobTitle],['wCity',w.city],['wState',w.state],['startMo',w.startMonth],['startYr',w.startYear],['endMo',w.endMonth],['endYr',w.current?'':w.endYear],['duties',w.duties]];
  pairs.forEach(([id,value])=>{ const el=document.getElementById(id); if(el) el.value=value || ''; });
}

function validateWorkData(w) {
  let valid = true;
  if (!isProfessionalOrgName(w.employer)) { setFieldError('fg-emp','Enter the real employer or company name.'); valid=false; } else clearFieldError('fg-emp');
  if (!isProfessionalJobTitle(w.jobTitle)) { setFieldError('fg-jt','Enter a professional job title.'); valid=false; } else clearFieldError('fg-jt');
  if (w.city && !/^[A-Za-z][A-Za-z' .-]{1,49}$/.test(w.city)) { setFieldError('fg-wcity','Enter a valid city or leave blank.'); valid=false; } else clearFieldError('fg-wcity');
  if (w.state && !US_STATES.has(w.state)) { setFieldError('fg-wstate','Use a valid 2-letter state or leave blank.'); valid=false; } else clearFieldError('fg-wstate');
  if (!w.startMonth || !isReasonableYear(w.startYear)) { setFieldError('fg-sd','Enter a valid start month and year.'); valid=false; } else clearFieldError('fg-sd');
  if (!w.current && (!w.endMonth || !isReasonableYear(w.endYear) || compareWorkDates(w.endMonth,w.endYear,w.startMonth,w.startYear) < 0)) { setFieldError('fg-ed','Enter an end date after the start date, or mark current.'); valid=false; } else clearFieldError('fg-ed');
  if (!isProfessionalDuties(w.duties)) { setFieldError('fg-duties','Enter at least one duty, task, tool, or responsibility.'); valid=false; } else clearFieldError('fg-duties');
  return valid;
}

async function reviewWorkData(work) {
  const sys = `You review a resume work experience entry. Fix clear spelling, capitalization, punctuation, grammar, and professional wording. Return ONLY JSON:
{"corrections":{"employer":"","jobTitle":"","city":"","state":"","duties":""},"issues":[{"field":"employer","message":"Short user-facing instruction"}]}
Rules:
- Omit unchanged correction fields.
- Keep the student's meaning. Do not invent employers, job titles, locations, tools, certifications, or responsibilities.
- Correct employer capitalization only when obvious, such as "mcdonalds" to "McDonald's".
- Make jobTitle and duties professional and resume-ready. Duties may be weak, rough notes, or very short phrases; use the job title and employer to infer likely resume-safe wording when reasonable.
- If duties are weak but not empty, do not add an issue. Polish them and let bullet generation expand them.
- If employer/jobTitle/duties are fake, empty, inappropriate, or impossible to understand at all, add an issue.
- field must be one of: employer,jobTitle,city,state,duties.`;
  const raw = await callClaude(sys,[{role:'user',content:JSON.stringify(work)}]);
  const parsed = JSON.parse(raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,''));
  const corrections = {};
  if (parsed.corrections?.employer) corrections.employer = cleanEmployerName(parsed.corrections.employer);
  if (parsed.corrections?.jobTitle) corrections.jobTitle = cleanJobTitle(parsed.corrections.jobTitle);
  if (parsed.corrections?.city) corrections.city = cleanPlaceName(parsed.corrections.city);
  if (parsed.corrections?.state) corrections.state = parsed.corrections.state.trim().toUpperCase();
  if (parsed.corrections?.duties) corrections.duties = cleanCareerText(parsed.corrections.duties);
  const issues = (parsed.issues || []).filter(issue=>WORK_FIELD_GROUPS[issue.field] && issue.message);
  return {corrections, issues};
}

function programDegree(program) {
  return PROGRAM_DEGREE_MAP[program] || 'Diploma';
}

function campusLoc(campus) {
  if (campus.includes('New Castle'))     return {city:'New Castle',state:'PA'};
  if (campus.includes('East Liverpool')) return {city:'East Liverpool',state:'OH'};
  if (campus.includes('Pulaski'))        return {city:'Pulaski',state:'PA'};
  if (campus.includes('Baltimore'))      return {city:'Baltimore',state:'MD'};
  return {city:'',state:''};
}

function campusSchoolName(campus) {
  if (campus.includes('Baltimore')) return 'North American Trade Schools';
  return 'New Castle School of Trades';
}

function syncPersonalFromForm() {
  const campusEl = document.getElementById('campusSel');
  const progEl = document.getElementById('progSel');
  if (!campusEl && !progEl) return;
  if (campusEl?.value) resumeData.personal.campus = campusEl.value;
  if (progEl?.value) resumeData.personal.program = progEl.value;
}

function isEmptyEducationEntry(edu) {
  if (!edu || typeof edu !== 'object') return true;
  return !['school','degree','fieldOfStudy','city','state','gradMonth','gradYear'].some(field => String(edu[field] || '').trim());
}

function pruneEmptyEducationEntries() {
  resumeData.education = (resumeData.education || []).filter(edu => !isEmptyEducationEntry(edu));
}

function buildProgramEducationEntry() {
  const p = resumeData.personal || {};
  const campus = p.campus || '';
  const program = p.program || '';
  if (!program) return null;
  const loc = campusLoc(campus);
  return {
    school: campus ? campusSchoolName(campus) : '',
    degree: programDegree(program),
    fieldOfStudy: program,
    city: loc.city,
    state: loc.state,
    gradMonth: '',
    gradYear: '',
    isPrefilled: true,
  };
}

function hasProgramEducationEntry() {
  return (resumeData.education || []).some(edu => isProgramEducationEntry(edu));
}

function isProgramEducationEntry(edu) {
  const built = buildProgramEducationEntry();
  if (!built || isEmptyEducationEntry(edu)) return false;
  const program = built.fieldOfStudy.toLowerCase();
  const school = built.school.toLowerCase();
  const field = String(edu.fieldOfStudy || '').trim().toLowerCase();
  const eduSchool = String(edu.school || '').trim().toLowerCase();
  return field === program && (!school || !eduSchool || eduSchool === school);
}

function requiresProgramEducationEntry() {
  return Boolean((resumeData.personal || {}).program);
}

function isEducationRequirementMet() {
  pruneEmptyEducationEntries();
  if (requiresProgramEducationEntry()) return hasProgramEducationEntry();
  return (resumeData.education || []).length > 0;
}

function resolveEducationFormPrefill(prefill) {
  if (editingEduIndex >= 0 && prefill) return prefill;
  if (prefill && !isEmptyEducationEntry(prefill)) return prefill;
  const built = buildProgramEducationEntry();
  if (built && !hasProgramEducationEntry()) return built;
  return prefill || {};
}

async function submitEdu() {
  let edu = collectEduData();
  applyEduData(edu);
  if (!validateEduData(edu)) return;

  const btn = document.querySelector('button[onclick="submitEdu()"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Checking...'; }
  try {
    const review = await reviewEduData(edu);
    if (review?.corrections && Object.keys(review.corrections).length) {
      edu = {...edu, ...review.corrections};
      applyEduData(edu);
    }
    if (!validateEduData(edu)) return;
    if (review?.issues?.length) {
      review.issues.forEach(issue=>setFieldError(EDU_FIELD_GROUPS[issue.field], issue.message || 'Please revise this field.'));
      addAIMsg('I found a few education items that need your review. Please fix the highlighted fields, then continue.');
      return;
    }
    pendingEdu = edu;
    showCenter('eduApproval');
  } catch(e) {
    addAIMsg('I could not complete the education spelling and professionalism review. Please check your connection or API key, then try again.');
  } finally {
    if (btn && currentSection === 'education') { btn.disabled = false; btn.textContent = 'Build →'; }
  }
}

const EDU_FIELD_GROUPS = {school:'fg-sch',degree:'fg-deg',fieldOfStudy:'fg-field',city:'fg-ecity',state:'fg-estate',gradMonth:'fg-gm',gradYear:'fg-gy'};

function collectEduData() {
  const inProgress = document.getElementById('inProg').checked;
  return {
    school:cleanSchoolName(document.getElementById('schoolName').value),
    degree:document.getElementById('degType').value,
    fieldOfStudy:cleanProgramName(document.getElementById('fieldStudy').value),
    city:cleanPlaceName(document.getElementById('eduCity').value),
    state:document.getElementById('eduState').value.trim().toUpperCase(),
    gradMonth:inProgress?'':document.getElementById('gradMonth').value,
    gradYear:inProgress?'In Progress':document.getElementById('gradYear').value.trim(),
  };
}

function applyEduData(e) {
  const pairs = [['schoolName',e.school],['degType',e.degree],['fieldStudy',e.fieldOfStudy],['eduCity',e.city],['eduState',e.state],['gradMonth',e.gradMonth],['gradYear',e.gradYear==='In Progress'?'':e.gradYear]];
  pairs.forEach(([id,value])=>{ const el=document.getElementById(id); if(el) el.value=value || ''; });
  const inProg = document.getElementById('inProg');
  if (inProg) {
    inProg.checked = e.gradYear === 'In Progress';
    toggleInProg(inProg);
  }
}

function validateEduData(e) {
  let valid = true;
  if (!isProfessionalSchoolName(e.school)) { setFieldError('fg-sch','Enter a real school or institution name.'); valid=false; } else clearFieldError('fg-sch');
  if (!e.degree) { setFieldError('fg-deg','Select a degree or diploma.'); valid=false; } else clearFieldError('fg-deg');
  if (e.fieldOfStudy && !isProfessionalProgramName(e.fieldOfStudy)) { setFieldError('fg-field','Use a professional field of study.'); valid=false; } else clearFieldError('fg-field');
  if (e.city && !/^[A-Za-z][A-Za-z' .-]{1,49}$/.test(e.city)) { setFieldError('fg-ecity','Enter a valid city or leave blank.'); valid=false; } else clearFieldError('fg-ecity');
  if (e.state && !US_STATES.has(e.state)) { setFieldError('fg-estate','Use a valid 2-letter state or leave blank.'); valid=false; } else clearFieldError('fg-estate');
  if (e.gradYear !== 'In Progress' && !e.gradMonth) { setFieldError('fg-gm','Select a graduation month.'); valid=false; } else clearFieldError('fg-gm');
  if (e.gradYear !== 'In Progress' && !isReasonableYear(e.gradYear)) { setFieldError('fg-gy','Enter a valid graduation year.'); valid=false; } else clearFieldError('fg-gy');
  return valid;
}

async function reviewEduData(edu) {
  const sys = `You review a resume education entry. Fix clear spelling, capitalization, punctuation, and professional wording. Return ONLY JSON:
{"corrections":{"school":"","degree":"","fieldOfStudy":"","city":"","state":"","gradMonth":"","gradYear":""},"issues":[{"field":"school","message":"Short user-facing instruction"}]}
Rules:
- Omit unchanged correction fields.
- Keep the student's meaning. Do not invent schools, degrees, programs, dates, or locations.
- Correct obvious school/program capitalization and spelling.
- Do not change degree unless it clearly maps to the selected meaning.
- City, state, and fieldOfStudy are optional; do not add an issue when those are blank.
- If gradYear is "In Progress", do not require gradMonth.
- If school, fieldOfStudy, city, state, gradMonth, or gradYear is fake, vague, inappropriate, incomplete, or cannot be fixed confidently, add an issue.
- field must be one of: school,degree,fieldOfStudy,city,state,gradMonth,gradYear.`;
  const raw = await callClaude(sys,[{role:'user',content:JSON.stringify(edu)}]);
  const parsed = JSON.parse(raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,''));
  const corrections = {};
  if (parsed.corrections?.school) corrections.school = cleanSchoolName(parsed.corrections.school);
  if (parsed.corrections?.degree) corrections.degree = parsed.corrections.degree.trim();
  if (parsed.corrections?.fieldOfStudy) corrections.fieldOfStudy = cleanProgramName(parsed.corrections.fieldOfStudy);
  if (parsed.corrections?.city) corrections.city = cleanPlaceName(parsed.corrections.city);
  if (parsed.corrections?.state) corrections.state = parsed.corrections.state.trim().toUpperCase();
  if (parsed.corrections?.gradMonth) {
    const month = normalizeMonth(parsed.corrections.gradMonth);
    if (month) corrections.gradMonth = month;
  }
  if (parsed.corrections?.gradYear) corrections.gradYear = parsed.corrections.gradYear.trim();
  const reviewed = {...edu, ...corrections};
  const issues = (parsed.issues || []).filter(issue=>{
    if (!EDU_FIELD_GROUPS[issue.field] || !issue.message) return false;
    if (['city','state','fieldOfStudy'].includes(issue.field) && !reviewed[issue.field]) return false;
    if (reviewed.gradYear === 'In Progress' && ['gradMonth','gradYear'].includes(issue.field)) return false;
    return true;
  });
  return {corrections, issues};
}

function cleanSchoolName(value) {
  const INSTITUTION_LOWER_WORDS = new Set(['a','an','and','at','for','in','of','or','the','to','with']);
  const INSTITUTION_UPPER_WORDS = { ctc:'CTC', cdl:'CDL', hvac:'HVAC', cnc:'CNC', ged:'GED', nats:'NATS' };
  let wordIndex = 0;
  return value.trim().replace(/\s+/g,' ').split(/([ '&.,/-])/).map(part => {
    if (!/^[A-Za-z]/.test(part)) return part;
    const lower = part.toLowerCase();
    const upper = INSTITUTION_UPPER_WORDS[lower];
    if (upper) { wordIndex++; return upper; }
    if (wordIndex > 0 && INSTITUTION_LOWER_WORDS.has(lower)) { wordIndex++; return lower; }
    wordIndex++;
    return smartCapWord(part);
  }).join('');
}

function cleanProgramName(value) {
  return value.trim().replace(/\s+/g,' ').split(/([ /&-])/).map(part=>{
    if (/^[A-Za-z]/.test(part)) {
      const upper = part.toUpperCase();
      if (['HVAC','CNC','CDL','GED','OSHA','EPA','CPR','AED','ASE','AWS','NIMS','NATE','DOT','MIG','TIG','PLC','NFPA','PPE','AC','DC','IT','HR','AI','CAD','CAM','CTC','EMS'].includes(upper)) return upper;
      return smartCapWord(part);
    }
    return part;
  }).join('');
}

function isProfessionalSchoolName(value) {
  if (!value || value.length < 2 || value.length > 90) return false;
  if (!/[A-Za-z]{2,}/.test(value)) return false;
  return !/\b(fake|none|n\/a|na|idk|unknown|whatever|stuff)\b/i.test(value);
}

function isProfessionalProgramName(value) {
  if (!value || value.length > 90) return false;
  if (!/[A-Za-z]{2,}/.test(value)) return false;
  return !/\b(fake|none|n\/a|na|idk|unknown|whatever|stuff)\b/i.test(value);
}

function eduGradDate(e) {
  return e.gradYear === 'In Progress' ? 'In Progress' : [e.gradMonth, e.gradYear].filter(Boolean).join(' ');
}

function normalizeMonth(value) {
  const lower = String(value).trim().toLowerCase();
  return MONTHS.find(m=>m.toLowerCase()===lower || m.toLowerCase().slice(0,3)===lower.slice(0,3)) || '';
}

const JUNK_SKILL_PATTERN = /\b(fake|none|n\/a|na|idk|unknown|whatever|stuff|test)\b/i;
const JUNK_SKILL_PREFIX = /^(please|for best|note:|provide|share|raw |to org)/i;

function isValidSkillEntry(value) {
  const text = String(value || '').trim();
  if (text.length < 2 || text.length > 80) return false;
  if (!/[A-Za-z]{2,}/.test(text)) return false;
  if (JUNK_SKILL_PATTERN.test(text) || JUNK_SKILL_PREFIX.test(text) || /\*\*/.test(text)) return false;
  return true;
}

function looksLikeBrokenSkillList(input) {
  const items = (Array.isArray(input) ? input : normalizeSkillsList(input)).map(s => String(s).trim()).filter(Boolean);
  if (!items.length) return false;
  const singleCharCount = items.filter(s => s.length === 1).length;
  return singleCharCount / items.length > 0.5;
}

function normalizeSkillsList(input) {
  if (!input) return [];
  let items = [];
  if (typeof input === 'string') {
    items = input.split(/[,;\n]+/).map(s => s.trim()).filter(Boolean);
  } else if (Array.isArray(input)) {
    items = input.flatMap(item => {
      const text = String(item ?? '').trim();
      if (!text) return [];
      if (text.includes(',') || text.includes(';')) {
        return text.split(/[,;]+/).map(s => s.trim()).filter(Boolean);
      }
      return [text];
    });
  }
  return [...new Set(items.map(s => cleanProgramName(s)).filter(isValidSkillEntry))];
}

function isValidCertName(value) {
  const text = String(value || '').trim();
  if (text.length < 2 || text.length > 120) return false;
  if (!/[A-Za-z]{2,}/.test(text)) return false;
  return !/\b(fake|none|idk|whatever)\b/i.test(text);
}

function normalizeCertificationsList(input) {
  if (!input) return [];
  const out = [];
  const addCert = (name, org = '', year = '') => {
    const cleaned = cleanCertObject({ name: cleanProgramName(name), org, year });
    if (isValidCertName(cleaned.name)) out.push(cleaned);
  };
  if (typeof input === 'string') {
    input.split(/\n|;/).map(s => s.trim()).filter(Boolean).forEach(line => addCert(line));
  } else if (Array.isArray(input)) {
    input.forEach(item => {
      if (typeof item === 'string') addCert(item);
      else if (item && typeof item === 'object') addCert(item.name || item.title || '', item.org || item.issuer || '', item.year || '');
    });
  }
  const seen = new Set();
  return out.filter(cert => {
    const key = cert.name.toLowerCase();
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

const MAX_SKILL_CERT_ITEMS = 10;
const MIN_SKILL_CERT_SUGGESTION = 3;

function getInitialSkillRows() {
  const savedSkills = normalizeSkillsList(resumeData.skills);
  let items = [];
  if (sectionStatus.skills === 'done' && savedSkills.length) items = savedSkills;
  else if (resumeData._skillsFromUpload && savedSkills.length) items = savedSkills;
  else if (savedSkills.length) items = savedSkills;
  else items = [...(currentProgramDefaults?.skills || [])];
  items = items.slice(0, MAX_SKILL_CERT_ITEMS);
  while (items.length < MIN_SKILL_CERT_SUGGESTION) items.push('');
  return items;
}

function getInitialCertRows() {
  const savedCerts = normalizeCertificationsList(resumeData.certifications);
  const savedNames = savedCerts.map(c => c.name);
  let items = [];
  if (sectionStatus.skills === 'done' && savedNames.length) items = savedNames;
  else if (resumeData._certsFromUpload && savedNames.length) items = savedNames;
  else if (savedNames.length) items = savedNames;
  else items = [...(currentProgramDefaults?.certifications || [])];
  items = items.slice(0, MAX_SKILL_CERT_ITEMS);
  while (items.length < MIN_SKILL_CERT_SUGGESTION) items.push('');
  return items;
}

function renderSkillCertItemRows(type, items) {
  const inputClass = type === 'skill' ? 'skill-row-input' : 'cert-row-input';
  const placeholder = type === 'skill'
    ? 'e.g. MIG welding, blueprint reading, customer service'
    : 'e.g. OSHA 10, EPA 608, CDL Class A';
  const maxLen = type === 'skill' ? 80 : 120;
  return items.map(item => `<div class="sc-item-row"><input type="text" class="${inputClass}" value="${escHtml(item)}" placeholder="${placeholder}" maxlength="${maxLen}"><button type="button" class="ebl-btn del sc-row-del" onclick="removeSkillCertRow(this)" title="Remove">✕</button></div>`).join('');
}

function getSkillCertRowCount(type) {
  const selector = type === 'skill' ? '.skill-row-input' : '.cert-row-input';
  return document.querySelectorAll(selector).length;
}

function updateSkillCertAddButtons() {
  const skillBtn = document.getElementById('addSkillRowBtn');
  const certBtn = document.getElementById('addCertRowBtn');
  const skillCount = getSkillCertRowCount('skill');
  const certCount = getSkillCertRowCount('cert');
  if (skillBtn) {
    skillBtn.disabled = skillCount >= MAX_SKILL_CERT_ITEMS;
    skillBtn.style.opacity = skillCount >= MAX_SKILL_CERT_ITEMS ? '0.45' : '1';
  }
  if (certBtn) {
    certBtn.disabled = certCount >= MAX_SKILL_CERT_ITEMS;
    certBtn.style.opacity = certCount >= MAX_SKILL_CERT_ITEMS ? '0.45' : '1';
  }
  const skillCountEl = document.getElementById('skillRowCount');
  const certCountEl = document.getElementById('certRowCount');
  if (skillCountEl) skillCountEl.textContent = `${skillCount} / ${MAX_SKILL_CERT_ITEMS}`;
  if (certCountEl) certCountEl.textContent = `${certCount} / ${MAX_SKILL_CERT_ITEMS}`;
}

function addSkillCertRow(type) {
  const listId = type === 'skill' ? 'skillsList' : 'certsList';
  const list = document.getElementById(listId);
  if (!list || getSkillCertRowCount(type) >= MAX_SKILL_CERT_ITEMS) return;
  const inputClass = type === 'skill' ? 'skill-row-input' : 'cert-row-input';
  const placeholder = type === 'skill' ? 'Add another skill' : 'Add another certification';
  const maxLen = type === 'skill' ? 80 : 120;
  const row = document.createElement('div');
  row.className = 'sc-item-row';
  row.innerHTML = `<input type="text" class="${inputClass}" placeholder="${placeholder}" maxlength="${maxLen}"><button type="button" class="ebl-btn del sc-row-del" onclick="removeSkillCertRow(this)" title="Remove">✕</button>`;
  list.appendChild(row);
  row.querySelector('input').focus();
  updateSkillCertAddButtons();
}

function removeSkillCertRow(btn) {
  const list = btn.closest('#skillsList, #certsList');
  const row = btn.closest('.sc-item-row');
  if (row) row.remove();
  if (list && !list.querySelectorAll('input').length) {
    addSkillCertRow(list.id === 'skillsList' ? 'skill' : 'cert');
  }
  updateSkillCertAddButtons();
}

function collectSkillInputs() {
  return normalizeSkillsList(
    [...document.querySelectorAll('.skill-row-input')]
      .map(el => el.value.trim())
      .filter(Boolean)
      .slice(0, MAX_SKILL_CERT_ITEMS)
  );
}

function collectCertInputs() {
  return normalizeCertificationsList(
    [...document.querySelectorAll('.cert-row-input')]
      .map(el => el.value.trim())
      .filter(Boolean)
      .slice(0, MAX_SKILL_CERT_ITEMS)
  );
}

function suggestMinSkillCertCounts(skillCount, certCount) {
  const parts = [];
  if (skillCount < MIN_SKILL_CERT_SUGGESTION) parts.push(`skills (you have ${skillCount})`);
  if (certCount < MIN_SKILL_CERT_SUGGESTION) parts.push(`certifications (you have ${certCount})`);
  if (!parts.length) return;
  alert(`Suggestion: Resumes usually look stronger with at least ${MIN_SKILL_CERT_SUGGESTION} ${parts.join(' and ')}. Add more if you can, or continue with what you have.`);
}

function renderSkillsForm() {
  const skillRows = getInitialSkillRows();
  const certRows = getInitialCertRows();
  setTimeout(updateSkillCertAddButtons, 0);
  return `<div class="section-hdr"><div class="section-hdr-icon">⚡</div><div><div class="section-hdr-title">Skills &amp; Certifications</div><div class="section-hdr-sub">Add, edit, or remove items here — up to 10 each</div></div></div>
  <div class="two-panel-grid">
    <div class="form-card">
      <div class="form-card-hdr">⚡ Skills</div>
      <div class="form-card-body">

          <div id="skillsList">${renderSkillCertItemRows('skill', skillRows)}</div>
          <div class="sc-list-actions">
            <span id="skillRowCount">${skillRows.length} / ${MAX_SKILL_CERT_ITEMS}</span>
            <button type="button" class="btn btn-ghost" id="addSkillRowBtn" onclick="addSkillCertRow('skill')">+ Add Skill</button>
          </div>

      </div>
    </div>

      <div class="form-card-body">

          <div class="sc-list-actions">
            <span id="certRowCount">${certRows.length} / ${MAX_SKILL_CERT_ITEMS}</span>
            <button type="button" class="btn btn-ghost" id="addCertRowBtn" onclick="addSkillCertRow('cert')">+ Add Certification</button>
          </div>
          <span class="f-err">Please list real certifications or leave rows blank.</span></div></div>
      </div>
    </div>
  </div>
  <div class="form-card">
    <div class="form-card-footer">
      <button class="btn btn-primary" onclick="submitSkills()">Review →</button>
    </div>
  </div>`;
