<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Resume Builder v3</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue-900:#1e3a8a;--blue-800:#1e40af;--blue-700:#1d4ed8;--blue-100:#dbeafe;--blue-50:#eff6ff;
  --slate-900:#0f172a;--slate-700:#334155;--slate-600:#475569;--slate-500:#64748b;
  --slate-400:#94a3b8;--slate-300:#cbd5e1;--slate-200:#e2e8f0;--slate-100:#f1f5f9;--slate-50:#f8fafc;
  --green-600:#16a34a;--green-700:#15803d;--red-600:#dc2626;--white:#ffffff;
  --nav-w:180px;--chat-w:300px;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#64748b}

/* ── App Shell ── */
.app{display:flex;flex-direction:column;height:100vh;max-width:1200px;margin:0 auto;box-shadow:0 0 60px rgba(0,0,0,.3)}
.app-body{flex:1;display:flex;overflow:hidden}

/* ── Header ── */
.app-header{flex-shrink:0;height:60px;background:var(--slate-900);display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:12px}
.header-brand{display:flex;align-items:center;gap:9px;white-space:nowrap}
.header-brand span{font-size:20px}
.header-title{font-size:16px;font-weight:700;color:var(--white)}
.header-badge{font-size:10px;font-weight:700;color:var(--slate-400);background:rgba(255,255,255,.08);padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
.api-key-area{display:flex;align-items:center;gap:7px;flex-shrink:0}
.api-key-area input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:var(--white);padding:6px 13px;border-radius:20px;font-size:12px;width:200px;outline:none;font-family:inherit}
.api-key-area input::placeholder{color:var(--slate-400)}
.api-key-area input:focus{border-color:rgba(255,255,255,.4)}
.btn-activate{background:var(--blue-700);color:var(--white);border:none;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-activate:hover{background:var(--blue-800)}
.key-ready{display:none;align-items:center;gap:6px;color:#86efac;font-size:12px;font-weight:600;white-space:nowrap}
.key-dot{width:7px;height:7px;background:#4ade80;border-radius:50%;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.chat-toggle-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:var(--white);padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.chat-toggle-btn:hover{background:rgba(255,255,255,.18)}

/* ── Left Nav ── */
.left-nav{width:var(--nav-w);flex-shrink:0;background:var(--white);border-right:1px solid var(--slate-200);overflow-y:auto;display:flex;flex-direction:column;padding:16px 0}
.nav-heading{font-size:10px;font-weight:700;color:var(--slate-400);text-transform:uppercase;letter-spacing:.8px;padding:0 14px 10px}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;transition:background .15s;position:relative}
.nav-item:hover{background:var(--slate-50)}
.nav-item.active{background:var(--blue-50)}
.nav-item.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--blue-700);border-radius:0 3px 3px 0}
.nav-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.nav-item.pending .nav-icon{background:var(--slate-100);filter:grayscale(1) opacity(.5)}
.nav-item.active .nav-icon{background:var(--blue-100)}
.nav-item.done .nav-icon{background:#dcfce7}
.nav-label{font-size:12px;font-weight:600}
.nav-item.pending .nav-label{color:var(--slate-400)}
.nav-item.active .nav-label{color:var(--blue-700)}
.nav-item.done .nav-label{color:var(--slate-600)}
.nav-check{margin-left:auto;font-size:11px;color:var(--green-600);font-weight:700;display:none}
.nav-item.done .nav-check{display:block}

/* ── Center Panel ── */
.center-panel{flex:1;overflow-y:auto;background:var(--slate-100)}
.center-panel::-webkit-scrollbar{width:6px}
.center-panel::-webkit-scrollbar-track{background:var(--slate-200)}
.center-panel::-webkit-scrollbar-thumb{background:var(--slate-400);border-radius:3px}
.center-inner{max-width:660px;margin:0 auto;padding:28px 24px}

/* Section header in center */
.section-hdr{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.section-hdr-icon{width:44px;height:44px;border-radius:10px;background:var(--blue-50);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.section-hdr-title{font-size:20px;font-weight:700;color:var(--slate-900)}
.section-hdr-sub{font-size:13px;color:var(--slate-500);margin-top:2px}

/* ── Form Card ── */
.form-card{background:var(--white);border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.08);overflow:hidden;margin-bottom:16px}
.form-card-hdr{background:var(--blue-900);color:var(--white);padding:12px 18px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.form-card-body{padding:18px 18px 6px}
.form-card-footer{padding:12px 18px 14px;display:flex;justify-content:flex-end;gap:8px;background:var(--slate-50);border-top:1px solid var(--slate-100)}

/* ── Form Fields ── */
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.f-row.single{grid-template-columns:1fr}
.f-row.triple{grid-template-columns:2fr 1fr 1fr}
.f-group{display:flex;flex-direction:column;gap:4px}
.f-group label{font-size:11px;font-weight:700;color:var(--slate-500);text-transform:uppercase;letter-spacing:.6px}
.f-group input,.f-group select,.f-group textarea{border:1.5px solid var(--slate-200);border-radius:7px;padding:9px 11px;font-size:14px;color:var(--slate-900);background:var(--slate-50);outline:none;width:100%;font-family:inherit;margin:0;transition:border-color .18s,box-shadow .18s}
.f-group input:focus,.f-group select:focus,.f-group textarea:focus{border-color:var(--blue-700);box-shadow:0 0 0 3px rgba(29,78,216,.12);background:var(--white)}
.f-group textarea{resize:vertical;min-height:70px}
.f-group select:disabled{opacity:.45;cursor:not-allowed}
.f-err{font-size:11px;color:var(--red-600);display:none;margin-top:1px}
.f-group.has-error input,.f-group.has-error select,.f-group.has-error textarea{border-color:var(--red-600)}
.f-group.has-error .f-err{display:block}

/* ── Date Pair ── */
.date-pair{display:grid;grid-template-columns:1.6fr 1fr;gap:8px}
.date-pair input,.date-pair select{border:1.5px solid var(--slate-200);border-radius:7px;padding:9px 11px;font-size:14px;color:var(--slate-900);background:var(--slate-50);outline:none;width:100%;font-family:inherit;margin:0;transition:border-color .18s}
.date-pair input:focus,.date-pair select:focus{border-color:var(--blue-700);background:var(--white)}
.date-pair select:disabled,.date-pair input:disabled{opacity:.45}

/* ── Check Grid ── */
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:4px}
.check-opt{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--slate-700);cursor:pointer;padding:5px 8px;border-radius:6px;border:1.5px solid var(--slate-200);background:var(--slate-50);transition:border-color .15s;user-select:none}
.check-opt:hover{border-color:var(--blue-700);background:var(--blue-50)}
.check-opt input[type="checkbox"]{width:15px;height:15px;margin:0;flex-shrink:0;accent-color:var(--blue-700)}
.check-opt-inline{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;margin-top:6px;cursor:pointer}
.check-opt-inline input{accent-color:var(--blue-700)}

/* ── Buttons ── */
.btn{padding:9px 20px;border-radius:7px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .15s;font-family:inherit;line-height:1}
.btn-primary{background:var(--blue-900);color:var(--white)}
.btn-primary:hover{background:var(--blue-800);transform:translateY(-1px);box-shadow:0 4px 14px rgba(30,58,138,.28)}
.btn-primary:disabled{background:var(--slate-300);cursor:not-allowed;transform:none;box-shadow:none}
.btn-ghost{background:var(--white);color:var(--slate-600);border:1.5px solid var(--slate-200)}
.btn-ghost:hover{border-color:var(--slate-400);background:var(--slate-50)}
.btn-confirm{background:var(--green-600);color:var(--white)}
.btn-confirm:hover{background:var(--green-700);transform:translateY(-1px)}
.btn-lg{padding:12px 28px;font-size:15px}

/* ── Approval Card ── */
.approval-card{background:var(--white);border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.08);overflow:hidden;margin-bottom:16px}
.approval-hdr{background:var(--green-600);color:var(--white);padding:12px 18px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.approval-body{padding:6px 18px 2px}
.a-row{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--slate-100)}
.a-row:last-child{border-bottom:none}
.a-label{font-size:11px;font-weight:700;color:var(--slate-400);text-transform:uppercase;letter-spacing:.5px;min-width:80px;flex-shrink:0}
.a-value{font-size:14px;color:var(--slate-800)}
.approval-footer{padding:12px 18px 14px;display:flex;justify-content:flex-end;gap:8px;background:var(--slate-50);border-top:1px solid var(--slate-100)}

/* ── Bullet list ── */
.bullet-list{list-style:none;padding:0;margin:0}
.bullet-list li{display:flex;gap:8px;padding:5px 0;font-size:14px;color:var(--slate-800);line-height:1.5;border-bottom:1px solid var(--slate-100)}
.bullet-list li:last-child{border-bottom:none}
.bullet-list li::before{content:'•';color:var(--blue-700);font-weight:700;flex-shrink:0}

/* ── Done card ── */
.done-card{background:var(--white);border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.08);padding:28px 24px;text-align:center;margin-bottom:16px}
.done-icon{font-size:40px;display:block;margin-bottom:12px}
.done-title{font-size:18px;font-weight:700;color:var(--slate-900);margin-bottom:6px}
.done-sub{font-size:14px;color:var(--slate-500);margin-bottom:20px}
.done-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ── Welcome screen ── */
.welcome-card{background:var(--white);border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.08);padding:36px 28px;text-align:center;margin-bottom:16px}
.welcome-icon{font-size:48px;display:block;margin-bottom:16px}
.welcome-title{font-size:22px;font-weight:700;color:var(--slate-900);margin-bottom:8px}
.welcome-sub{font-size:14px;color:var(--slate-500);line-height:1.6;margin-bottom:24px}
.welcome-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ── Upload ── */
.upload-drop{border:2px dashed var(--slate-300);border-radius:8px;padding:28px 20px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;margin-bottom:12px}
.upload-drop:hover,.upload-drop.drag-over{border-color:var(--blue-700);background:var(--blue-50)}
.upload-drop .drop-icon{font-size:30px;display:block;margin-bottom:8px}
.upload-drop .drop-lbl{font-size:14px;color:var(--slate-600);font-weight:600}
.upload-drop .drop-sub{font-size:12px;color:var(--slate-400);margin-top:4px}
.upload-selected{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--blue-50);border:1.5px solid var(--blue-100);border-radius:7px;margin-bottom:12px;font-size:13px;color:var(--blue-700);font-weight:600}

/* ── Inline actions ── */
.inline-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}

/* ── Prefill banner ── */
.prefill-banner{background:var(--blue-50);border:1.5px solid var(--blue-100);border-radius:7px;padding:9px 12px;margin-bottom:12px;font-size:13px;color:var(--blue-700)}

/* ── Template Configurator ── */
.style-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:4px}
.style-btn{border:2.5px solid var(--slate-200);border-radius:8px;background:var(--white);cursor:pointer;overflow:hidden;text-align:center;transition:border-color .15s,box-shadow .15s;padding:0}
.style-btn:hover{border-color:var(--slate-400)}
.style-btn.sel{border-color:var(--blue-700);box-shadow:0 0 0 2px var(--blue-700)}
.style-preview{width:100%;aspect-ratio:8.5/11;overflow:hidden;background:white}
.style-name{font-size:11px;font-weight:600;color:var(--slate-600);padding:5px 4px;background:var(--slate-50);border-top:1px solid var(--slate-100)}
.style-btn.sel .style-name{color:var(--blue-700);background:var(--blue-50)}
.color-row{display:flex;gap:10px;flex-wrap:wrap}
.color-swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .15s,border-color .15s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.color-swatch:hover{transform:scale(1.12)}
.color-swatch.sel{border-color:var(--slate-900);transform:scale(1.15)}

/* ── Right Panel (AI Chat) ── */
.right-panel{width:var(--chat-w);flex-shrink:0;display:flex;flex-direction:column;background:var(--slate-50);border-left:1px solid var(--slate-200);transition:width .25s ease;overflow:hidden}
.right-panel.collapsed{width:46px}
.rp-header{height:48px;flex-shrink:0;background:var(--white);border-bottom:1px solid var(--slate-200);display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px}
.rp-title{font-size:13px;font-weight:700;color:var(--slate-700);white-space:nowrap;overflow:hidden}
.right-panel.collapsed .rp-title{display:none}
.rp-toggle{width:28px;height:28px;border:none;background:var(--slate-100);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;transition:background .15s}
.rp-toggle:hover{background:var(--slate-200)}
.chat-messages{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.chat-messages::-webkit-scrollbar{width:4px}
.chat-messages::-webkit-scrollbar-thumb{background:var(--slate-300);border-radius:2px}
.right-panel.collapsed .chat-messages,.right-panel.collapsed .chat-input-area{display:none}
.chat-msg{display:flex;flex-direction:column;gap:3px;animation:fadeUp .25s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.chat-msg.ai .msg-bubble{background:var(--white);color:var(--slate-900);border-radius:10px 10px 10px 3px;box-shadow:0 1px 4px rgba(0,0,0,.09)}
.chat-msg.user .msg-bubble{background:var(--blue-900);color:var(--white);border-radius:10px 10px 3px 10px;align-self:flex-end}
.msg-bubble{padding:9px 12px;font-size:13px;line-height:1.5;max-width:100%}
.msg-lbl{font-size:10px;font-weight:700;color:var(--slate-400);text-transform:uppercase;letter-spacing:.5px}
.chat-msg.user .msg-lbl{text-align:right}
.t-dots{display:flex;gap:4px;padding:4px 2px}
.t-dot{width:6px;height:6px;background:var(--slate-400);border-radius:50%;animation:bounce 1.1s ease-in-out infinite}
.t-dot:nth-child(2){animation-delay:.18s}
.t-dot:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.chat-input-area{flex-shrink:0;padding:10px 12px;background:var(--white);border-top:1px solid var(--slate-200)}
.chat-input-row{display:flex;gap:8px;align-items:flex-end}
.chat-input{flex:1;border:1.5px solid var(--slate-200);border-radius:18px;padding:8px 14px;font-size:13px;resize:none;min-height:36px;max-height:90px;outline:none;font-family:inherit;transition:border-color .18s;line-height:1.4}
.chat-input:focus{border-color:var(--blue-700)}
.chat-input:disabled{background:var(--slate-50);color:var(--slate-400)}
.chat-send{width:34px;height:34px;border-radius:50%;background:var(--blue-900);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;padding:0}
.chat-send:hover:not(:disabled){background:var(--blue-800);transform:scale(1.06)}
.chat-send:disabled{background:var(--slate-300);cursor:not-allowed}
.chat-send svg{width:15px;height:15px;fill:var(--white);margin-left:1px}

/* ── Responsive ── */
@media(max-width:900px){:root{--chat-w:260px}}
@media(max-width:700px){.right-panel{width:0!important}.left-nav{width:44px}.nav-label,.nav-check,.nav-heading{display:none}.nav-item{justify-content:center;padding:8px 0}}
@media(max-width:480px){:root{--nav-w:44px}}
</style>
</head>
<body>
<div class="app">

<!-- Header -->
<header class="app-header">
  <div class="header-brand">
    <span>✨</span>
    <span class="header-title">Resume Builder</span>
    <span class="header-badge">AI v3</span>
  </div>
  <div class="api-key-area" id="apiKeyArea">
    <input type="password" id="apiKeyInput" placeholder="Paste API key…" onkeydown="if(event.key==='Enter')activateKey()">
    <button class="btn-activate" onclick="activateKey()">Activate</button>
  </div>
  <div class="key-ready" id="keyReady"><span class="key-dot"></span>AI Connected</div>
  <button class="chat-toggle-btn" onclick="toggleChat()">💬 AI Chat</button>
</header>

<div class="app-body">

  <!-- Left Nav -->
  <nav class="left-nav" id="leftNav"></nav>

  <!-- Center Panel -->
  <main class="center-panel" id="centerPanel">
    <div class="center-inner" id="centerInner">
      <div style="display:flex;align-items:center;justify-content:center;height:60vh;color:var(--slate-400);font-size:15px">
        Enter your API key above to begin.
      </div>
    </div>
  </main>

  <!-- Right AI Chat Panel -->
  <aside class="right-panel" id="rightPanel">
    <div class="rp-header">
      <span class="rp-title">💬 AI Assistant</span>
      <button class="rp-toggle" onclick="toggleChat()" title="Collapse">◀</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <div class="chat-input-row">
        <textarea id="chatInput" class="chat-input" placeholder="Ask a question…" rows="1"
          onkeydown="handleChatKey(event)" oninput="autoResizeChat(this)" disabled></textarea>
        <button class="chat-send" id="chatSendBtn" onclick="sendChat()" disabled>
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </aside>

</div><!-- /.app-body -->
</div><!-- /.app -->

<script>
// ── API Key ──────────────────────────────────────
const HARDCODED_KEY = ''; // paste your key here — do not commit

// ── Campus Data ──────────────────────────────────
const CAMPUSES = {
  "Main Campus — New Castle, PA":["Automotive Technology","Building Technology","Combination Welding","Electrical Technology","Industrial Electro-Mechanical Technology","Refrigeration and AC Technology"],
  "East Liverpool Campus — East Liverpool, OH":["Combination Welding","Electrical and Industrial Maintenance","Refrigeration and Climate Control"],
  "Satellite Campus — Pulaski, PA":["Commercial Truck Driving CDL","Diesel and Heavy Equipment Repair Technology","Heavy Equipment Operations with CDL","Machinist and CNC Manufacturing","Motorcycle and Power Equipment Technology"],
  "North American Trade Schools — Baltimore, MD":["Building Construction Technology","Combination Welding","Electrical Technology","HVAC Technology","Diesel Technology","Commercial Truck Driving with CDL License"]
};

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// ── Color Schemes ────────────────────────────────
const COLOR_SCHEMES = {
  navy:    {label:'Navy',    hex:'#1e3a8a',accent:'1e3a8a',sideText:'FFFFFF'},
  green:   {label:'Forest',  hex:'#14532d',accent:'14532d',sideText:'FFFFFF'},
  burgundy:{label:'Burgundy',hex:'#7f1d1d',accent:'7f1d1d',sideText:'FFFFFF'},
  slate:   {label:'Slate',   hex:'#334155',accent:'334155',sideText:'FFFFFF'},
  charcoal:{label:'Charcoal',hex:'#1c1c1c',accent:'1c1c1c',sideText:'EEEEEE'},
};

// ── Sections ─────────────────────────────────────
const SECTIONS = [
  {key:'personal',      label:'Personal Info',   icon:'👤'},
  {key:'career',        label:'Career Profile',  icon:'🎯'},
  {key:'work',          label:'Work Experience', icon:'💼'},
  {key:'education',     label:'Education',       icon:'🎓'},
  {key:'certifications',label:'Certifications',  icon:'📜'},
  {key:'skills',        label:'Skills',          icon:'⚡'},
  {key:'template',      label:'Build Resume',    icon:'📄'},
];

// ── AI Section Tips ───────────────────────────────
const TIPS = {
  personal:`Fill in your contact information carefully — this is how employers reach you. Make sure your email looks professional and your phone number is correct. Select your campus and program from the dropdowns.`,
  career:`Be specific about the type of job and employer you're targeting. The more detail you give me here, the stronger I can make your resume objective. Pick up to 3 qualities that describe you as a worker.`,

function handleDrop(e) {

}
function handleFileSelect(inp) { if (inp.files[0]) setUploadFile(inp.files[0]); }
function setUploadFile(file) {
  selectedResumeFile = file;
  const sel = document.getElementById('uploadSelected');
  sel.style.display = 'flex'; sel.className = 'upload-selected';
  sel.innerHTML = `<span>📎</span><span>${escHtml(file.name)}</span><span style="margin-left:auto;font-weight:400;color:var(--slate-500)">${(file.size/1024).toFixed(0)} KB</span>`;
  const btn = document.getElementById('extractBtn');
  btn.disabled = false; btn.style.opacity = '1';

async function extractResume() {
  if (!selectedResumeFile) return;
  const btn = document.getElementById('extractBtn');
  btn.disabled = true; btn.textContent = 'Extracting…';
  addAIMsg('Extracting your resume information — one moment…');
  showChatTyping();
  try {
    const ext = selectedResumeFile.name.split('.').pop().toLowerCase();
    let text = '', useDoc = false, b64 = '';
    if (ext === 'txt') text = await readAsText(selectedResumeFile);
    else if (ext === 'pdf') { b64 = await readAsBase64(selectedResumeFile); useDoc = true; }
    else if (ext === 'docx') text = await readDocx(selectedResumeFile);
    const parsed = await parseResume(text, useDoc, b64);
    hideChatTyping();
    if (parsed.personal) Object.assign(resumeData.personal, parsed.personal);
    if (parsed.workExperience?.length) resumeData.workExperience = parsed.workExperience;
    if (parsed.education?.length) resumeData.education = parsed.education;
    if (parsed.certifications?.length) resumeData.certifications = parsed.certifications;
    if (parsed.skills?.length) resumeData.skills = parsed.skills;
    const p = resumeData.personal;
    addAIMsg(`Got it! I found your info for ${p.firstName || ''} ${p.lastName || ''}. I've pre-filled the forms below — just review and confirm each section.`);
    showSection('personal');
  } catch(err) {
    hideChatTyping();
    addAIMsg('I had trouble reading that file. Try a different format, or start fresh.');
    btn.disabled = false; btn.textContent = 'Extract & Continue →'; btn.style.opacity = '1';
  }
}

function readAsText(f) { return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsText(f); }); }
function readAsBase64(f) { return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>{ const b64=btoa(new Uint8Array(e.target.result).reduce((d,b)=>d+String.fromCharCode(b),'')); res(b64); }; r.onerror=rej; r.readAsArrayBuffer(f); }); }
function readDocx(f) { return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=async e=>{ try{ const result=await mammoth.extractRawText({arrayBuffer:e.target.result}); res(result.value); }catch(err){rej(err);} }; r.onerror=rej; r.readAsArrayBuffer(f); }); }

async function parseResume(text, useDoc, b64) {
  const instruction = `Extract info from this resume. Return ONLY valid JSON with this structure (empty string if not found):
{"personal":{"firstName":"","lastName":"","email":"","phone":"","address":"","city":"","state":"","zip":""},"workExperience":[{"employer":"","jobTitle":"","city":"","state":"","startMonth":"","startYear":"","endMonth":"","endYear":"","current":false,"bulletLines":[]}],"education":[{"school":"","degree":"","fieldOfStudy":"","city":"","state":"","gradYear":""}],"certifications":[{"name":"","org":"","year":""}],"skills":[]}`;
  let messages;
  if (useDoc) messages=[{role:'user',content:[{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}},{type:'text',text:instruction}]}];
  else messages=[{role:'user',content:`${instruction}\n\nResume:\n${text}`}];
  const raw = await callClaude('', messages, true);
  return JSON.parse(raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,''));
}

function submitPersonal() {

    {id:'ln',fg:'fg-ln',test:v=>v.length>0},
    {id:'em',fg:'fg-em',test:v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)},
    {id:'ph',fg:'fg-ph',test:v=>v.replace(/\D/g,'').length>=7},
    {id:'campusSel',fg:'fg-campus',test:v=>v!==''},
    {id:'progSel',fg:'fg-prog',test:v=>v!==''},
  ];
  let valid = true;
  checks.forEach(({id,fg,test})=>{ const el=document.getElementById(id),grp=document.getElementById(fg); if(el&&grp){if(!test(el.value.trim())){grp.classList.add('has-error');valid=false;}else{grp.classList.remove('has-error');}} });
  if (!valid) return;
  resumeData.personal = {
    firstName:document.getElementById('fn').value.trim(),
    lastName:document.getElementById('ln').value.trim(),
    email:document.getElementById('em').value.trim(),

function fmtPhone(el) {
  let d = el.value.replace(/\D/g,'').slice(0,10);
  if (d.length>=6) d=`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
  else if (d.length>=3) d=`(${d.slice(0,3)}) ${d.slice(3)}`;
  el.value = d;
}

async function submitWork() {
  const checks=[{id:'empName',fg:'fg-emp',test:v=>v.length>0},{id:'jobTitle',fg:'fg-jt',test:v=>v.length>0},{id:'startMo',fg:'fg-sd',test:v=>v!==''},{id:'startYr',fg:'fg-sd',test:v=>/^\d{4}$/.test(v)},{id:'duties',fg:'fg-duties',test:v=>v.length>10}];
  let valid=true; const seen=new Set();
  checks.forEach(({id,fg,test})=>{ const el=document.getElementById(id),grp=document.getElementById(fg); if(!test(el.value.trim())){if(!seen.has(fg)){grp.classList.add('has-error');seen.add(fg);}valid=false;}else if(!seen.has(fg))grp.classList.remove('has-error'); });
  if (!valid) return;
  const cur = document.getElementById('curJob').checked;
  pendingWork = {
    employer:document.getElementById('empName').value.trim(),
    jobTitle:document.getElementById('jobTitle').value.trim(),
    city:document.getElementById('wCity').value.trim(),
    state:document.getElementById('wState').value.trim().toUpperCase(),
    startMonth:document.getElementById('startMo').value,
    startYear:document.getElementById('startYr').value.trim(),
    endMonth:cur?'':document.getElementById('endMo').value,
    endYear:cur?'Present':document.getElementById('endYr').value.trim(),
    current:cur,
    duties:document.getElementById('duties').value.trim(),
  };
  const ci = document.getElementById('centerInner');
  ci.innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--slate-500)"><div style="font-size:32px;margin-bottom:12px">⚙️</div>Generating bullet points…</div>`;
  const prog = resumeData.personal.program || '';
  const tense = cur ? 'present tense' : 'past tense';
  const sys = `Write resume bullet points for a trade school student studying ${prog}. Job: ${pendingWork.jobTitle} at ${pendingWork.employer}. Duties: "${pendingWork.duties}". Write 3–5 bullets, ${tense}, each starting with a strong action verb. Each line starts with •. Return only the bullet points.`;
  try {
    const result = await callClaude(sys,[{role:'user',content:'Write the bullet points.'}]);
    pendingWork.bulletLines = result.trim().split('\n').map(l=>l.trim().replace(/^[•\-\*]\s*/,'')).filter(l=>l.length>0);
    showCenter('workApproval');
  } catch(e) { addAIMsg('Could not connect — please try again.'); showSection('work'); }
}

  if (campus.includes('Pulaski'))        return {city:'Pulaski',state:'PA'};
  if (campus.includes('Baltimore'))      return {city:'Baltimore',state:'MD'};

}

async function submitSkills() {

// Mini CSS previews
function buildPreviewHTML(style,colorKey) {
  const ac = COLOR_SCHEMES[colorKey].hex;
  const ml = (w,c='#ccc')=>`<div style="height:1.5px;background:${c};width:${w}%;margin-bottom:2px;border-radius:1px"></div>`;
  const sec = ()=>`<div style="height:2px;background:${ac};width:36%;margin:4px 0 3px;border-radius:1px"></div>`;
  const job = ()=>`<div style="height:2px;background:#555;width:58%;margin-bottom:1px;border-radius:1px"></div><div style="height:1.5px;background:#999;width:38%;margin-bottom:2px;border-radius:1px"></div>`;
  if (style==='classic') return `<div style="padding:7%;background:white;height:100%;box-sizing:border-box"><div style="height:5px;background:#1a1a1a;width:52%;margin:0 auto 3px;border-radius:1px"></div><div style="height:2px;background:#777;width:64%;margin:0 auto 4px;border-radius:1px"></div><div style="height:1px;background:${ac};margin:2px 0 5px"></div>${sec()}${ml(95)}${ml(80)}${ml(90)}${sec()}${job()}${ml(90)}${ml(82)}${sec()}${ml(75)}${ml(60)}${sec()}${ml(90)}</div>`;
  if (style==='modern') return `<div style="display:flex;height:100%"><div style="width:33%;background:${ac};padding:6% 4%;box-sizing:border-box"><div style="height:4px;background:white;width:80%;margin-bottom:2px;border-radius:1px;opacity:.9"></div>${[90,70,85,75,80].map(w=>`<div style="height:1.5px;background:rgba(255,255,255,.5);width:${w}%;margin-bottom:2px;border-radius:1px"></div>`).join('')}<div style="height:2px;background:rgba(255,255,255,.8);width:55%;margin:6px 0 3px;border-radius:1px"></div>${[80,65].map(w=>`<div style="height:1.5px;background:rgba(255,255,255,.45);width:${w}%;margin-bottom:2px;border-radius:1px"></div>`).join('')}</div><div style="flex:1;background:white;padding:6% 5%;box-sizing:border-box">${sec()}${ml(95)}${ml(80)}${sec()}${job()}${ml(90)}${ml(82)}${sec()}${ml(75)}${ml(60)}</div></div>`;
  if (style==='bold') return `<div style="height:100%;background:white"><div style="background:${ac};padding:7% 7% 5%"><div style="height:6px;background:white;width:58%;margin-bottom:3px;border-radius:1px;opacity:.95"></div><div style="height:2px;background:rgba(255,255,255,.6);width:72%;margin-bottom:1px;border-radius:1px"></div></div><div style="padding:5% 7%"><div style="display:flex;align-items:center;gap:3px;margin-bottom:3px"><div style="height:8px;width:2.5px;background:${ac};border-radius:1px"></div><div style="height:2px;background:${ac};width:34%;border-radius:1px"></div></div>${ml(90)}${ml(80)}<div style="display:flex;align-items:center;gap:3px;margin:4px 0 3px"><div style="height:8px;width:2.5px;background:${ac};border-radius:1px"></div><div style="height:2px;background:${ac};width:40%;border-radius:1px"></div></div>${job()}${ml(88)}${ml(80)}</div></div>`;
  if (style==='executive') return `<div style="padding:7%;background:white;height:100%;box-sizing:border-box"><div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:3px"><div style="height:5px;background:#1a1a1a;width:43%;border-radius:1px"></div><div style="height:2px;background:#666;width:34%;border-radius:1px"></div></div><div style="height:2px;background:${ac};margin:3px 0 5px;border-radius:1px"></div><div style="display:flex;justify-content:space-between;align-items:center;margin:4px 0 3px"><div style="height:2px;background:#1a1a1a;width:30%;border-radius:1px"></div><div style="height:1px;background:#ddd;flex:1;margin-left:3px"></div></div>${ml(95)}${ml(80)}<div style="display:flex;justify-content:space-between;align-items:center;margin:4px 0 3px"><div style="height:2px;background:#1a1a1a;width:34%;border-radius:1px"></div><div style="height:1px;background:#ddd;flex:1;margin-left:3px"></div></div><div style="display:flex;justify-content:space-between;margin-bottom:1px"><div style="height:2px;background:#444;width:52%;border-radius:1px"></div><div style="height:1.5px;background:#888;width:26%;border-radius:1px"></div></div>${ml(90)}${ml(82)}</div>`;
  return '';
}

async function generateResume() {
  const btn = document.getElementById('genBtn');
  btn.disabled=true; btn.textContent='Building resume…';
  try {
    const color = COLOR_SCHEMES[selectedColor];
    const doc = await buildDocument(resumeData, selectedStyle, color);
    const blob = await docx.Packer.toBlob(doc);
    saveAs(blob, `resume-${selectedStyle}-${selectedColor}.docx`);
    if (document.getElementById('clToggle').checked) { btn.textContent='Writing cover letter…'; await generateCoverLetter(); }
    setStatus('template','done');
    btn.disabled=false; btn.textContent='Download Again ↓';
    addAIMsg(`Your resume has been downloaded! Change the style or color anytime and click Download Again to try a different look.`);
  } catch(err) { btn.disabled=false; btn.textContent='Generate & Download ↓'; addAIMsg(`Error generating file: ${err.message}`); console.error(err); }
}

// ── docx Builders (shared helpers) ───────────────
const twip = n => docx.convertInchesToTwip(n);

function bodyTxt(text,opts={}){return new docx.Paragraph({children:[new docx.TextRun({text,size:opts.size||20,color:opts.color||'2a2a2a',italics:opts.italic||false})],indent:opts.indent?{left:twip(opts.indent)}:undefined,spacing:{before:0,after:opts.after!==undefined?opts.after:30},alignment:opts.align||docx.AlignmentType.LEFT})}
function bullet(text){return new docx.Paragraph({children:[new docx.TextRun({text:`•  ${text}`,size:19,color:'2a2a2a'})],indent:{left:twip(0.15)},spacing:{before:0,after:28}})}
function jobBlock(job){const items=[],loc=[job.city,job.state].filter(Boolean).join(', '),end=job.current?'Present':[job.endMonth,job.endYear].filter(Boolean).join(' '),dates=`${[job.startMonth,job.startYear].filter(Boolean).join(' ')} – ${end}`;items.push(new docx.Paragraph({spacing:{before:100,after:0},children:[new docx.TextRun({text:job.jobTitle,bold:true,size:21,color:'1a1a1a'}),new docx.TextRun({text:`  •  ${job.employer}${loc?'  •  '+loc:''}`,size:20,color:'444444'})]}));items.push(new docx.Paragraph({spacing:{before:0,after:40},children:[new docx.TextRun({text:dates,italics:true,size:18,color:'777777'})]}));(job.bulletLines||[]).forEach(b=>items.push(bullet(b)));return items;}
function eduBlock(edu){const loc=[edu.city,edu.state].filter(Boolean).join(', '),field=edu.fieldOfStudy?` – ${edu.fieldOfStudy}`:'';return new docx.Paragraph({spacing:{before:80,after:30},children:[new docx.TextRun({text:`${edu.degree}${field}`,bold:true,size:20,color:'1a1a1a'}),new docx.TextRun({text:`  •  ${edu.school}${loc?', '+loc:''}  •  ${edu.gradYear}`,size:20,color:'555555'})]})}

async function buildDocument(data,style,color){const builders={classic:buildClassic,modern:buildModern,bold:buildBold,executive:buildExecutive};return (builders[style]||buildClassic)(data,color);}

function buildClassic(data,color){const p=data.personal,c=data.careerContext,ac=color.accent,M=twip(0.75),ch=[];ch.push(new docx.Paragraph({alignment:docx.AlignmentType.CENTER,spacing:{before:0,after:40},children:[new docx.TextRun({text:`${p.firstName} ${p.lastName}`.trim(),bold:true,size:40,color:'111111'})]}));const contact=[p.email,p.phone,[p.city,p.state].filter(Boolean).join(', ')].filter(Boolean).join('   |   ');if(contact)ch.push(new docx.Paragraph({alignment:docx.AlignmentType.CENTER,spacing:{before:0,after:80},children:[new docx.TextRun({text:contact,size:18,color:'555555'})]}));ch.push(new docx.Paragraph({border:{bottom:{style:docx.BorderStyle.SINGLE,size:8,color:ac}},spacing:{before:0,after:100}}));const sec=t=>new docx.Paragraph({children:[new docx.TextRun({text:t.toUpperCase(),bold:true,size:22,color:ac})],border:{bottom:{style:docx.BorderStyle.SINGLE,size:4,color:ac}},spacing:{before:140,after:60}});if(c.objective){ch.push(sec('Objective'));ch.push(bodyTxt(c.objective,{after:100}));}if(data.workExperience?.length){ch.push(sec('Experience'));data.workExperience.forEach(j=>jobBlock(j).forEach(p=>ch.push(p)));}if(data.education?.length){ch.push(sec('Education'));data.education.forEach(e=>ch.push(eduBlock(e)));}if(data.certifications?.length){ch.push(sec('Certifications'));data.certifications.forEach(cert=>ch.push(new docx.Paragraph({spacing:{before:60,after:30},children:[new docx.TextRun({text:cert.name,bold:true,size:20}),...(cert.org||cert.year?[new docx.TextRun({text:`  —  ${[cert.org,cert.year].filter(Boolean).join(', ')}`,size:19,color:'666666'})]:[])]})));}if(data.skills?.length){ch.push(sec('Skills'));ch.push(bodyTxt(Array.isArray(data.skills)?data.skills.join('   •   '):data.skills,{after:60}));}ch.push(spacer(120));ch.push(new docx.Paragraph({alignment:docx.AlignmentType.CENTER,children:[new docx.TextRun({text:'References Available Upon Request',italics:true,size:18,color:'999999'})]}));return new docx.Document({sections:[{properties:{page:{margin:{top:M,bottom:M,left:M,right:M}}},children:ch}]});}

function buildModern(data,color){const p=data.personal,c=data.careerContext,ac=color.accent,st=color.sideText,side=[],main=[];side.push(new docx.Paragraph({spacing:{before:0,after:60},children:[new docx.TextRun({text:`${p.firstName} ${p.lastName}`.trim(),bold:true,size:28,color:st})]}));[p.email,p.phone,[p.city,p.state].filter(Boolean).join(', '),p.address].filter(Boolean).forEach(line=>side.push(new docx.Paragraph({spacing:{before:0,after:22},children:[new docx.TextRun({text:line,size:17,color:st==='FFFFFF'?'CCE4FF':'CCCCCC'})]})));const sideSec=t=>new docx.Paragraph({children:[new docx.TextRun({text:t.toUpperCase(),bold:true,size:19,color:st})],border:{bottom:{style:docx.BorderStyle.SINGLE,size:3,color:st==='FFFFFF'?'6699CC':'777777'}},spacing:{before:160,after:60}});if(data.skills?.length){side.push(sideSec('Skills'));const sl=Array.isArray(data.skills)?data.skills:[data.skills];sl.forEach(s=>side.push(new docx.Paragraph({spacing:{before:0,after:22},children:[new docx.TextRun({text:`•  ${s}`,size:17,color:st==='FFFFFF'?'CCE4FF':'CCCCCC'})]})));}if(data.certifications?.length){side.push(sideSec('Certifications'));data.certifications.forEach(cert=>side.push(new docx.Paragraph({spacing:{before:0,after:22},children:[new docx.TextRun({text:cert.name,size:17,color:st==='FFFFFF'?'CCE4FF':'CCCCCC'})]}))); }const mainSec=t=>new docx.Paragraph({children:[new docx.TextRun({text:t.toUpperCase(),bold:true,size:22,color:ac})],border:{bottom:{style:docx.BorderStyle.SINGLE,size:4,color:ac}},spacing:{before:120,after:60}});if(c.objective){main.push(mainSec('Objective'));main.push(bodyTxt(c.objective,{after:80}));}if(data.workExperience?.length){main.push(mainSec('Experience'));data.workExperience.forEach(j=>jobBlock(j).forEach(p=>main.push(p)));}if(data.education?.length){main.push(mainSec('Education'));data.education.forEach(e=>main.push(eduBlock(e)));}main.push(spacer(120));main.push(new docx.Paragraph({children:[new docx.TextRun({text:'References Available Upon Request',italics:true,size:17,color:'999999'})]}));const nb={style:docx.BorderStyle.NONE,size:0,color:'FFFFFF'};return new docx.Document({sections:[{properties:{page:{margin:{top:0,bottom:0,left:0,right:0}}},children:[new docx.Table({width:{size:100,type:docx.WidthType.PERCENTAGE},borders:{top:nb,bottom:nb,left:nb,right:nb,insideH:nb,insideV:nb},rows:[new docx.TableRow({children:[new docx.TableCell({width:{size:twip(2.4),type:docx.WidthType.DXA},shading:{fill:ac,type:docx.ShadingType.CLEAR,color:'auto'},margins:{top:twip(.4),bottom:twip(.4),left:twip(.25),right:twip(.2)},children:side}),new docx.TableCell({width:{size:twip(5.1),type:docx.WidthType.DXA},margins:{top:twip(.35),bottom:twip(.35),left:twip(.3),right:twip(.3)},children:main})]})]})]},]});}

function buildBold(data,color){const p=data.personal,c=data.careerContext,ac=color.accent,st=color.sideText,bm=twip(.65),nb={style:docx.BorderStyle.NONE,size:0,color:'FFFFFF'},contact=[p.email,p.phone,[p.city,p.state].filter(Boolean).join(', ')].filter(Boolean).join('   |   '),hdr=new docx.Table({width:{size:100,type:docx.WidthType.PERCENTAGE},borders:{top:nb,bottom:nb,left:nb,right:nb,insideH:nb,insideV:nb},rows:[new docx.TableRow({children:[new docx.TableCell({shading:{fill:ac,type:docx.ShadingType.CLEAR,color:'auto'},margins:{top:twip(.3),bottom:twip(.25),left:twip(.65),right:twip(.65)},children:[new docx.Paragraph({spacing:{before:0,after:50},children:[new docx.TextRun({text:`${p.firstName} ${p.lastName}`.trim(),bold:true,size:46,color:st})]}),new docx.Paragraph({spacing:{before:0,after:0},children:[new docx.TextRun({text:contact,size:19,color:st==='FFFFFF'?'CCE4FF':'BBBBBB'})]})]})]})]});const ch=[hdr],sec=t=>new docx.Paragraph({spacing:{before:160,after:60},border:{left:{style:docx.BorderStyle.SINGLE,size:16,color:ac}},indent:{left:twip(.15)},children:[new docx.TextRun({text:t.toUpperCase(),bold:true,size:22,color:ac})]});if(c.objective){ch.push(sec('Objective'));ch.push(bodyTxt(c.objective,{after:80}));}if(data.workExperience?.length){ch.push(sec('Experience'));data.workExperience.forEach(j=>jobBlock(j).forEach(q=>ch.push(q)));}if(data.education?.length){ch.push(sec('Education'));data.education.forEach(e=>ch.push(eduBlock(e)));}if(data.certifications?.length){ch.push(sec('Certifications'));data.certifications.forEach(cert=>ch.push(new docx.Paragraph({spacing:{before:60,after:30},children:[new docx.TextRun({text:cert.name,bold:true,size:20}),...(cert.org||cert.year?[new docx.TextRun({text:`  —  ${[cert.org,cert.year].filter(Boolean).join(', ')}`,size:19,color:'666666'})]:[])]})));}if(data.skills?.length){ch.push(sec('Skills'));ch.push(bodyTxt(Array.isArray(data.skills)?data.skills.join('   •   '):data.skills));}ch.push(spacer(120));ch.push(new docx.Paragraph({alignment:docx.AlignmentType.CENTER,children:[new docx.TextRun({text:'References Available Upon Request',italics:true,size:18,color:'999999'})]}));return new docx.Document({sections:[{properties:{page:{margin:{top:0,bottom:bm,left:bm,right:bm}}},children:ch}]});}

function buildExecutive(data,color){const p=data.personal,c=data.careerContext,ac=color.accent,M=twip(.65),ch=[];const cl=[p.email,p.phone,[p.city,p.state].filter(Boolean).join(', ')].filter(Boolean).join('  |  ');ch.push(new docx.Paragraph({tabStops:[{type:docx.TabStopType.RIGHT,position:twip(7)}],spacing:{before:0,after:30},children:[new docx.TextRun({text:`${p.firstName} ${p.lastName}`.trim(),bold:true,size:38,color:'111111'}),new docx.TextRun({text:'\t'+cl,size:17,color:'666666'})]}));ch.push(new docx.Paragraph({border:{bottom:{style:docx.BorderStyle.THICK,size:12,color:ac}},spacing:{before:0,after:100}}));const sec=t=>new docx.Paragraph({tabStops:[{type:docx.TabStopType.RIGHT,position:twip(7)}],spacing:{before:160,after:50},children:[new docx.TextRun({text:t.toUpperCase(),bold:true,size:20,color:'111111'})],border:{bottom:{style:docx.BorderStyle.SINGLE,size:2,color:'cccccc'}}});if(c.objective){ch.push(sec('Professional Summary'));ch.push(bodyTxt(c.objective,{after:100}));}if(data.workExperience?.length){ch.push(sec('Experience'));data.workExperience.forEach(job=>{const loc=[job.city,job.state].filter(Boolean).join(', '),end=job.current?'Present':[job.endMonth,job.endYear].filter(Boolean).join(' '),dates=`${[job.startMonth,job.startYear].filter(Boolean).join(' ')} – ${end}`;ch.push(new docx.Paragraph({tabStops:[{type:docx.TabStopType.RIGHT,position:twip(7)}],spacing:{before:100,after:20},children:[new docx.TextRun({text:`${job.jobTitle}  •  ${job.employer}${loc?', '+loc:''}`,bold:true,size:21,color:'1a1a1a'}),new docx.TextRun({text:'\t'+dates,italics:true,size:18,color:'888888'})]}));(job.bulletLines||[]).forEach(b=>ch.push(bullet(b)));});}if(data.education?.length){ch.push(sec('Education'));data.education.forEach(e=>ch.push(eduBlock(e)));}if(data.certifications?.length){ch.push(sec('Certifications'));data.certifications.forEach(cert=>ch.push(new docx.Paragraph({spacing:{before:60,after:30},children:[new docx.TextRun({text:cert.name,bold:true,size:20}),...(cert. // ── Cover Letter ──────────────────────────────────
async function generateCoverLetter(){const p=resumeData.personal,c=resumeData.careerContext;const sys=`Write a professional 3-paragraph cover letter for ${p.firstName} ${p.lastName}, studying ${p.program||''}. Looking for: ${c.workSearch||''}. Qualities: ${(c.qualities||[]).join(', ')}. Objective: ${c.objective||''}. Professional and direct, under 300 words. Plain text only.`;const letter=await callClaude(sys,[{role:'user',content:'Write my cover letter.'}]);const name=`${p.firstName||''} ${p.lastName||''}`.trim(),contact=[p.email,p.phone].filter(Boolean).join('   |   '),M=twip(1);const doc=new docx.Document({sections:[{properties:{page:{margin:{top:M,bottom:M,left:M,right:M}}},children:[new docx.Paragraph({children:[new docx.TextRun({text:name,bold:true,size:28})],spacing:{after:40}}),new docx.Paragraph({children:[new docx.TextRun({text:contact,size:19,color:'555555'})],spacing:{after:200}}),...letter.trim().split('\n\n').filter(Boolean).map(para=>new docx.Paragraph({children:[new docx.TextRun({text:para.trim(),size:22})],spacing:{before:0,after:180}})),new docx.Paragraph({children:[new docx.TextRun({text:'Sincerely,',size:22})],spacing:{before:200,after:280}}),new docx.Paragraph({children:[new docx.TextRun({text:name,size:22})]})]}]});const blob=await docx.Packer.toBlob(doc);saveAs(blob,'cover-letter.docx');}

// ── Claude API ────────────────────────────────────
async function callClaude(system,messages,raw=false){const body={model:'claude-sonnet-4-20250514',max_tokens:1024,messages};if(system)body.system=system;const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||`API error ${res.status}`);}const data=await res.json();return data.content[0].text;}

function sendTip(key){const tip=TIPS[key];if(tip)setTimeout(()=>addAIMsg(tip),300);}

function addAIMsg(text){const msgs=document.getElementById('chatMessages');if(!msgs)return;const div=document.createElement('div');div.className='chat-msg ai';div.innerHTML=`<div class="msg-lbl">AI</div><div class="msg-bubble">${escHtml(text).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}</div>`;msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;}

function showChatTyping(){const msgs=document.getElementById('chatMessages');if(!msgs||document.getElementById('chatTyping'))return;const div=document.createElement('div');div.className='chat-msg ai';div.id='chatTyping';div.innerHTML=`<div class="msg-lbl">AI</div><div class="msg-bubble"><div class="t-dots"><div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div></div></div>`;msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;}

function hideChatTyping(){const el=document.getElementById('chatTyping');if(el)el.remove();isAIThinking=false;}

async function sendChat(){const inp=document.getElementById('chatInput');const text=inp.value.trim();if(!text||isAIThinking)return;inp.value='';autoResizeChat(inp);const um=document.createElement('div');um.className='chat-msg user';um.innerHTML=`<div class="msg-lbl" style="text-align:right">You</div><div class="msg-bubble">${escHtml(text)}</div>`;document.getElementById('chatMessages').appendChild(um);document.getElementById('chatMessages').scrollTop=document.getElementById('chatMessages').scrollHeight;isAIThinking=true;showChatTyping();const p=resumeData.personal;const sys=`You are a resume assistant helping ${p.firstName||'a student'} build their resume. They are on the ${currentSection||'start'} section. Answer questions helpfully and briefly — 2–3 sentences max. Do not use filler phrases.`;chatHistory.push({role:'user',content:text});try{const reply=await callClaude(sys,chatHistory.slice(-8));hideChatTyping();chatHistory.push({role:'assistant',content:reply});addAIMsg(reply);}catch(e){hideChatTyping();addAIMsg('Sorry, I had trouble connecting. Please try again.');}}

function handleChatKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}}
function autoResizeChat(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,90)+'px';}

function toggleChat(){const rp=document.getElementById('rightPanel');const btn=document.querySelector('.rp-toggle');const collapsed=rp.classList.toggle('collapsed');btn.textContent=collapsed?'▶':'◀';}

window.addEventListener('load',()=>{
  const key = HARDCODED_KEY || sessionStorage.getItem('rb_key');
  if (key&&key.startsWith('sk-ant-')){
    apiKey=key;
    document.getElementById('apiKeyInput').value=key;
    document.getElementById('apiKeyArea').style.display='none';
    document.getElementById('keyReady').style.display='flex';
    document.getElementById('chatInput').disabled=false;
    document.getElementById('chatSendBtn').disabled=false;
    startApp();
  }
});
</script>
