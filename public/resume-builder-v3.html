async function submitSkills() {
  const fg=document.getElementById('fg-sk');
  const skills = collectSkillInputs();
  const certs = collectCertInputs();
  if (!skills.length) { fg.classList.add('has-error'); return; }
  fg.classList.remove('has-error');
  const fgCert=document.getElementById('fg-certlist');
  if (certs.length && certs.some(c => /\b(fake|none|idk|whatever)\b/i.test(c.name))) { fgCert.classList.add('has-error'); return; }
  fgCert.classList.remove('has-error');
  suggestMinSkillCertCounts(skills.length, certs.length);
  const rawSkills = skills.join(', ');
  const rawCerts = certs.map(c => c.name).join('\n');
  const ci = document.getElementById('centerInner');
  ci.innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--slate-500)"><div style="font-size:32px;margin-bottom:12px">⚡</div>Organizing your skills and certifications…</div>`;
  const prog = resumeData.personal.program||'';
  const sys = `You organize skills and certifications for a trade school student's resume. Return ONLY valid JSON — no explanations, no questions, no other text. Shape: {"skills":["MIG/TIG Welding","Blueprint Reading"],"certifications":[{"name":"OSHA 10","org":"OSHA","year":""}]}. Rules: clean spelling/capitalization/duplicates, make professional, do not invent certifications, omit certifications array entries that were not provided.`;
  const userMsg = `Program: ${prog}\nRaw skills: ${rawSkills}\nRaw certifications: ${rawCerts || 'none'}`;
  try {
    const result = await callClaude(sys,[{role:'user',content:userMsg}]);
    let data;
    try { data=JSON.parse(result.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'')); }
    catch { data={skills:result.split('\n').map(l=>l.replace(/^[•\-\*"\[,\]]+\s*/,'').replace(/[",\]]+$/,'').trim()).filter(l=>l.length>1&&l.length<=80),certifications:parseCertLines(rawCerts)}; }
    resumeData.skills = normalizeSkillsList(Array.isArray(data.skills) ? data.skills : rawSkills).slice(0, MAX_SKILL_CERT_ITEMS);
    resumeData.certifications = (Array.isArray(data.certifications)
      ? normalizeCertificationsList(data.certifications)
      : normalizeCertificationsList(parseCertLines(rawCerts))).slice(0, MAX_SKILL_CERT_ITEMS);
    delete resumeData._skillsFromUpload;
    delete resumeData._certsFromUpload;
    resumeData.references = 'Available upon request';
    if (!resumeData.skills.length || looksLikeBrokenSkillList(resumeData.skills) || resumeData.skills.some(s => !isValidSkillEntry(s))) {
      addAIMsg('There was a problem organizing your skills — please try again.');
      showSection('skills');
      return;
    }
    showCenter('skillsApproval');
  } catch(e) { addAIMsg('Could not connect — try again.'); showSection('skills'); }
}

function parseCertLines(raw) {
  return normalizeCertificationsList(raw);
}

function cleanCertObject(cert) {
  return {
    name:cleanProgramName(String(cert.name||'')),
    org:String(cert.org||'').trim().toUpperCase(),
    year:/^\d{4}$/.test(String(cert.year||'').trim()) ? String(cert.year).trim() : ''
  };
}

function renderReadOnlyList(items, emptyText) {
  if (!items || !items.length) return `<span class="a-value" style="font-size:13px;color:var(--slate-400)">${emptyText}</span>`;
  return items.map(item => `<div class="ebl-item"><span class="ebl-dot">•</span><span class="ebl-text">${escHtml(item)}</span></div>`).join('');
}

function renderSkillsApproval() {
  const skillItems = renderReadOnlyList(resumeData.skills, 'No skills listed.');

function pickStyle(id) {
  selectedStyle=id;
  document.querySelectorAll('.style-btn').forEach(el=>el.classList.remove('sel'));
  document.getElementById(`sb-${id}`).classList.add('sel');
  STYLES.forEach(s=>{ const el=document.getElementById(`sp-${s.id}`); if(el) el.innerHTML=buildPreviewHTML(s.id,selectedColorHex); });
}

function pickColor(hex) {
  selectedColorHex=hex;
  const inp=document.getElementById('colorPickerInput');
  if(inp) inp.value=hex;
  document.querySelectorAll('.color-preset').forEach(el=>el.classList.toggle('sel',el.dataset.hex===hex));
  STYLES.forEach(s=>{ const el=document.getElementById(`sp-${s.id}`); if(el) el.innerHTML=buildPreviewHTML(s.id,hex); });
}

function pickBulletIndex(i){
  selectedBulletIndex=i;
  document.querySelectorAll('.bullet-opt').forEach((el,idx)=>el.classList.toggle('sel',idx===i));
}

function pickIconSet(key){
  selectedIconSet=key;
  document.querySelectorAll('.icon-set-btn').forEach(el=>el.classList.remove('sel'));
  const btn=document.getElementById(`is-${key}`);
  if(btn)btn.classList.add('sel');
}

function getColorObj(hex){
  const clean=hex.replace('#','').toUpperCase();
  const r=parseInt(clean.slice(0,2),16),g=parseInt(clean.slice(2,4),16),b=parseInt(clean.slice(4,6),16);
  const lum=(0.299*r+0.587*g+0.114*b)/255;
  return {hex,accent:clean,sideText:lum>0.55?'111111':'FFFFFF'};
}

function resumeFilename(personal) {
  const programInitials = RESUME_PROGRAM_INITIALS[personal.campus]?.[personal.program] || 'Resume';
  const safePart = value => String(value || '')
    .replace(/[<>:"/\\|?*\x00-\x1F]/g, '')
    .trim()
    .replace(/\s+/g, ' ')
    .replace(/^[.-]+|[.-]+$/g, '');
  const program = safePart(programInitials);
  const lastName = safePart(personal.lastName);
  const firstName = safePart(personal.firstName);
  const city = safePart(personal.city);
  const state = safePart(personal.state);
  return `${program} ${lastName}, ${firstName} ${city}, ${state}.docx`;
}

async function generateResume() {
  const btn = document.getElementById('genBtn');
  btn.disabled=true; btn.textContent='Building resume…';
  try {
    const color = getColorObj(selectedColorHex);
    btn.textContent = 'Preparing resume…';
    const courseOfStudy = await resolveCourseOfStudyForResume();
    const buildData = {...resumeData, courseOfStudy};

    btn.textContent = 'Building resume…';
    const doc = await buildDocument(buildData, selectedStyle, color);
    const blob = await docx.Packer.toBlob(doc);
    const p=resumeData.personal;
    saveAs(blob, resumeFilename(p));
    setStatus('template','done');
    btn.disabled=false; btn.textContent='Download Again ↓';
    addAIMsg(`Your resume has been downloaded! Change the style or color anytime and click Download Again to try a different look.`);
  } catch(err) { btn.disabled=false; btn.textContent='Generate & Download ↓'; addAIMsg(`Error generating file: ${err.message}`); console.error(err); }
}

const twip = n => docx.convertInchesToTwip(n);
function currentBullet(){return BULLET_OPTIONS[selectedBulletIndex]||BULLET_OPTIONS[0];}
function bulletRuns(text,opts={}){const meta=opts.bulletMeta||currentBullet(),size=opts.size||22,color=opts.color||'2a2a2a';return [new docx.TextRun({text:meta.char+' ',size,color,font:meta.font}),new docx.TextRun({text,size,color,font:'Calibri'})];}
function sectionHeaderRuns(title,opts={}){const size=opts.size||28,color=opts.color||'1a1a1a',bold=opts.bold!==false,set=ICON_SETS[selectedIconSet]||ICON_SETS.none,icon=(set.icons||{})[title]||'',runs=[];if(icon)runs.push(new docx.TextRun({text:icon,size,color,font:set.font||'Calibri'}));runs.push(new docx.TextRun({text:title.toUpperCase(),bold,size,color,font:'Calibri'}));return runs;}
function spacer(a=200){return new docx.Paragraph({spacing:{before:0,after:a}})}
function bodyTxt(text,opts={}){
  const normalized=String(text||'').replace(/\r\n/g,'\n').trim();
  const finalAfter=opts.after!==undefined?opts.after:200;
  const blocks=normalized?normalized.split(/\n{2,}/).map(s=>s.trim()).filter(Boolean):[''];
  return blocks.map((block,blockIndex)=>{
    const isLast=blockIndex===blocks.length-1;
    const lines=block.split('\n');
    const children=[];
    lines.forEach((line,lineIndex)=>{
      if(lineIndex>0)children.push(new docx.TextRun({break:1}));
      children.push(new docx.TextRun({text:line,size:opts.size||24,color:opts.color||'2a2a2a',italics:opts.italic||false,font:'Calibri'}));
    });
    return new docx.Paragraph({children,indent:opts.indent?{left:twip(opts.indent)}:undefined,spacing:{before:0,after:isLast?finalAfter:100,line:288,lineRule:'auto'},alignment:opts.align||docx.AlignmentType.LEFT});
  });
}
function addBodyTxt(target,text,opts){bodyTxt(text,opts).forEach(p=>target.push(p));}
function bullet(text,opts={}){const after=opts.after!==undefined?opts.after:160;return new docx.Paragraph({children:bulletRuns(text,opts),indent:{left:twip(0.36),hanging:twip(0.14)},spacing:{before:0,after,line:276,lineRule:'auto'}})}
function jobBlock(job){const items=[],loc=[job.city,job.state].filter(Boolean).join(', '),end=job.current?'Present':[job.endMonth,job.endYear].filter(Boolean).join(' '),dates=`${[job.startMonth,job.startYear].filter(Boolean).join(' ')} – ${end}`;items.push(new docx.Paragraph({spacing:{before:320,after:60},children:[new docx.TextRun({text:job.jobTitle,bold:true,size:26,color:'1a1a1a'}),new docx.TextRun({text:`, ${job.employer}${loc?', '+loc:''}`,size:24,color:'444444'})]}));items.push(new docx.Paragraph({spacing:{before:0,after:160},children:[new docx.TextRun({text:dates,italics:true,size:22,color:'777777'})]}));(job.bulletLines||[]).forEach(b=>items.push(bullet(b)));return items;}

function militaryBlock(mil){const items=[];const loc=[mil.city,mil.state].filter(Boolean).join(', ');const end=mil.current?'Present':[mil.endMonth,mil.endYear].filter(Boolean).join(' ');const dates=`${[mil.startMonth,mil.startYear].filter(Boolean).join(' ')} – ${end}`;items.push(new docx.Paragraph({spacing:{before:320,after:60},children:[new docx.TextRun({text:mil.rank||'',bold:true,size:26,color:'1a1a1a'}),new docx.TextRun({text:`, ${mil.branch}${mil.jobTitle?', '+mil.jobTitle:''}`,size:24,color:'444444'})]}));if(loc)items.push(new docx.Paragraph({spacing:{before:0,after:40},children:[new docx.TextRun({text:loc,italics:true,size:22,color:'777777'})]}));items.push(new docx.Paragraph({spacing:{before:0,after:160},children:[new docx.TextRun({text:dates,italics:true,size:22,color:'777777'})]}));(mil.bulletLines||[]).forEach(b=>items.push(bullet(b)));return items;}

  if(data.education?.length){side.push(sideSec('Education'));addEducationBlocks(side,data.education,{before:0,gapAfter:140,gapAfterLast:120,degreeSize:20,detailSize:19,degreeColor:'1a1a1a',detailColor:'555555'});}
  if(c.objective){main.push(mainSec('Objective'));addBodyTxt(main,c.objective,{after:120});}
  if(courseOfStudyText(data)){main.push(mainSec('Course of Study'));addBodyTxt(main,courseOfStudyText(data),{after:120});}
  if(data.workExperience?.length){main.push(mainSec('Experience'));data.workExperience.forEach(j=>jobBlock(j).forEach(q=>main.push(q)));}
  if(data.militaryService?.length){main.push(mainSec('Military Service'));data.militaryService.forEach(m=>militaryBlock(m).forEach(q=>main.push(q)));}
  if(data.volunteer?.length){main.push(mainSec('Volunteer'));data.volunteer.forEach(v=>volunteerBlock(v).forEach(q=>main.push(q)));}
  main.push(spacer(200));
  const divider={style:docx.BorderStyle.SINGLE,size:4,color:ac};
  const bodyRow=new docx.TableRow({children:[new docx.TableCell({width:{size:twip(2.25),type:docx.WidthType.DXA},shading:grayShade,margins:{top:twip(.25),bottom:twip(.25),left:twip(.28),right:twip(.18)},children:side.length?side:[new docx.Paragraph({})]}),new docx.TableCell({width:{size:twip(4.75),type:docx.WidthType.DXA},margins:{top:twip(.25),bottom:twip(.25),left:twip(.32),right:twip(.28)},children:main.length?main:[new docx.Paragraph({})]})]});
  return new docx.Document({sections:[{properties:{page:{margin:{top:0,bottom:0,left:0,right:0}}},children:[new docx.Table({width:{size:100,type:docx.WidthType.PERCENTAGE},borders:{top:nb,bottom:nb,left:nb,right:nb,insideH:nb,insideV:divider},rows:[hdrRow,bodyRow]})]},]});
}

async function generateCoverLetter(){const p=resumeData.personal,c=resumeData.careerContext;const sys=`Write a professional 3-paragraph cover letter for ${p.firstName} ${p.lastName}, studying ${p.program||''}. Looking for: ${c.workSearch||''}. Qualities: ${(c.qualities||[]).join(', ')}. Objective: ${c.objective||''}. Professional and direct, under 300 words. Plain text only.`;const letter=await callClaude(sys,[{role:'user',content:'Write my cover letter.'}]);const name=`${p.firstName||''} ${p.lastName||''}`.trim(),contact=[p.email,p.phone].filter(Boolean).join('   |   '),M=twip(1);const doc=new docx.Document({sections:[{properties:{page:{margin:{top:M,bottom:M,left:M,right:M}}},children:[new docx.Paragraph({children:[new docx.TextRun({text:name,bold:true,size:28})],spacing:{after:40}}),new docx.Paragraph({children:[new docx.TextRun({text:contact,size:19,color:'555555'})],spacing:{after:200}}),...letter.trim().split('\n\n').filter(Boolean).map(para=>new docx.Paragraph({children:[new docx.TextRun({text:para.trim(),size:22})],spacing:{before:0,after:180}})),new docx.Paragraph({children:[new docx.TextRun({text:'Sincerely,',size:22})],spacing:{before:200,after:280}}),new docx.Paragraph({children:[new docx.TextRun({text:name,size:22})]})]}]});const blob=await docx.Packer.toBlob(doc);saveAs(blob,'cover-letter.docx');}

// ── Claude API ────────────────────────────────────
function setAIStatus(state){
  const badge=document.getElementById('aiStatusBadge');
  const label=document.getElementById('aiStatusLabel');
  if(!badge||!label)return;
  badge.className='ai-status-badge'+(state==='ok'?' ok':state==='err'?' err':'');
  label.textContent=state==='ok'?'AI Ready':state==='err'?'AI Error':'AI…';
}

async function callClaude(system,messages,opts){
  const body={model:'claude-sonnet-4-6',max_tokens:(opts&&opts.maxTokens)||2048,messages};
  if(system)body.system=system;
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),40000);
  try{
    const res=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal});
    if(!res.ok){const e=await res.json().catch(()=>({}));setAIStatus('err');throw new Error(e.error||`Server error ${res.status}`);}
    const data=await res.json();
    setAIStatus('ok');
    return data.content[0].text;
  }catch(err){
    setAIStatus('err');
    throw err;
  }finally{clearTimeout(timer);}
}

function buildWorkTip() {

const _suggPool=[];

function addSuggestionCard(label,items,targetId,mode='replace'){
  const msgs=document.getElementById('chatMessages');
  if(!msgs)return;
  const div=document.createElement('div');
  div.className='chat-msg ai';
  const btnLabel=mode==='append'?'+ Add':'Use ↵';
  const itemsHtml=items.map(text=>{
    const idx=_suggPool.length;
    _suggPool.push({text,targetId,mode});
    return `<div class="sugg-item" onclick="applySuggestion(${idx})"><span class="sugg-text">${escHtml(text)}</span><button class="sugg-use" onclick="event.stopPropagation();applySuggestion(${idx})">${btnLabel}</button></div>`;
  }).join('');
  div.innerHTML=`<div class="msg-lbl">Suggestions</div><div class="msg-bubble sugg-card"><div class="sugg-label">${escHtml(label)}</div>${itemsHtml}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop=msgs.scrollHeight;
}

function applySuggestion(idx){
  const s=_suggPool[idx];
  if(!s)return;
  const el=document.getElementById(s.targetId);
  if(!el)return;
  if(s.mode==='append'){
    const cur=el.value.trim();
    el.value=cur?cur+'\n'+s.text:s.text;
  } else {
    el.value=s.text;
  }
  el.focus();
  el.style.transition='border-color .3s';
  el.style.borderColor='var(--blue-700)';
  setTimeout(()=>{el.style.borderColor='';},1200);
}

let _dutySuggBubble=null;

function addDutySuggCard(){
  const msgs=document.getElementById('chatMessages');
  if(!msgs)return;
  const div=document.createElement('div');
  div.className='chat-msg ai';
  div.innerHTML=`<div class="msg-lbl">Suggestions</div><div class="msg-bubble sugg-card"><div class="sugg-label">Enter a job title above to get duty suggestions for that specific role.</div></div>`;
  msgs.appendChild(div);
  _dutySuggBubble=div.querySelector('.sugg-card');
  msgs.scrollTop=msgs.scrollHeight;
}

async function refreshDutySuggestions(title){
  if(!_dutySuggBubble||!title||title.trim().length<3)return;
  const t=title.trim();
  _dutySuggBubble.innerHTML=`<div class="sugg-label">Getting suggestions for "${escHtml(t)}"…</div>`;
  try{
    const sys=`Generate exactly 3 job duty suggestions for a "${t}" position on a resume. Return ONLY a JSON array of 3 strings. Each: 1 sentence, 12–20 words, strong past-tense action verb, no "I", no bullets. Example: ["Managed daily operations...", "Assisted customers...", "Operated machinery..."]`;
    const raw=await callClaude(sys,[{role:'user',content:'Generate duty suggestions.'}]);
    const items=JSON.parse(raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,''));
    if(!Array.isArray(items)||!items.length)throw new Error('bad');
    const itemsHtml=items.slice(0,3).map(text=>{
      const idx=_suggPool.length;
      _suggPool.push({text:String(text).trim(),targetId:'duties',mode:'append'});
      return `<div class="sugg-item" onclick="applySuggestion(${idx})"><span class="sugg-text">${escHtml(String(text).trim())}</span><button class="sugg-use" onclick="event.stopPropagation();applySuggestion(${idx})">Use ↵</button></div>`;
    }).join('');
    _dutySuggBubble.innerHTML=`<div class="sugg-label">Suggestions for "${escHtml(t)}" — click to use:</div>${itemsHtml}`;
    const msgs=document.getElementById('chatMessages');
    if(msgs)msgs.scrollTop=msgs.scrollHeight;
  }catch(e){
    _dutySuggBubble.innerHTML=`<div class="sugg-label">Could not load suggestions — check your connection and try again.</div>`;
  }
}

function refreshMilitarySuggestions(branch) {
  if (!branch) return;
  const found = MILITARY_DUTY_EXAMPLES.find(item => item.match.test(branch)) || MILITARY_DUTY_EXAMPLES[MILITARY_DUTY_EXAMPLES.length-1];
  const shortBranch = branch.replace('United States ','').replace(' Corps','').replace(' Force','');
  addAIMsg(`Here are example duty descriptions for the **${shortBranch}** — click any to use as a starting point, then add your own details:`);
  addSuggestionCard(`${shortBranch} duty examples:`, found.examples, 'milDuties', 'append');
}

function addAIMsg(text){const msgs=document.getElementById('chatMessages');if(!msgs)return;const div=document.createElement('div');div.className='chat-msg ai';div.innerHTML=`<div class="msg-lbl">AI</div><div class="msg-bubble">${escHtml(text).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}</div>`;msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;}

function showChatTyping(){const msgs=document.getElementById('chatMessages');if(!msgs||document.getElementById('chatTyping'))return;const div=document.createElement('div');div.className='chat-msg ai';div.id='chatTyping';div.innerHTML=`<div class="msg-lbl">AI</div><div class="msg-bubble"><div class="t-dots"><div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div></div></div>`;msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;}

function hideChatTyping(){const el=document.getElementById('chatTyping');if(el)el.remove();isAIThinking=false;}

async function sendChat(){const inp=document.getElementById('chatInput');const text=inp.value.trim();if(!text||isAIThinking)return;inp.value='';autoResizeChat(inp);const um=document.createElement('div');um.className='chat-msg user';um.innerHTML=`<div class="msg-lbl" style="text-align:right">You</div><div class="msg-bubble">${escHtml(text)}</div>`;document.getElementById('chatMessages').appendChild(um);document.getElementById('chatMessages').scrollTop=document.getElementById('chatMessages').scrollHeight;isAIThinking=true;showChatTyping();const p=resumeData.personal;const sys=`You are a resume assistant helping ${p.firstName||'a student'} build their resume. They are enrolled at a trade school. Be genuinely helpful — not just for resume questions but for anything that helps them complete their resume accurately.\n\nYou CAN and SHOULD:\n- Look up employer names, addresses, cities, and states from your training knowledge\n- Find school or campus addresses\n- Help format dates, job titles, and descriptions\n- Suggest professional wording for duties and skills\n- Answer any question that helps the student fill in accurate resume information\n\nCurrent section: ${currentSection||'start'}. Be direct and complete. If you know the address or information, give it. Do not refuse helpful requests. Do not use filler phrases.`;chatHistory.push({role:'user',content:text});try{const reply=await callClaude(sys,chatHistory.slice(-8));hideChatTyping();chatHistory.push({role:'assistant',content:reply});addAIMsg(reply);}catch(e){hideChatTyping();addAIMsg('Sorry, I had trouble connecting. Please try again.');}}

function handleChatKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}}
function autoResizeChat(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,90)+'px';}

// ── Resume Review (pre-build quality check) ──────────────
async function runResumeReview() {
  const msgs = document.getElementById('chatMessages');
  if (!msgs) return;

  showChatTyping();

  const jobs    = resumeData.workExperience || [];
  const program = (resumeData.personal || {}).program || '';

  const workSummary = jobs.length === 0
    ? 'No work experience entered.'
    : jobs.map((j, i) => {
        const bullets = (j.bulletLines || []).map(b => '  • ' + b).join('\n');
        return `Job ${i + 1}: ${j.jobTitle} at ${j.employer}\n${bullets || '  (no bullets)'}`;
      }).join('\n\n');

  const sys = `You are a friendly career advisor reviewing a trade school student's resume.
The resume was AI-assisted so it should already be solid. Find 2-3 optional improvements.
Be encouraging. Return ONLY valid JSON.`;

  const msg = `Review this student's work experience for their resume.
Program: ${program}

Work Experience:
${workSummary}

Return ONLY this JSON — no other text:
{
  "readinessScore": <number 75-95>,
  "readinessLabel": "<Ready to Build|Looking Good|Strong>",
  "working": ["specific strength 1", "specific strength 2"],
  "suggestions": ["optional tip 1", "optional tip 2"]
}

Rules:
- readinessScore: 85-95 for strong work, 75-84 for decent. AI helped write it so min 75.
- working: 2-3 concrete observations. Reference specific employers/jobs when possible.
- suggestions: 2-3 optional tips. Start each with "Consider..." or "You might...". 1 sentence max.`;

  try {
    const raw   = await callClaude(sys, [{ role: 'user', content: msg }], { maxTokens: 600 });
    hideChatTyping();
    const match = raw.match(/\{[\s\S]*\}/);
    if (!match) throw new Error('no json');
    addReviewCard(JSON.parse(match[0]));
  } catch(e) {
    hideChatTyping();
    // Silent fallback — do nothing extra, the tip text is already shown
  }
}

function addReviewCard(review) {
  const msgs = document.getElementById('chatMessages');
  if (!msgs) return;

  const score    = Math.min(95, Math.max(60, review.readinessScore || 82));
  const label    = escHtml(review.readinessLabel || 'Looking Good');
  const barGrad  = score >= 84 ? 'linear-gradient(90deg,#15803d,#22c55e)'
                 : score >= 75 ? 'linear-gradient(90deg,#1d4ed8,#60a5fa)'
                 :               'linear-gradient(90deg,#d97706,#fbbf24)';
  const lblClr   = score >= 84 ? '#15803d' : score >= 75 ? '#1d4ed8' : '#d97706';

  const uid = 'rvb_' + Date.now();

  const workingHtml = (review.working || []).slice(0, 3)
    .map(w => `<li class="rv-li"><span class="rv-li-icon">✅</span><span>${escHtml(w)}</span></li>`)
    .join('');

  const suggHtml = (review.suggestions || []).slice(0, 3)
    .map(s => `<li class="rv-li"><span class="rv-li-icon">💡</span><span>${escHtml(s)}</span></li>`)
    .join('');

  const div = document.createElement('div');
  div.className = 'chat-msg ai';
  div.innerHTML = `
    <div class="msg-lbl">Resume Review</div>
    <div class="msg-bubble" style="padding:0;overflow:hidden;border-radius:10px 10px 10px 3px">
      <div class="rv-hdr">✨ Resume Review</div>
      <div class="rv-body">
        <div class="rv-sect-lbl">Resume Strength</div>
        <div class="rv-meter-row">
          <div class="rv-track"><div class="rv-bar" id="${uid}" style="background:${barGrad}"></div></div>
          <div class="rv-lbl" style="color:${lblClr}">${label}</div>
        </div>
        ${workingHtml ? `<div class="rv-sect-lbl">What's Working</div><ul class="rv-list">${workingHtml}</ul>` : ''}
        ${suggHtml    ? `<div class="rv-sep"></div><div class="rv-sect-lbl">Opportunities</div><ul class="rv-list">${suggHtml}</ul>` : ''}
      </div>
    </div>`;

  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;

  // Animate the strength bar in
  setTimeout(() => {
    const bar = document.getElementById(uid);
    if (bar) bar.style.width = score + '%';
  }, 180);
}

function escHtml(str){if(!str)return '';const d=document.createElement('div');d.appendChild(document.createTextNode(String(str)));return d.innerHTML;}
