<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Information</title>
<link rel="stylesheet" href="style.css">

<style>

.page-title{
  text-align:center;
  color:#0b3c6d;
  margin-bottom:30px;
  font-size:28px;
}

.system{
  color:#0b3c6d;
  font-weight:600;
  margin-top:15px;
}

/* GRID LAYOUT */
.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-bottom:10px;
}

.form-row-3{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:15px;
  margin-bottom:10px;
}

input, select{
  width:100%;
  padding:8px;
  margin-top:4px;
}

</style>
</head>

<body>

<div class="chat">

<!-- Title removed -->

<div class="system">What is your full name?</div>
<input id="name" placeholder="Full Name" onblur="formatNameInput()">

<!-- EMAIL + PHONE -->
<div class="form-row">

<div>
<div class="system">Professional Email</div>
<input id="email" placeholder="name@email.com">
</div>

<div>
<div class="system">Phone Number</div>
<input id="phone" placeholder="555-555-5555">
</div>

</div>

<div class="system">Street Address</div>
<input id="address" placeholder="123 Main Street" onblur="formatAddressInput()">

<!-- CITY STATE ZIP -->
<div class="form-row-3">

<div>
<div class="system">City</div>
<input id="city" placeholder="New Castle" onblur="formatCityInput()">
</div>

<div>
<div class="system">State</div>
<select id="state">
<option value="">Select</option>
<option>AL</option><option>AK</option><option>AZ</option><option>AR</option>
<option>CA</option><option>CO</option><option>CT</option><option>DE</option>
<option>FL</option><option>GA</option><option>HI</option><option>ID</option>
<option>IL</option><option>IN</option><option>IA</option><option>KS</option>
<option>KY</option><option>LA</option><option>ME</option><option>MD</option>
<option>MA</option><option>MI</option><option>MN</option><option>MS</option>
<option>MO</option><option>MT</option><option>NE</option><option>NV</option>
<option>NH</option><option>NJ</option><option>NM</option><option>NY</option>
<option>NC</option><option>ND</option><option>OH</option><option>OK</option>
<option>OR</option><option>PA</option><option>RI</option><option>SC</option>
<option>SD</option><option>TN</option><option>TX</option><option>UT</option>
<option>VT</option><option>VA</option><option>WA</option><option>WV</option>
<option>WI</option><option>WY</option>
</select>
</div>

<div>
<div class="system">ZIP</div>
<input id="zip" placeholder="16101">
</div>

</div>

<div class="system">Select Your Campus/Location</div>
<select id="campus" onchange="updatePrograms()">
<option value="">-- Select Campus --</option>
<option value="main">Main Campus (New Castle, PA)</option>
<option value="east">East Liverpool Campus (East Liverpool, OH)</option>
<option value="satellite">Satellite Campus (Pulaski, PA)</option>
<option value="baltimore">North American Trade Schools (Baltimore, MD)</option>
</select>

<div class="system">Select Your Program</div>
<select id="programCampus">
<option value="">-- Select Program --</option>
</select>

<div style="display:none;">
<div class="system">Expected graduation date</div>
<input id="grad" placeholder="05/2026">
</div>

<br><br>

<button type="button" onclick="goBack()">Back</button>
<button type="button" onclick="goNext()">Next</button>

</div>

<script>

/* KEEPING YOUR EXISTING JS */

function getData(){
return JSON.parse(localStorage.getItem("resumeData")) || {};
}

function setData(data){
localStorage.setItem("resumeData", JSON.stringify(data));
}

window.onload=function(){
const data=getData();
document.getElementById("name").value=data.name||"";
document.getElementById("email").value=data.email||"";
document.getElementById("phone").value=data.phone||"";
document.getElementById("address").value=data.address||"";
document.getElementById("city").value=data.city||"";
document.getElementById("state").value=data.state||"";
document.getElementById("zip").value=data.zip||"";
document.getElementById("campus").value=data.campus||"";
document.getElementById("programCampus").value=data.programCampus||"";
document.getElementById("grad").value=data.grad||"";

// Trigger program dropdown update based on saved campus
if(data.campus){
updatePrograms();
}
};

function updatePrograms(){
const campus=document.getElementById("campus").value;
const programSelect=document.getElementById("programCampus");

const programs={
main:[
"Automotive Technology — Main Campus (New Castle, PA)",
"Building Technology — Main Campus (New Castle, PA)",
"Combination Welding — Main Campus (New Castle, PA)",
"Electrical Technology — Main Campus (New Castle, PA)",
"Industrial Electro-Mechanical Technology — Main Campus (New Castle, PA)",
"Refrigeration & A/C Technology — Main Campus (New Castle, PA)"
],
east:[
"Combination Welding — East Liverpool Campus (East Liverpool, OH)",
"Electrical & Industrial Maintenance — East Liverpool Campus (East Liverpool, OH)",
"Refrigeration & Climate Control — East Liverpool Campus (East Liverpool, OH)"
],
satellite:[
"Commercial Truck Driving (Class A CDL) — Satellite Campus (Pulaski, PA)",
"Diesel & Heavy Equipment Repair Technology — Satellite Campus (Pulaski, PA)",
"Heavy Equipment Operations with CDL — Satellite Campus (Pulaski, PA)",
"Machinist & CNC Manufacturing — Satellite Campus (Pulaski, PA)",
"Motorcycle & Power Equipment Technology — Satellite Campus (Pulaski, PA)"
],
baltimore:[
"Building Construction Technology — Certificate in Building Construction Technology",
"Combination Welding — Certificate in Combination Welding",
"Electrical Technology — Certificate in Electrical Technology",
"HVAC (HRVAC) Technology — Certificate in HVAC Technology",
"Diesel Technology — Certificate in Diesel Technology",
"Commercial Truck Driving — Certificate in Commercial Truck Driving + CDL License"
]
};

programSelect.innerHTML='<option value="">-- Select Program --</option>';

if(campus && programs[campus]){
programs[campus].forEach(function(p){
const opt=document.createElement("option");
opt.value=p;
opt.textContent=p;
programSelect.appendChild(opt);
});
}

// Restore previously saved selection
const data=getData();
if(data.programCampus){
programSelect.value=data.programCampus;
}
}

function formatAddress(value){
const suffixes={
"rd":"Rd.","road":"Road",
"st":"St.","street":"Street",
"ave":"Ave.","avenue":"Avenue",
"blvd":"Blvd.","boulevard":"Boulevard",
"dr":"Dr.","drive":"Drive",
"ln":"Ln.","lane":"Lane",
"ct":"Ct.","court":"Court",
"cir":"Cir.","circle":"Circle",
"pl":"Pl.","place":"Place",
"ter":"Ter.","terrace":"Terrace",
"hwy":"Hwy.","highway":"Highway",
"pkwy":"Pkwy.","parkway":"Parkway",
"trl":"Trl.","trail":"Trail",
"way":"Way"
};

const directions={
"n":"N","s":"S","e":"E","w":"W",
"ne":"NE","nw":"NW","se":"SE","sw":"SW"
};

const unitWords={
"apt":"Apt.","apartment":"Apartment",
"unit":"Unit",
"ste":"Ste.","suite":"Suite",
"fl":"Fl.","floor":"Floor"
};

return value.trim().replace(/\S+/g,function(word){
const match=word.match(/^([A-Za-z]+)([.,#]*)$/);
if(!match){return word;}

const letters=match[1];
const punctuation=match[2];
const trailingPunctuation=punctuation.replace(/\./g,"");
const key=letters.toLowerCase().replace(/\.$/,"");

if(suffixes[key]){return suffixes[key]+trailingPunctuation;}
if(directions[key]){return directions[key]+punctuation;}
if(unitWords[key]){return unitWords[key]+trailingPunctuation;}

return letters.charAt(0).toUpperCase()+letters.slice(1).toLowerCase()+punctuation;
});
}

function titleCaseWords(value){
return value.trim().replace(/\S+/g,function(word){
return word
.toLowerCase()
.replace(/(^|[-'])([a-z])/g,function(match,prefix,letter){
return prefix+letter.toUpperCase();
});
});
}

function formatName(value){
return titleCaseWords(value);
}

function formatCity(value){
return titleCaseWords(value);
}

function formatNameInput(){
const nameInput=document.getElementById("name");
nameInput.value=formatName(nameInput.value);
}

function formatCityInput(){
const cityInput=document.getElementById("city");
cityInput.value=formatCity(cityInput.value);
}

function formatAddressInput(){
const addressInput=document.getElementById("address");
addressInput.value=formatAddress(addressInput.value);
}

function saveOnly(){
const data=getData();
data.name=formatName(document.getElementById("name").value);
document.getElementById("name").value=data.name;
data.email=document.getElementById("email").value.trim();
data.phone=document.getElementById("phone").value.trim();
data.address=formatAddress(document.getElementById("address").value);
document.getElementById("address").value=data.address;
data.city=formatCity(document.getElementById("city").value);
document.getElementById("city").value=data.city;
data.state=document.getElementById("state").value.trim().toUpperCase();
data.zip=document.getElementById("zip").value.trim();
data.campus=document.getElementById("campus").value;
data.programCampus=document.getElementById("programCampus").value;
data.grad=document.getElementById("grad").value.trim();
setData(data);
}

function goBack(){
window.location.href="index.html";
}

function goNext(){

const name=document.getElementById("name").value.trim();
const email=document.getElementById("email").value.trim();
const phone=document.getElementById("phone").value.trim();
const address=document.getElementById("address").value.trim();
const city=document.getElementById("city").value.trim();
const state=document.getElementById("state").value.trim();
const zip=document.getElementById("zip").value.trim();
const campus=document.getElementById("campus").value;
const programCampus=document.getElementById("programCampus").value;

if(!name){alert("Full name is required.");return;}
if(!email||!email.includes("@")){alert("Valid professional email required.");return;}
if(!phone){alert("Phone number is required.");return;}
if(!address||!city||!state||!zip){alert("Complete address is required.");return;}
if(!campus){alert("Please select a campus.");return;}
if(!programCampus){alert("Please select a program.");return;}

saveOnly();
window.location.href="objective.html";

}

</script>

</body>
</html>
